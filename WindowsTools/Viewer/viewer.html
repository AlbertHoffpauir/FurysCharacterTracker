.\"\n    return table.concat(lines, \"\\n\")\nend\n\nlocal function BoardColumn(def)\n    return { key = \"weekly.\" .. def.id, title = function() return Title(def) end, width = def.width, bar = false,\n             head = string.format(\"%s, this week.\\nEach row: whether that character has run it (Done or Started).\\nBottom row: this account's best score and place. A leaderboard keeps one entry per account, and its rewards go to the top %d.\\nAmber = a score outside the top %d, or with no place: it needs a better run.\",\n                                  (string.gsub(def.what, \"^%l\", string.upper)), REWARD_PLACES, REWARD_PLACES),\n             value = function(e)\n                 local board = Board(e.c, def.id)\n                 return (board and not board.over and not def.noRun) and board.state or 0\n             end,\n             display = function(_, e) return StateText(Board(e.c, def.id), def) end,\n             dim = function(v) return v == 0 end,\n             gold = function(v) return v == COMPLETED end,\n             foot = function()\n                 local board = AccountBoard(def.id)\n                 local text = ScoreText(board)\n                 return NeedsBetterRun(board) and (AMBER .. text .. \"|r\") or text\n             end,\n             tip = function(e) return BoardTip(e.c, def) end }\nend\n\n-- The line above the columns of the Weekly tab: this week's trial and arena, when the week ends,\n-- and the boards that need a better run.\nfunction CT.WeeklySummary(now)\n    local parts, soonest, redo = {}, nil, {}\n    for _, def in ipairs(BOARDS) do\n        local board = AccountBoard(def.id, now)\n        if board and not board.over then\n            if not soonest or board.endsAt < soonest then soonest = board.endsAt end\n            if NeedsBetterRun(board) then redo[#redo + 1] = Title(def) end\n        end\n    end\n    if not soonest then return \"Nothing read for this week yet: log in on a character of this account\" end\n    parts[#parts + 1] = \"the week ends in \" .. U.Duration(soonest - now)\n    parts[#parts + 1] = \"bottom row = this account's best score and place\"\n    if #redo > 0 then parts[#parts + 1] = AMBER .. \"needs a better run for the rewards: \" .. table.concat(redo, \", \") .. \"|r\" end\n    return table.concat(parts, \"  ·  \")\nend\n\n-- Game only ---------------------------------------------------------------------------------\n\n-- The game only knows a leaderboard after it has been asked for (its own leaderboard window does\n-- the same when you open it): before that the name is empty and the score and place are 0.\n-- `ready[id]` is set once the answer for that board is in, and only then is a read trusted.\nlocal ready = {}\n\nlocal function Pack(endsIn, score, place, started, completed, credited, name)\n    local state = completed and COMPLETED or (started and STARTED or 0)\n    return table.concat({ GetTimeStamp() + endsIn, score, place, state, credited and 1 or 0, U.Clean(U.Plain(name or \"\")) }, \";\")\nend\n\nlocal function Read(c, account)\n    local weekly, before, now = {}, c.weekly or {}, GetTimeStamp()\n    local sharedBefore = account.weekly or {}\n    local raidEndsIn = GetRaidOfTheWeekTimes()\n    if raidEndsIn > 0 then\n        for id, category in pairs({ trial = RAID_CATEGORY_TRIAL, arena = RAID_CATEGORY_CHALLENGE }) do\n            local _, hasWeekly = GetNumRaidLeaderboards(category)\n            if hasWeekly then\n                local name = GetRaidOfTheWeekLeaderboardInfo(category)\n                local place, score = GetRaidOfTheWeekLeaderboardLocalPlayerInfo(category)\n                local _, credited = GetPlayerRaidOfTheWeekParticipationInfo(category)\n                local started, completed = GetPlayerRaidOfTheWeekProgressInfo(category)\n                weekly[id] = Pack(raidEndsIn, score, place, started, completed, credited, name)\n            end\n        end\n    end\n    local archiveEndsIn = GetEndlessDungeonOfTheWeekTimes()\n    if archiveEndsIn > 0 then\n        for id, groupType in pairs({ archiveSolo = ENDLESS_DUNGEON_GROUP_TYPE_SOLO, archiveDuo = ENDLESS_DUNGEON_GROUP_TYPE_DUO }) do\n            local place, score = GetEndlessDungeonOfTheWeekLeaderboardLocalPlayerInfo(groupType)\n            local _, credited = GetPlayerEndlessDungeonOfTheWeekParticipationInfo(groupType)\n            local started, completed = GetPlayerEndlessDungeonOfTheWeekProgressInfo(groupType)\n            weekly[id] = Pack(archiveEndsIn, score, place, started, completed, credited, \"\")\n        end\n    end\n    -- Battlegrounds: the board this character scored highest on.\n    local names = { [BATTLEGROUND_LEADERBOARD_TYPE_COMPETITIVE] = \"Competitive\", [BATTLEGROUND_LEADERBOARD_TYPE_DEATHMATCH] = \"Deathmatch\",\n                    [BATTLEGROUND_LEADERBOARD_TYPE_FLAG_GAMES] = \"Flag games\", [BATTLEGROUND_LEADERBOARD_TYPE_LAND_GRAB] = \"Land grab\" }\n    local boardType = GetNextBattlegroundLeaderboardType()\n    local best\n    while boardType do\n        if ShouldShowLeaderboardForBattlegroundLeaderboardType(boardType) then\n            local place, score = GetBattlegroundLeaderboardLocalPlayerInfo(boardType)\n            local endsIn = GetBattlegroundLeaderboardsSchedule(boardType)\n            if endsIn > 0 and (not best or score > best.score) then\n                best = { score = score, place = place, endsIn = endsIn, name = names[boardType] or \"\" }\n            end\n        end\n        boardType = GetNextBattlegroundLeaderboardType(boardType)\n    end\n    if best then weekly.battleground = Pack(best.endsIn, best.score, best.place, false, false, false, best.name) end\n    -- Cyrodiil: the reward tier earned in the home campaign.\n    local campaignId = GetAssignedCampaignId()\n    if campaignId ~= 0 then\n        local endsIn = GetSecondsUntilCampaignEnd(campaignId)\n        if endsIn > 0 then\n            local tier, progress, needed = GetPlayerCampaignRewardTierInfo(campaignId)\n            weekly.cyrodiil = table.concat({ GetTimeStamp() + endsIn, tier, progress, needed, 0, U.Clean(U.Plain(GetCampaignName(campaignId))) }, \";\")\n        end\n    end\n    -- The scores and places belong to the account: the newest read is the one that counts.\n    -- A board the game has not answered for yet keeps what was saved for this week, if anything.\n    local shared = {}\n    for _, def in ipairs(BOARDS) do\n        local id = def.id\n        if not ready[id] then\n            local mine, ours = Parse(before[id], now), Parse(sharedBefore[id], now)\n            if mine and not mine.over then weekly[id] = before[id] end\n            if ours and not ours.over then shared[id] = sharedBefore[id] end\n        end\n        if not shared[id] then shared[id] = weekly[id] end\n    end\n    c.weekly, c.weeklyOther = weekly, nil\n    account.weekly = shared\nend\n\n-- Asks the game for this week's leaderboards, one at a time, two seconds apart, and reads\n-- again once they have all been asked for (and for any answer that comes in later).\n-- Once after logging in, and again after the weekly turnover.\nlocal REQUEST_GAP_MS = 2000\nlocal function Start(queue)\n    local asking = false\n    local function Got(id)\n        ready[id] = true\n        if not asking then queue() end\n    end\n    local function Ask()\n        local steps = {}\n        for id, category in pairs({ trial = RAID_CATEGORY_TRIAL, arena = RAID_CATEGORY_CHALLENGE }) do\n            steps[#steps + 1] = function()\n                if QueryRaidLeaderboardData(category, 0) == LEADERBOARD_DATA_READY then Got(id) end\n            end\n        end\n        for id, groupType in pairs({ archiveSolo = ENDLESS_DUNGEON_GROUP_TYPE_SOLO, archiveDuo = ENDLESS_DUNGEON_GROUP_TYPE_DUO }) do\n            steps[#steps + 1] = function()\n                if QueryEndlessDungeonLeaderboardData(groupType, 0) == LEADERBOARD_DATA_READY then Got(id) end\n            end\n        end\n        local boardType = GetNextBattlegroundLeaderboardType()\n        while boardType do\n            local thisType = boardType\n            if ShouldShowLeaderboardForBattlegroundLeaderboardType(thisType) then\n                steps[#steps + 1] = function()\n                    if QueryBattlegroundLeaderboardData(thisType) == LEADERBOARD_DATA_READY then Got(\"battleground\") end\n                end\n            end\n            boardType = GetNextBattlegroundLeaderboardType(boardType)\n        end\n        asking = true\n        for i, step in ipairs(steps) do zo_callLater(step, i * REQUEST_GAP_MS) end\n        zo_callLater(function()\n            asking = false\n            queue()\n        end, (#steps + 1) * REQUEST_GAP_MS)\n    end\n    local name = CT.name .. \"Weekly\"\n    EVENT_MANAGER:RegisterForEvent(name, EVENT_RAID_LEADERBOARD_DATA_RECEIVED, function(_, category)\n        Got(category == RAID_CATEGORY_TRIAL and \"trial\" or \"arena\")\n    end)\n    EVENT_MANAGER:RegisterForEvent(name, EVENT_ENDLESS_DUNGEON_LEADERBOARD_DATA_RECEIVED, function(_, groupType)\n        Got(groupType == ENDLESS_DUNGEON_GROUP_TYPE_SOLO and \"archiveSolo\" or \"archiveDuo\")\n    end)\n    EVENT_MANAGER:RegisterForEvent(name, EVENT_BATTLEGROUND_LEADERBOARD_DATA_RECEIVED, function() Got(\"battleground\") end)\n    local function Turnover()\n        ready = {}\n        zo_callLater(Ask, 30000)\n    end\n    EVENT_MANAGER:RegisterForEvent(name, EVENT_RAID_OF_THE_WEEK_TURNOVER, Turnover)\n    EVENT_MANAGER:RegisterForEvent(name, EVENT_ENDLESS_DUNGEON_OF_THE_WEEK_TURNOVER, Turnover)\n    Ask()\nend\n\n-- Columns -----------------------------------------------------------------------------------\n\nlocal columns = {}\nfor _, def in ipairs(BOARDS) do columns[#columns + 1] = BoardColumn(def) end\n\n-- The saved campaign of a character: nil, { over = true }, or { endsAt =, tier =, progress =, needed =, name = }.\nlocal function Campaign(c, now)\n    local text = (c.weekly or {}).cyrodiil\n    if not text then return nil end\n    local p = U.Split(text, \";\")\n    local endsAt = tonumber(p[1]) or 0\n    if endsAt <= (now or GetTimeStamp()) then return { over = true } end\n    return { endsAt = endsAt, tier = tonumber(p[2]) or 0, progress = tonumber(p[3]) or 0, needed = tonumber(p[4]) or 0, name = p[6] or \"\" }\nend\n\ncolumns[#columns + 1] = {\n    key = \"weekly.cyrodiil\", title = \"Cyrodiil\", width = 96, bar = false,\n    head = \"Cyrodiil: the reward tier this character has earned in its home campaign.\\nThe rewards are mailed when the campaign ends. A campaign lasts 7 or 30 days: hover a cell for which one and when it ends.\",\n    value = function(e)\n        local campaign = Campaign(e.c)\n        return (campaign and not campaign.over) and campaign.tier or 0\n    end,\n    display = function(v) return v > 0 and (\"Tier \" .. v) or \"-\" end,\n    dim = function(v) return v == 0 end,\n    tip = function(e)\n        local campaign = Campaign(e.c)\n        if not campaign then return \"No home campaign, or not read yet: log in on this character once.\" end\n        if campaign.over then return \"The campaign has ended since this character was last read.\" end\n        local lines = { \"Home campaign: \" .. campaign.name, campaign.tier > 0 and (\"Reward tier earned: \" .. campaign.tier) or \"No reward tier earned yet.\" }\n        if campaign.needed > 0 then\n            lines[#lines + 1] = string.format(\"Next tier: %s of %s Alliance Points\", U.Comma(campaign.progress), U.Comma(campaign.needed))\n        end\n        lines[#lines + 1] = \"The campaign ends in \" .. U.Duration(campaign.endsAt - GetTimeStamp()) .. \".\"\n        return table.concat(lines, \"\\n\")\n    end }\n\nCT.Track({\n    id = \"weekly\",\n    read = Read,\n    events = { EVENT_RAID_LEADERBOARD_PLAYER_DATA_CHANGED, EVENT_RAID_OF_THE_WEEK_TURNOVER, EVENT_RAID_TRIAL_COMPLETE,\n               EVENT_RAID_TRIAL_NEW_BEST_SCORE, EVENT_ENDLESS_DUNGEON_LEADERBOARD_PLAYER_DATA_CHANGED,\n               EVENT_ENDLESS_DUNGEON_OF_THE_WEEK_TURNOVER, EVENT_ENDLESS_DUNGEON_NEW_BEST_SCORE,\n               EVENT_ASSIGNED_CAMPAIGN_CHANGED },\n    start = Start,\n    columns = columns,\n    sections = function(e)\n        local items, now = {}, GetTimeStamp()\n        for _, def in ipairs(BOARDS) do\n            local text = StateText(Board(e.c, def.id, now), def)\n            if text ~= \"-\" then\n                local account = AccountBoard(def.id, now)\n                local name = Title(def)\n                items[#items + 1] = { name, text, done = text == \"Done\" }\n            end\n        end\n        local campaign = Campaign(e.c, now)\n        if campaign and not campaign.over and campaign.tier > 0 then items[#items + 1] = { \"Cyrodiil: \" .. campaign.name, \"Tier \" .. campaign.tier } end\n        if #items == 0 then return nil end\n        return { { id = \"weekly\", title = \"This week\", items = items } }\n    end,\n})\n"}, {"name": "Trackers/Wallet.lua", "text": "-- shared\n-- Money, bag space and Champion Points spent.\n--   c.gold, c.telvar, c.ap, c.vouchers   what the character carries\n--   c.bagUsed, c.bagSize\n--   c.cp = { { name =, spent =, unspent = }, ... }   one per Champion Point tree\n--   account.bankGold, bankTelvar, bankAP, bankVouchers, bankUsed, bankSize\n--   account.wallet = { \"Transmute Crystals|1234\", ... }   what the whole account shares\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\n\n-- Game only.\nlocal function Read(c, account)\n    local function Carried(currency) return GetCurrencyAmount(currency, CURRENCY_LOCATION_CHARACTER) or 0 end\n    local function Banked(currency) return GetCurrencyAmount(currency, CURRENCY_LOCATION_BANK) or 0 end\n    c.gold, c.telvar = Carried(CURT_MONEY), Carried(CURT_TELVAR_STONES)\n    c.ap, c.vouchers = Carried(CURT_ALLIANCE_POINTS), Carried(CURT_WRIT_VOUCHERS)\n    c.bagUsed, c.bagSize = GetNumBagUsedSlots(BAG_BACKPACK), GetBagSize(BAG_BACKPACK)\n    c.cp = {}\n    for index = 1, GetNumChampionDisciplines() do\n        local id = GetChampionDisciplineId(index)\n        c.cp[index] = { name = U.Plain(GetChampionDisciplineName(id)), spent = GetNumSpentChampionPoints(id),\n                        unspent = GetNumUnspentChampionPoints(id) }\n    end\n    account.bankGold, account.bankTelvar = Banked(CURT_MONEY), Banked(CURT_TELVAR_STONES)\n    account.bankAP, account.bankVouchers = Banked(CURT_ALLIANCE_POINTS), Banked(CURT_WRIT_VOUCHERS)\n    account.bankUsed = GetNumBagUsedSlots(BAG_BANK) + GetNumBagUsedSlots(BAG_SUBSCRIBER_BANK)\n    account.bankSize = GetBagSize(BAG_BANK) + GetBagSize(BAG_SUBSCRIBER_BANK)\n    -- Everything the account shares, under the game's own names.\n    local shared = { CURT_TRANSMUTE_CRYSTALS, CURT_UNDAUNTED_KEYS, CURT_SEALS, CURT_ARCHIVAL_FORTUNES, CURT_IMPERIAL_FRAGMENTS,\n                     CURT_TRADE_BARS, CURT_TOME_POINTS, CURT_TOME_TOKENS, CURT_TOME_POINT_CACHES, CURT_TOME_CHALLENGE_REROLLS,\n                     CURT_UNDAUNTED_CRESTS, CURT_STYLE_STONES, CURT_CROWN_GEMS, CURT_CROWNS }\n    local wallet = {}\n    for _, currency in ipairs(shared) do\n        if IsCurrencyValid(currency) and GetCurrencyPlayerStoredLocation(currency) == CURRENCY_LOCATION_ACCOUNT then\n            local amount = GetCurrencyAmount(currency, CURRENCY_LOCATION_ACCOUNT) or 0\n            if amount > 0 then wallet[#wallet + 1] = U.Clean(U.Plain(GetCurrencyName(currency, false, false))) .. \"|\" .. amount end\n        end\n    end\n    account.wallet, account.transmutes = wallet, nil\nend\n\n-- The top line of the Wallet tab: the bank, then what the account shares. Returns the line and,\n-- for the hover text, the same thing one item per line.\nfunction CT.WalletSummary(data)\n    local a = data.account or {}\n    if not a.bankGold then return \"Bank: not read yet. Log in on any character of this account.\", nil end\n    local short = string.format(\"Bank: %s gold  ·  %s Tel Var  ·  %s AP  ·  %s vouchers  ·  space %d/%d\",\n        U.Comma(a.bankGold), U.Comma(a.bankTelvar), U.Comma(a.bankAP), U.Comma(a.bankVouchers), a.bankUsed or 0, a.bankSize or 0)\n    local long = { \"In the bank\", \"  Gold  \" .. U.Comma(a.bankGold), \"  Tel Var  \" .. U.Comma(a.bankTelvar), \"  Alliance Points  \" .. U.Comma(a.bankAP),\n                   \"  Writ vouchers  \" .. U.Comma(a.bankVouchers), string.format(\"  Bank space  %d / %d\", a.bankUsed or 0, a.bankSize or 0) }\n    local shared = {}\n    for _, text in ipairs(a.wallet or {}) do\n        local p = U.Split(text, \"|\")\n        shared[#shared + 1] = { name = p[1], amount = tonumber(p[2]) or 0 }\n    end\n    if not a.wallet and a.transmutes then shared[1] = { name = \"Transmute Crystals\", amount = a.transmutes } end\n    if #shared > 0 then\n        long[#long + 1] = \"\\nShared by the whole account\"\n        local parts = {}\n        for _, item in ipairs(shared) do\n            long[#long + 1] = string.format(\"  %s  %s\", item.name, U.Comma(item.amount))\n            parts[#parts + 1] = string.format(\"%s %s\", U.Comma(item.amount), item.name)\n        end\n        short = short .. \"  ·  Account: \" .. table.concat(parts, \"  ·  \")\n    end\n    return short, table.concat(long, \"\\n\")\nend\n\nlocal function Money(key, title, width, field, what)\n    return { key = key, title = title, width = width, sum = true, head = what .. \" by this character. The bottom row is the total.\",\n             value = function(e) return e.c[field] or 0 end,\n             display = function(v) return U.Comma(v) end, dim = function(v) return v == 0 end, tip = what }\nend\n\nlocal function Tree(e, index) return (e.c.cp or {})[index] end\n\nlocal function ChampionTree(index)\n    return { key = \"cp\" .. index, width = 96,\n             -- Tree names come from the game; the first character that has them names the column.\n             title = function()\n                 for _, id in ipairs(CT.Data().order) do\n                     local c = CT.Data().characters[id]\n                     local tree = c and c.cp and c.cp[index]\n                     if tree then return tree.name end\n                 end\n                 return \"CP \" .. index\n             end,\n             head = \"Champion Points spent in this tree, out of the points this character has for it.\",\n             max = function(e) local t = Tree(e, index); return t and (t.spent + t.unspent) > 0 and (t.spent + t.unspent) or nil end,\n             value = function(e) local t = Tree(e, index); return t and t.spent or 0 end,\n             display = function(v, e) local t = Tree(e, index); return t and U.Of(v, t.spent + t.unspent) or \"-\" end,\n             tip = function(e)\n                 local t = Tree(e, index)\n                 if not t then return \"Not read yet\" end\n                 return string.format(\"%s: %d spent, %d not spent\\nViolet = every point in this tree spent\", t.name, t.spent, t.unspent)\n             end }\nend\n\nCT.Track({\n    id = \"wallet\",\n    read = Read,\n    events = { EVENT_MONEY_UPDATE, EVENT_CURRENCY_UPDATE, EVENT_CHAMPION_PURCHASE_RESULT, EVENT_UNSPENT_CHAMPION_POINTS_CHANGED },\n    start = function(queue)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"Bag\", EVENT_INVENTORY_SINGLE_SLOT_UPDATE, queue)\n        EVENT_MANAGER:AddFilterForEvent(CT.name .. \"Bag\", EVENT_INVENTORY_SINGLE_SLOT_UPDATE, REGISTER_FILTER_BAG_ID, BAG_BACKPACK)\n    end,\n    columns = {\n        Money(\"gold\", \"Gold\", 112, \"gold\", \"Gold carried\"), Money(\"telvar\", \"Tel Var\", 88, \"telvar\", \"Tel Var stones carried\"),\n        Money(\"ap\", \"AP\", 100, \"ap\", \"Alliance Points held\"), Money(\"vouchers\", \"Vouchers\", 96, \"vouchers\", \"Writ vouchers held\"),\n        { key = \"bag\", title = \"Bag\", width = 84, bar = false, value = function(e) return e.c.bagUsed or 0 end,\n          head = \"Bag: backpack slots used, out of the slots this character has.\",\n          display = function(v, e) return e.c.bagSize and U.Of(v, e.c.bagSize) or \"-\" end,\n          dim = function(_, e) return not e.c.bagSize end,\n          tip = function(e) return e.c.bagSize and string.format(\"Backpack: %d used, %d free\", e.c.bagUsed, e.c.bagSize - e.c.bagUsed) or \"Not read yet\" end },\n        ChampionTree(1), ChampionTree(2), ChampionTree(3),\n    },\n    sections = function(e)\n        local c = e.c\n        local section = { title = \"Wallet & CP\", items = {\n            { \"Gold\", U.Comma(c.gold) }, { \"Tel Var\", U.Comma(c.telvar) }, { \"Alliance Points\", U.Comma(c.ap) }, { \"Writ vouchers\", U.Comma(c.vouchers) },\n            { \"Bag\", c.bagSize and (U.Whole(c.bagUsed) .. \" / \" .. U.Whole(c.bagSize)) or \"-\" } } }\n        for _, t in ipairs(c.cp or {}) do\n            section.items[#section.items + 1] = { t.name, U.Whole(t.spent) .. \" / \" .. U.Whole(t.spent + t.unspent), done = t.unspent == 0 and t.spent > 0 }\n        end\n        return { section }\n    end,\n    export = {\n        { \"Gold\", function(e) return e.c.gold end }, { \"Tel Var\", function(e) return e.c.telvar end },\n        { \"Alliance Points\", function(e) return e.c.ap end }, { \"Writ vouchers\", function(e) return e.c.vouchers end },\n        { \"Bag used\", function(e) return e.c.bagUsed end }, { \"Bag size\", function(e) return e.c.bagSize end },\n    },\n})\n"}, {"name": "Trackers/Collections.lua", "text": "-- shared\n-- What the whole account shares, read from whichever character is logged in: Champion Points,\n-- the achievement total, every character on the account (for the rows of characters not read\n-- yet), the item set collection and outfit styles. They show on the brag card.\nlocal CT = FurysCharacterTracker\n\nCT.Track({\n    id = \"account\",\n    read = function(_, account)\n        account.championPoints = GetPlayerChampionPointsEarned()\n        account.achievementTotal = GetTotalAchievementPoints()\n        local roster = {}\n        for index, info in ipairs(CT.Roster:GameCharacters()) do roster[index] = CT.Roster.RosterLine(info) end\n        account.roster, account.characterNames = roster, nil\n        account.lastScan = GetTimeStamp()\n    end,\n    events = { EVENT_CHAMPION_POINT_GAINED },\n})\n\n-- The item set collection (\"sticker book\"): set pieces unlocked.\nCT.Track({\n    id = \"setItems\",\n    read = function(_, account)\n        local pieces, piecesTotal = 0, 0\n        local setId = GetNextItemSetCollectionId()\n        while setId do\n            piecesTotal = piecesTotal + GetNumItemSetCollectionPieces(setId)\n            pieces = pieces + GetNumItemSetCollectionSlotsUnlocked(setId)\n            setId = GetNextItemSetCollectionId(setId)\n        end\n        account.setPieces, account.setPiecesTotal = pieces, piecesTotal\n    end,\n    events = { EVENT_ITEM_SET_COLLECTION_UPDATED, EVENT_ITEM_SET_COLLECTIONS_UPDATED },\n})\n\nCT.Track({\n    id = \"outfitStyles\",\n    read = function(_, account)\n        local styles, stylesTotal = 0, 0\n        local categoryType = COLLECTIBLE_CATEGORY_TYPE_OUTFIT_STYLE\n        for index = 1, GetTotalCollectiblesByCategoryType(categoryType) do\n            stylesTotal = stylesTotal + 1\n            if IsCollectibleUnlocked(GetCollectibleIdFromType(categoryType, index)) then styles = styles + 1 end\n        end\n        account.outfitStyles, account.outfitStylesTotal = styles, stylesTotal\n    end,\n    -- Collectibles change for many reasons (a pet summoned, a hat hidden): only outfit styles matter here.\n    start = function(queue)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"OutfitStyle\", EVENT_COLLECTIBLE_UPDATED, function(_, collectibleId)\n            if GetCollectibleCategoryType(collectibleId) == COLLECTIBLE_CATEGORY_TYPE_OUTFIT_STYLE then queue() end\n        end)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"OutfitStyles\", EVENT_COLLECTIBLES_UNLOCK_STATE_CHANGED, queue)\n    end,\n})\n"}, {"name": "Trackers/Gear.lua", "text": "-- shared\n-- What the character is wearing, read from the game. One text per filled slot:\n--   c.gear = { \"slot|item name|quality|trait|set name|pieces of that set worn\", ... }\n-- slot = a number from the SLOTS list below; quality = the game's quality number (1 white ... 5 gold, 6 mythic).\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\n-- Slot names in board order (the reader below lists the game's slots in the same order).\nlocal SLOTS = { \"Head\", \"Shoulders\", \"Chest\", \"Hands\", \"Waist\", \"Legs\", \"Feet\", \"Necklace\", \"Ring\", \"Ring\",\n                \"Main hand\", \"Off hand\", \"Back bar\", \"Back bar off hand\" }\n-- The game's item quality colors.\nlocal QUALITY_COLOR = { [0] = \"8A86B0\", [1] = \"ECEAF8\", [2] = \"2DC50E\", [3] = \"3A92FF\", [4] = \"A02EF7\", [5] = \"EECA2A\", [6] = \"FF8200\" }\n\n-- The saved gear of a character as a list of { slot =, name =, quality =, trait =, set =, pieces = }.\nlocal function Items(c)\n    local list = {}\n    for _, text in ipairs(c.gear or {}) do\n        local p = U.Split(text, \"|\")\n        list[#list + 1] = { slot = SLOTS[tonumber(p[1]) or 0] or \"?\", name = p[2] or \"\", quality = tonumber(p[3]) or 1, trait = p[4] or \"\",\n                            set = p[5] or \"\", pieces = tonumber(p[6]) or 0 }\n    end\n    return list\nend\n\n-- The sets being worn, most pieces first: { { name =, pieces = }, ... }.\nlocal function Sets(c)\n    local bySet, list = {}, {}\n    for _, item in ipairs(Items(c)) do\n        if item.set ~= \"\" then\n            if not bySet[item.set] then\n                bySet[item.set] = { name = item.set, pieces = 0 }\n                list[#list + 1] = bySet[item.set]\n            end\n            bySet[item.set].pieces = math.max(bySet[item.set].pieces, item.pieces)\n        end\n    end\n    table.sort(list, function(a, b)\n        if a.pieces ~= b.pieces then return a.pieces > b.pieces end\n        return a.name < b.name\n    end)\n    return list\nend\n\nlocal function SetsText(c, separator)\n    local parts = {}\n    for i, set in ipairs(Sets(c)) do parts[i] = U.Whole(set.pieces) .. \" \" .. set.name end\n    return table.concat(parts, separator)\nend\nCT.GearSets = SetsText\n\nlocal function ItemLine(item, colored)\n    local name = colored and string.format(\"|c%s%s|r\", QUALITY_COLOR[item.quality] or QUALITY_COLOR[1], item.name) or item.name\n    local text = string.format(\"%s: %s\", item.slot, name)\n    if item.trait ~= \"\" then text = text .. \"  ·  \" .. item.trait end\n    return text\nend\n\nCT.Track({\n    id = \"gear\",\n    read = function(c)\n        local slots = { EQUIP_SLOT_HEAD, EQUIP_SLOT_SHOULDERS, EQUIP_SLOT_CHEST, EQUIP_SLOT_HAND, EQUIP_SLOT_WAIST, EQUIP_SLOT_LEGS,\n                        EQUIP_SLOT_FEET, EQUIP_SLOT_NECK, EQUIP_SLOT_RING1, EQUIP_SLOT_RING2, EQUIP_SLOT_MAIN_HAND, EQUIP_SLOT_OFF_HAND,\n                        EQUIP_SLOT_BACKUP_MAIN, EQUIP_SLOT_BACKUP_OFF }\n        local gear = {}\n        for index, slot in ipairs(slots) do\n            local link = GetItemLink(BAG_WORN, slot, LINK_STYLE_DEFAULT)\n            if link ~= \"\" then\n                local hasSet, setName, _, normal, _, _, perfected = GetItemLinkSetInfo(link, true)\n                local traitType = GetItemLinkTraitInfo(link)\n                local trait = traitType ~= ITEM_TRAIT_TYPE_NONE and U.Plain(GetString(\"SI_ITEMTRAITTYPE\", traitType)) or \"\"\n                gear[#gear + 1] = table.concat({ index, U.Clean(U.Plain(GetItemLinkName(link))), GetItemLinkDisplayQuality(link), U.Clean(trait),\n                                                 hasSet and U.Clean(U.Plain(setName)) or \"\", hasSet and ((normal or 0) + (perfected or 0)) or 0 }, \"|\")\n            end\n        end\n        c.gear = gear\n    end,\n    start = function(queue)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"Worn\", EVENT_INVENTORY_SINGLE_SLOT_UPDATE, queue)\n        EVENT_MANAGER:AddFilterForEvent(CT.name .. \"Worn\", EVENT_INVENTORY_SINGLE_SLOT_UPDATE, REGISTER_FILTER_BAG_ID, BAG_WORN)\n    end,\n    columns = {\n        { key = \"wearing\", title = \"Wearing\", width = 270, align = \"left\",\n          head = \"Wearing: the sets this character had on when it was last read, with how many pieces of each.\\nHover a cell for every slot.\",\n          value = function(e) return SetsText(e.c, \"  ·  \") end,\n          display = function(v, e) return v ~= \"\" and v or (e.c.gear and #e.c.gear > 0 and \"no sets\" or \"-\") end,\n          dim = function(v) return v == \"\" end,\n          tip = function(e)\n              if not e.c.gear then return \"Not read yet: log in on this character once.\" end\n              if #e.c.gear == 0 then return \"Nothing equipped.\" end\n              local lines = {}\n              for _, set in ipairs(Sets(e.c)) do lines[#lines + 1] = string.format(\"%d  %s\", set.pieces, set.name) end\n              if #lines > 0 then lines[#lines + 1] = \"\" end\n              for _, item in ipairs(Items(e.c)) do lines[#lines + 1] = ItemLine(item, true) end\n              return table.concat(lines, \"\\n\")\n          end },\n    },\n    sections = function(e)\n        if not e.c.gear or #e.c.gear == 0 then return nil end\n        local section = { title = \"Wearing\", lines = {} }\n        local sets = SetsText(e.c, \"  ·  \")\n        if sets ~= \"\" then section.lines[1] = { sets, bold = true } end\n        for _, item in ipairs(Items(e.c)) do\n            local text = ItemLine(item, true)\n            if item.set ~= \"\" then text = text .. \"  ·  \" .. item.set end\n            section.lines[#section.lines + 1] = \"    \" .. text\n        end\n        return { section }\n    end,\n    export = { { \"Wearing\", function(e) return SetsText(e.c, \", \") end } },\n})\n"}, {"name": "Trackers/Progress.lua", "text": "-- shared\n-- Progress over time: what each character gained in the last 7 and 30 days. Nothing is read from\n-- the game here; it compares today's numbers with the daily lines kept by Core/History.lua.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal H = CT.History\n\nlocal FIELDS = {\n    { field = \"gold\", title = \"Gold\", what = \"Gold carried\", width = 96, short = true },\n    { field = \"playedHours\", title = \"Hours\", what = \"Hours played\", width = 76 },\n    { field = \"skillPoints\", title = \"Skill pts\", what = \"Skill points earned\", width = 88 },\n    { field = \"achievementPoints\", title = \"Ach. pts\", what = \"Achievement points\", width = 92 },\n    { field = \"research\", title = \"Traits\", what = \"Traits researched\", width = 76 },\n}\n\nlocal function Delta(e, field, days)\n    return H.Delta(CT.Data(), e.id, e.c, field, days)\nend\n\n-- \"+1,234\", \"+45k\" for the wide ones, \"-\" for no change.\nlocal function Change(v, short)\n    if v == 0 then return \"-\" end\n    if short then return (v > 0 and \"+\" or \"\") .. U.Short(v) end\n    return U.Signed(v)\nend\n\nlocal function Column(def, days)\n    return { key = string.format(\"delta.%s.%d\", def.field, days), title = string.format(\"%s %dd\", def.title, days), width = def.width, sum = true,\n             head = string.format(\"%s: the change over the last %d days.\\nA character tracked for less time than that shows the change since its first day.\", def.what, days),\n             value = function(e) return Delta(e, def.field, days) or 0 end,\n             display = function(v) return Change(v, def.short) end, total = function(sum) return Change(sum, def.short) end,\n             dim = function(v) return v == 0 end,\n             tip = function(e)\n                 local delta, day = Delta(e, def.field, days)\n                 if not delta then return \"Nothing to compare with yet.\\nA line is saved for every day you play this character, starting with this version.\" end\n                 return string.format(\"%s: %s since %s\\nNow: %s\", def.what, U.Signed(delta), H.DayText(day), U.Comma(e.c[def.field]))\n             end }\nend\n\nlocal columns = {}\nfor _, def in ipairs(FIELDS) do\n    columns[#columns + 1] = Column(def, 7)\n    columns[#columns + 1] = Column(def, 30)\nend\ncolumns[#columns + 1] = {\n    key = \"trackedSince\", title = \"Tracked since\", width = 112,\n    head = \"Tracked since: the first day this character's progress was saved.\",\n    value = function(e) local day = H.Since(CT.Data(), e.id); return day and H.DayText(day) or \"\" end,\n    display = function(v) return v == \"\" and \"-\" or v end, dim = function(v) return v == \"\" end,\n    tip = function(e)\n        local list = CT.Data().history[e.id]\n        if not list or #list == 0 then return \"Tracking starts the next time you log in on this character.\" end\n        return U.Count(#list, \"day\") .. \" saved, one for every day you played this character.\"\n    end }\n\nCT.Track({\n    id = \"progress\",\n    columns = columns,\n    sections = function(e)\n        local items = {}\n        for _, def in ipairs(FIELDS) do\n            for _, days in ipairs({ 7, 30 }) do\n                local delta = Delta(e, def.field, days)\n                if delta then items[#items + 1] = { string.format(\"%s, %d days\", def.what, days), U.Signed(delta), dim = delta == 0 } end\n            end\n        end\n        if #items == 0 then return nil end\n        return { { title = \"Progress over time\", items = items } }\n    end,\n})\n"}, {"name": "Data/Views.lua", "text": "-- shared\n-- The tabs of the board. Each names its columns by key; the columns themselves are made by the\n-- files in Trackers/. To show a column on a tab, add its key here.\n--   live      the tab shows timers, so it redraws once a minute while it is open\n--   totals    label of the bottom row when it adds up instead of counting maxed characters\n--   summary   function(data, now) -> a line for the top of the tab (and its hover text), instead of the usual one\nlocal CT = FurysCharacterTracker\n\nlocal function Lines(groupId, ...)\n    local keys = { \"name\", \"class\", \"role\" }\n    for _, group in ipairs(CT.GROUPS) do\n        if group.id == groupId then\n            for _, line in ipairs(group.lines) do keys[#keys + 1] = \"line.\" .. line.name end\n        end\n    end\n    for _, key in ipairs({ ... }) do keys[#keys + 1] = key end\n    return keys\nend\n\nCT.VIEWS = {\n    { id = \"overview\", title = \"Overview\", tip = \"Everything at a glance: how many lines of each group are maxed.\",\n      columns = { \"name\", \"class\", \"role\", \"skillPoints\", \"group.weapons\", \"group.armor\", \"group.guilds\", \"group.world\", \"group.crafting\",\n                  \"research\", \"companions\", \"riding\", \"achievements\", \"hours\" } },\n    { id = \"class\", title = \"Class\", tip = \"Who each character is: level, race and alliance, the three class skill lines it is using, whether that is a pure class build or subclassing, and the other class lines it has trained.\",\n      columns = { \"name\", \"class\", \"level\", \"race\", \"alliance\", \"classLine1\", \"classLine2\", \"classLine3\", \"classBuild\", \"classMaxed\", \"classOther\" } },\n    { id = \"weapons\", title = \"Weapons\", tip = \"The rank of every weapon skill line. Top rank is 50.\",\n      columns = Lines(\"weapons\") },\n    { id = \"armor\", title = \"Armor\", tip = \"The rank of the three armor skill lines. Top rank is 50.\",\n      columns = Lines(\"armor\") },\n    { id = \"guilds\", title = \"Guilds & AvA\", tip = \"Guild and Alliance War skill lines. Each has its own top rank: hover a column title.\",\n      columns = Lines(\"guilds\") },\n    { id = \"world\", title = \"World\", tip = \"World skill lines such as Legerdemain, Soul Magic and Vampire, and Scribing.\",\n      columns = Lines(\"world\", \"scribing\") },\n    { id = \"crafting\", title = \"Crafting\", tip = \"The rank of the seven crafting skill lines, and traits researched.\",\n      columns = Lines(\"crafting\", \"research\") },\n    { id = \"traits\", title = \"Research\", live = true,\n      tip = \"Traits known and missing per craft, research slots and timers. Hover a craft for details.\\nResearch timers (button below, or /fct timers) lists every research with its time left.\",\n      columns = { \"name\", \"class\", \"role\", \"research.Smith\", \"research.Cloth\", \"research.Wood\", \"research.Jewelry\", \"researchSlots\", \"researchNext\", \"research\" } },\n    { id = \"daily\", title = \"Daily\", live = true,\n      tip = \"What each character can still do today: crafting writs since today's reset, the riding lesson, free research slots, and the first random dungeon, battleground and Tales of Tribute match of the day (reward and large XP bonus).\",\n      columns = { \"name\", \"writ.Smith\", \"writ.Cloth\", \"writ.Wood\", \"writ.Jewelry\", \"writ.Alchemy\", \"writ.Enchant\", \"writ.Provis\",\n                  \"writsDone\", \"ridingLesson\", \"researchFree\", \"reward.dungeon\", \"reward.battleground\", \"reward.tribute\" } },\n    { id = \"weekly\", title = \"Weekly\", live = true, totals = \"This account\",\n      tip = \"The weekly leaderboards: which characters ran the weekly trial, the weekly arena and Infinite Archive, and on the bottom row this account's best score and place on each, with battlegrounds. Plus the Cyrodiil reward tier per character.\\nAmber = a score outside the top 500, where the rewards go: it needs a better run.\",\n      columns = { \"name\", \"weekly.trial\", \"weekly.arena\", \"weekly.archiveSolo\", \"weekly.archiveDuo\",\n                  \"weekly.battleground\", \"weekly.cyrodiil\" } },\n    { id = \"collections\", title = \"Collections\", tip = \"Recipes, furnishing plans, motifs, scribing, riding, companions and time played.\",\n      columns = { \"name\", \"class\", \"role\", \"recipes\", \"plans\", \"motifs\", \"scribing\", \"riding\", \"companions\", \"achievements\", \"hours\", \"skillPoints\" } },\n    { id = \"points\", title = \"Skill points\", tip = \"Where the skill points still to earn are: skyshards, public dungeon group events and Alliance War rank.\",\n      columns = { \"name\", \"class\", \"skillPoints\", \"unspent\", \"shards\", \"shardPoints\", \"pubDungeons\", \"avaRank\" } },\n    { id = \"wallet\", title = \"Wallet & CP\", totals = \"Total\",\n      tip = \"Gold, Tel Var, Alliance Points, writ vouchers and bag space per character, and Champion Points spent per tree.\\nThe line above the columns shows the bank and what the whole account shares.\",\n      columns = { \"name\", \"class\", \"role\", \"gold\", \"telvar\", \"ap\", \"vouchers\", \"bag\", \"cp1\", \"cp2\", \"cp3\" } },\n    { id = \"progress\", title = \"Progress\", totals = \"Total\",\n      tip = \"What each character gained in the last 7 and 30 days: gold, hours played, skill points, achievement points and traits.\",\n      columns = { \"name\", \"class\", \"delta.gold.7\", \"delta.gold.30\", \"delta.playedHours.7\", \"delta.playedHours.30\", \"delta.skillPoints.7\",\n                  \"delta.skillPoints.30\", \"delta.achievementPoints.7\", \"delta.achievementPoints.30\", \"delta.research.7\", \"delta.research.30\",\n                  \"trackedSince\" } },\n    { id = \"sets\", title = \"Roles & gear\", tip = \"Your own picks and note per character, and the sets each one is wearing. Click a blue cell to change it.\",\n      columns = { \"name\", \"class\", \"rolePick\", \"dpsGear\", \"roleGear\", \"plannedRace\", \"wearing\", \"note\", \"updated\" } },\n}\n\nCT.VIEW_BY_ID = {}\nfor _, view in ipairs(CT.VIEWS) do CT.VIEW_BY_ID[view.id] = view end\n"}, {"name": "Core/Board.lua", "text": "-- shared\n-- The board's rules, with no drawing in them: what each cell says and how it looks, the sort\n-- order, the totals row, the line above the columns. The game window (UI/Window.lua) and the\n-- offline viewer both draw what this file hands them, so they cannot disagree.\n--\n-- A column (made in Trackers/*.lua) is a table with:\n--   key      unique name; a tab lists its columns by key (Data/Views.lua)\n--   title    column title: text, or function() for a title that comes from saved data\n--   width    in pixels\n--   align    \"left\" or \"center\" (the default)\n--   head     hover text of the title: what the column is (text or function())\n--   value    function(e) -> number or text; also what the column sorts by\n--   max      number or function(e): makes it a progress cell, violet when value >= max\n--   display  function(value, e) -> the text shown instead of the plain value\n--   dim      function(value, e) -> true to show the cell dim\n--   gold     function(value, e) -> true to show the cell as maxed\n--   warn     function(value, e) -> true to show the cell amber: it wants your attention\n--   bar      false: no progress bar behind an in-progress value\n--   tip      hover text of a cell: text or function(e)\n--   foot     function(entries) -> the text of the bottom row for this column\n--   sum      true: the totals row adds the column up (total = function(sum) -> text, optional)\n--   pick     { field =, values = }: click for a dropdown of your own picks\n--   note     true: click to edit the note\n--   icon     function(e) -> texture drawn before the text (game only)\n-- `e` is a board entry: { id =, name =, c = saved character, m = your picks }.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal Board = {}\nCT.Board = Board\n\n-- Where the last tab and the sort orders are remembered: your saved data in game, a table that\n-- lasts until the page is closed in the offline viewer.\nlocal sessionPrefs = { sort = {}, lastView = \"overview\" }\nfunction CT.Prefs()\n    return CT.sv or sessionPrefs\nend\n\nfunction Board.View(id)\n    return CT.VIEW_BY_ID[id or CT.Prefs().lastView] or CT.VIEWS[1]\nend\n\nfunction Board.Columns(view)\n    return CT.Trackers.Columns(view.columns)\nend\n\nfunction Board.Title(column)\n    if type(column.title) == \"function\" then return column.title() end\n    return column.title\nend\n\nlocal function Max(column, e)\n    if type(column.max) == \"function\" then return column.max(e) end\n    return column.max\nend\n\n-- What one cell shows: { text =, maxed =, dim =, warn =, pick =, pct = (0 to 1, in progress), value = }.\nfunction Board.Cell(column, e)\n    local value = column.value(e)\n    local max = Max(column, e)\n    local isNumber = type(value) == \"number\"\n    local text\n    if column.display then text = column.display(value, e) elseif isNumber then text = U.Whole(value) else text = tostring(value) end\n    local maxed, dim, pct = false, false, nil\n    if isNumber and max then\n        if value >= max then\n            maxed = true\n            if not column.display then text = U.Whole(math.min(value, max)) end\n        elseif value <= 0 then\n            dim = true\n            if not column.display then text = \"-\" end\n        elseif column.bar ~= false then\n            pct = value / max\n        end\n    end\n    if column.dim and column.dim(value, e) then dim = true end\n    if column.gold and column.gold(value, e) then maxed = true end\n    local pick = column.pick ~= nil or column.note == true\n    if pick and text == \"\" then text = \"-\" end\n    if maxed then dim, pct = false, nil end\n    local warn = (not maxed) and column.warn ~= nil and column.warn(value, e) == true\n    return { text = text, maxed = maxed, dim = dim, warn = warn, pick = pick, pct = pct, value = value }\nend\n\nfunction Board.Tip(column, e)\n    if type(column.tip) == \"function\" then return column.tip(e) end\n    return column.tip\nend\n\nfunction Board.HeadTip(column)\n    local head = column.head\n    if type(head) == \"function\" then head = head() end\n    return (head or Board.Title(column)) .. \"\\n\\n\" .. CT.TEXT.SORT_TIP\nend\n\n-- Sorting -------------------------------------------------------------------------------------\n-- Remembered per tab as { key = column key, desc = }. Nothing remembered = your own row order.\n\nlocal function SortValue(column)\n    return function(e)\n        local value = column.value(e)\n        if type(value) == \"number\" then return value end\n        return string.lower(tostring(value or \"\"))\n    end\nend\n\nfunction Board.Sort(view)\n    local sort = CT.Prefs().sort[view.id]\n    local column = sort and sort.key and CT.Trackers.Column(sort.key)\n    if not column then return nil end\n    return sort, column\nend\n\n-- A click on a column title: sort by it, then reversed, then back to your own order.\n-- Numbers sort biggest first, names A to Z.\nfunction Board.ClickSort(view, column)\n    local sorts = CT.Prefs().sort\n    local sort = sorts[view.id]\n    if sort and sort.key == column.key then\n        if sort.flipped then sorts[view.id] = nil else sort.desc, sort.flipped = not sort.desc, true end\n    else\n        local first = CT.Roster:List()[1]\n        sorts[view.id] = { key = column.key, desc = first ~= nil and type(column.value(first)) == \"number\" }\n    end\nend\n\n-- Rows --------------------------------------------------------------------------------------------\n\n-- The characters on a tab, in order, and the ones on the account not read yet (those come last).\nfunction Board.Rows(view)\n    local sort, column = Board.Sort(view)\n    local entries = CT.Roster:List(column and SortValue(column), sort and sort.desc)\n    return entries, CT.Roster:Unread()\nend\n\n-- Hover text of a row that has not been read yet.\nfunction Board.UnreadTip(info)\n    local who = info.level and string.format(\"Level %s %s %s  ·  %s\", info.level, info.race or \"\", info.class or \"\", info.alliance or \"\") or \"On this account\"\n    return string.format(\"%s\\n%s\\n\\n%s\", info.name, who, CT.TEXT.UNREAD_TIP)\nend\n\n-- The bottom row: how many characters have each column maxed, or the sum for plain numbers.\nfunction Board.Totals(view, columns, entries)\n    local totals = {}\n    for i, column in ipairs(columns) do\n        local text = \"\"\n        if i == 1 then\n            text = view.totals or \"Maxed on\"\n        elseif column.foot then\n            text = column.foot(entries)\n        elseif column.sum then\n            local sum = 0\n            for _, e in ipairs(entries) do sum = sum + (column.value(e) or 0) end\n            text = column.total and column.total(sum) or U.Comma(sum)\n        elseif column.max then\n            local maxed = 0\n            for _, e in ipairs(entries) do\n                local value, max = column.value(e), Max(column, e)\n                if type(value) == \"number\" and max and value >= max then maxed = maxed + 1 end\n            end\n            text = U.Of(maxed, #entries)\n        end\n        totals[i] = text\n    end\n    return totals\nend\n\n-- The line above the columns, and its hover text when it has more to say than fits.\nfunction Board.Summary(view, entries, unread)\n    local data = CT.Data()\n    local never, count, home = #unread, #entries, CT.IsHome()\n    local old = 0\n    for _, e in ipairs(entries) do\n        if (e.c.v or 1) < CT.READ_VERSION then old = old + 1 end\n    end\n    local parts = { U.Count(count, \"character\") }\n    if not home and CT.view then\n        local saved = (data.account or {}).lastScan\n        parts[#parts + 1] = string.format(\"%s as saved %s\", CT.ViewLabel(), saved and U.FormatDate(saved) or \"at its last logout\")\n        if CT.live then parts[#parts + 1] = \"log in on that account to update it\" end\n    end\n    if count == 0 and home then parts = { \"Nothing read yet. This character is read a few seconds after you log in.\" } end\n    -- New columns of this version stay \"-\" until a character is read by it.\n    if old > 0 then parts[#parts + 1] = string.format(\"%d last read by an older version: log in on each once to fill the new columns\", old) end\n    if never > 0 then parts[#parts + 1] = string.format(\"%d not read yet (the dim rows)%s\", never, (home and old == 0) and \": log in on each once\" or \"\") end\n    if home and count > 0 and old == 0 and never == 0 then\n        parts[#parts + 1] = \"every character on this account is here\"\n        parts[#parts + 1] = \"/fct unread lists the out-of-date ones\"\n    end\n    local summary = table.concat(parts, \"  ·  \")\n    if view.id == \"wallet\" then\n        return CT.WalletSummary(data)\n    elseif view.id == \"daily\" and CT.view then\n        local now = GetTimeStamp()\n        summary = U.Count(count, \"character\") .. \"  ·  writs reset at \" .. os.date(\"%I:%M %p\", CT.Daily.LastReset(CT.view.world, now) + 86400) .. \" your time\"\n        local challenges = CT.ChallengeText(data, now)\n        if challenges then summary = summary .. \"  ·  \" .. challenges end\n    elseif view.id == \"weekly\" then\n        summary = U.Count(count, \"character\") .. \"  ·  \" .. CT.WeeklySummary(GetTimeStamp())\n    elseif view.id == \"progress\" and count > 0 then\n        -- Until some character has a line from an earlier day, every cell is a dash: say why.\n        local today, compared = CT.History.Day(GetTimeStamp()), false\n        for _, e in ipairs(entries) do\n            local since = CT.History.Since(data, e.id)\n            if since and since < today then compared = true break end\n        end\n        if not compared then\n            summary = U.Count(count, \"character\") .. \"  ·  nothing to compare yet: one line is saved for each day you play a character, and what it gained shows here from the next day on\"\n        end\n    end\n    return summary, nil\nend\n\n-- Everything a tab shows, as plain tables: what the offline viewer draws, what \"Copy for Discord\"\n-- writes out, and what the tests compare. `withTips` adds every hover text.\nfunction Board.Snapshot(viewId, withTips)\n    local view = Board.View(viewId)\n    local columns = Board.Columns(view)\n    local entries, unread = Board.Rows(view)\n    local sort = Board.Sort(view)\n    local snap = { id = view.id, title = view.title, tip = view.tip, live = view.live == true, columns = {}, rows = {}, unread = {},\n                   sortKey = sort and sort.key or nil, sortDesc = sort and sort.desc == true or false }\n    for i, column in ipairs(columns) do\n        snap.columns[i] = { key = column.key, title = Board.Title(column), width = column.width, align = column.align or \"center\",\n                            head = withTips and Board.HeadTip(column) or nil, pick = column.pick and column.pick.field or nil,\n                            note = column.note == true }\n    end\n    for r, e in ipairs(entries) do\n        local row = { id = e.id, name = e.name, cells = {} }\n        for i, column in ipairs(columns) do\n            local cell = Board.Cell(column, e)\n            cell.value = nil\n            if withTips then cell.tip = Board.Tip(column, e) end\n            row.cells[i] = cell\n        end\n        snap.rows[r] = row\n    end\n    for r, info in ipairs(unread) do\n        snap.unread[r] = { name = info.name, class = info.class or \"\", tip = Board.UnreadTip(info) }\n    end\n    snap.totals = Board.Totals(view, columns, entries)\n    snap.summary, snap.summaryTip = Board.Summary(view, entries, unread)\n    return snap\nend\n"}, {"name": "Core/Pages.lua", "text": "-- shared\n-- What the other windows say, with no drawing in it: the details of one character, the Start here\n-- page, the brag card, the research timers' top line, and the text for \"Copy for Discord\".\n-- The game windows (UI/) and the offline viewer draw what this file hands them.\n--\n-- A page is a list of sections: { title =, items = { { key, value, done =, dim = } }, lines = { ... } }.\n-- A line is a text, or { text, bold =, gold =, switch = (a switch from Data/Text.lua), url = true }.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal Pages = {}\nCT.Pages = Pages\n\n-- Details of one character ---------------------------------------------------------------------\n\nfunction Pages.DetailsHeader(e)\n    local c = e.c\n    return e.name, string.format(\"%s  ·  Level %s %s %s  ·  %s  ·  read from the game %s (%s)\", CT.ViewLabel(), c.level or \"?\",\n                                 c.race or \"\", c.class or \"\", c.alliance or \"\", U.Ago(c.lastScan), U.FormatDate(c.lastScan))\nend\n\n-- Every file in Trackers/ adds its own: `summary` items go into the Progress block, `sections`\n-- become blocks of their own. Two trackers that give a section the same `id` share one block.\nfunction Pages.Details(e)\n    local progress = { title = \"Progress\", items = {}, order = 2 }\n    local sections, byId = { progress }, {}\n    for _, tracker in ipairs(CT.Trackers.list) do\n        for _, item in ipairs(tracker.summary and tracker.summary(e) or {}) do progress.items[#progress.items + 1] = item end\n        for _, section in ipairs(tracker.sections and tracker.sections(e) or {}) do\n            local shared = section.id and byId[section.id]\n            if shared then\n                for _, item in ipairs(section.items or {}) do shared.items[#shared.items + 1] = item end\n            else\n                section.order = section.order or (tracker.id == \"picks\" and 1) or (tracker.id == \"research\" and 1000) or (10 + #sections)\n                section.items = section.items or {}\n                sections[#sections + 1] = section\n                if section.id then byId[section.id] = section end\n            end\n        end\n    end\n    for index, section in ipairs(sections) do section.index = index end\n    table.sort(sections, function(a, b)\n        if a.order ~= b.order then return a.order < b.order end\n        return a.index < b.index\n    end)\n    return sections\nend\n\n-- Start here -------------------------------------------------------------------------------------\n\n-- Whether a switch (Data/Text.lua) is on for the account you are logged in on.\nfunction Pages.SwitchOn(switch)\n    local value = CT.sv and CT.sv[switch.field]\n    if value == nil then return switch.unsetIsOn end\n    return value == true\nend\n\nfunction Pages.Start()\n    local sections = {}\n    for _, def in ipairs(CT.TEXT.START) do\n        local section = { title = def.title, lines = {} }\n        if def.switches and CT.live then\n            for _, switch in ipairs(CT.TEXT.SWITCHES) do\n                local on = Pages.SwitchOn(switch)\n                section.lines[#section.lines + 1] = { string.format(\"[ %s ]  %s: %s  Click to turn it %s.\", on and \"ON\" or \"off\", switch.label,\n                                                                    switch.about, on and \"off\" or \"on\"), switch = switch }\n            end\n        elseif def.switches then\n            section.title = \"4. Alerts\"\n            section.lines[1] = CT.TEXT.START_VIEWER\n        else\n            for _, line in ipairs(def.lines) do\n                -- A line can read differently in the offline viewer, or be left out there.\n                if type(line) == \"table\" and not CT.live and line.viewer ~= nil then line = line.viewer end\n                if line then section.lines[#section.lines + 1] = line end\n            end\n        end\n        sections[#sections + 1] = section\n    end\n    -- 1.5.7: the other Fury addons, the same lines as in every Fury addon (UI/Theme.lua). In game only.\n    if CT.live then\n        local more = { title = \"6. \" .. CT.Theme.MORE_TITLE, lines = {} }\n        for _, entry in ipairs(CT.Theme.More()) do\n            more.lines[#more.lines + 1] = { entry.name .. \": \" .. entry.about .. \"  Click for its ESOUI page (the game asks first).\", more = entry.url }\n        end\n        more.lines[#more.lines + 1] = CT.Theme.MORE_FOOT\n        sections[#sections + 1] = more\n    end\n    return sections\nend\n\nfunction Pages.StartHeader()\n    return \"Start here\", \"Fury's Character Tracker v\" .. CT.version .. \"  ·  open this page again with the Start here button on the board\" .. (CT.live and \", or /fct start\" or \"\")\nend\n\n-- Research timers -----------------------------------------------------------------------------\n\nfunction Pages.TimersSummary(rows)\n    if #rows == 0 then\n        return \"Nothing to show: every character here knows every trait, or none has been read yet (log in on each once).\"\n    end\n    local running, waiting = 0, 0\n    for _, row in ipairs(rows) do\n        if row.kind == \"timer\" then running = running + 1 else waiting = waiting + (row.count or 1) end\n    end\n    local summary = string.format(\"%d researching  ·  %s free\", running, U.Count(waiting, \"slot\"))\n    if not CT.IsHome() then summary = summary .. \"  ·  as saved at that account's last logout\" end\n    return summary\nend\n\n-- \"Sat Nov 21, 03:15 PM\"\nfunction Pages.When(timestamp)\n    return os.date(\"%a %b %d, %I:%M %p\", timestamp)\nend\n\n-- One line of the research timers window, as text: { name, craft, item, trait, left, ends },\n-- and waiting = true when the slot needs you (finished or idle).\nfunction Pages.TimerRow(row, now)\n    if row.kind == \"timer\" then\n        return { name = row.name, craft = row.craftName, item = row.item, trait = row.trait,\n                 left = U.Duration(row.endsAt - now), ends = Pages.When(row.endsAt), waiting = false }\n    elseif row.kind == \"done\" then\n        return { name = row.name, craft = row.craftName, item = row.item, trait = row.trait, left = \"Done\", ends = \"slot free: start more\", waiting = true }\n    end\n    return { name = row.name, craft = row.craftName, item = U.Count(row.count, \"slot\") .. \" free\", trait = \"\", left = \"Idle\",\n             ends = \"nothing researching\", waiting = true }\nend\n\n-- Brag card -----------------------------------------------------------------------------------\n\nlocal CLASS_COUNT = 7   -- Dragonknight, Sorcerer, Nightblade, Templar, Warden, Necromancer, Arcanist\nlocal ROLE_KEYS = { \"Tank\", \"Healer\", \"DPS\" }\n\nlocal function Compute(entries)\n    local s = {\n        characters = 0, hours = 0, skillPoints = 0, linesMaxed = 0, linesTotal = 0, research = 0, researchAll = 0,\n        grandmasters = 0, vampWolf = 0, scribing = 0, companions = 0, riding = 0, bestRecipes = 0, bestRecipesName = \"\",\n        bestAch = 0, bestAchName = \"\", bestPlans = 0, bestPlansName = \"\", bestMotifs = 0, bestMotifsName = \"\",\n        recipesTotal = 0, plansTotal = 0, motifsTotal = 0, researchTotal = 0,\n        classes = {}, classOrder = {},\n    }\n    local vamp, wolf = CT.LINE_BY_NAME[\"Vampire\"], CT.LINE_BY_NAME[\"Werewolf\"]\n    for _, entry in ipairs(entries) do\n        local c, m = entry.c, entry.m\n        local lines = c.lines or {}\n        s.characters = s.characters + 1\n        s.hours = s.hours + (c.playedHours or 0)\n        s.skillPoints = s.skillPoints + (c.skillPoints or 0)\n        s.research = s.research + (c.research or 0)\n        s.researchTotal = s.researchTotal + (c.researchTotal or CT.RESEARCH_TOTAL)\n        s.recipesTotal = math.max(s.recipesTotal, c.recipesTotal or 0)\n        s.plansTotal = math.max(s.plansTotal, c.furnishingsTotal or 0)\n        s.motifsTotal = math.max(s.motifsTotal, c.motifsTotal or 0)\n\n        local craftMaxed = 0\n        for _, group in ipairs(CT.GROUPS) do\n            local maxed = CT.Roster:MaxedInGroup(c, group)\n            s.linesTotal, s.linesMaxed = s.linesTotal + #group.lines, s.linesMaxed + maxed\n            if group.id == \"crafting\" then craftMaxed = maxed end\n        end\n        local allTraits = (c.research or 0) >= (c.researchTotal or CT.RESEARCH_TOTAL)\n        if allTraits then s.researchAll = s.researchAll + 1 end\n        if allTraits and craftMaxed >= 7 then s.grandmasters = s.grandmasters + 1 end\n        if (lines[vamp.name] or 0) >= vamp.max and (lines[wolf.name] or 0) >= wolf.max then s.vampWolf = s.vampWolf + 1 end\n        if c.scriptsTotal and (c.scripts or 0) >= c.scriptsTotal then s.scribing = s.scribing + 1 end\n        if #(c.companions or {}) >= (c.companionsTotal or CT.COMPANION_TOTAL) then s.companions = s.companions + 1 end\n        if (c.riding or 0) >= (c.ridingMax or CT.RIDING_MAX) then s.riding = s.riding + 1 end\n        if (c.recipes or 0) > s.bestRecipes then s.bestRecipes, s.bestRecipesName = c.recipes, entry.name end\n        if (c.achievementPoints or 0) > s.bestAch then s.bestAch, s.bestAchName = c.achievementPoints, entry.name end\n        if (c.furnishings or 0) > s.bestPlans then s.bestPlans, s.bestPlansName = c.furnishings, entry.name end\n        if (c.motifs or 0) > s.bestMotifs then s.bestMotifs, s.bestMotifsName = c.motifs, entry.name end\n\n        -- Which roles each class is played in, from your Role picks (\"DPS/Healer\" counts for both).\n        local class = c.class or \"?\"\n        if not s.classes[class] then\n            s.classes[class] = {}\n            s.classOrder[#s.classOrder + 1] = class\n        end\n        for _, key in ipairs(ROLE_KEYS) do\n            if m.role and string.find(m.role, key, 1, true) then s.classes[class][key] = true end\n        end\n    end\n    table.sort(s.classOrder)\n    return s\nend\n\n-- pct = how far along (0 to 1), shown in the tile corner and as a bar; nil = no finish line.\nlocal function Pct(done, total)\n    if not total or total <= 0 then return nil end\n    return math.min(1, (done or 0) / total)\nend\n\n-- The card: { title =, subtitle =, tiles = { { value =, label =, note =, pct =, pctText = } }, coverageTitle =,\n--             classes = { { name =, roles = { { key =, on = } } } }, date =, credit = }\nfunction Pages.Brag()\n    local entries = CT.Roster:List()\n    local s = Compute(entries)\n    local n = s.characters\n    local account = CT.Data().account or {}\n    -- Your own account, in game: asked from the game. Otherwise what was saved (nil: not saved yet).\n    local cp = CT.IsHome() and GetPlayerChampionPointsEarned() or account.championPoints\n    local achTotal = CT.IsHome() and GetTotalAchievementPoints() or account.achievementTotal\n    local years = s.hours / 24 / 365.25\n    local timeNote = years >= 1 and string.format(\"%.1f years, nonstop\", years) or string.format(\"%s days, nonstop\", U.Comma(s.hours / 24))\n    local function OfAll(count) return string.format(\"%d / %d\", count, n) end\n    local tiles = {\n        { value = U.Comma(s.hours), label = \"Hours played\", note = timeNote },\n        { value = cp and U.Comma(cp) or \"?\", label = \"Champion Points\",\n          note = cp and (\"of \" .. U.Comma(CT.CP_MAX) .. \", account-wide\") or \"log in to read\", pct = cp and Pct(cp, CT.CP_MAX) or nil },\n        { value = U.Comma(s.bestAch), label = \"Most achievement points\", note = s.bestAchName, pct = Pct(s.bestAch, achTotal) },\n        { value = U.Comma(s.skillPoints), label = \"Skill points earned\", note = \"across \" .. U.Count(n, \"character\"),\n          pct = Pct(s.skillPoints, n * CT.SKILL_POINTS_MAX) },\n        { value = U.Comma(s.linesMaxed), label = \"Skill lines maxed\", note = \"of \" .. U.Comma(s.linesTotal) .. \" tracked\",\n          pct = Pct(s.linesMaxed, s.linesTotal) },\n        { value = U.Comma(s.research), label = \"Traits researched\", note = string.format(\"%d know every trait\", s.researchAll),\n          pct = Pct(s.research, s.researchTotal) },\n        { value = OfAll(s.grandmasters), label = \"Grandmaster crafters\", note = \"7 crafts at 50 + every trait\", pct = Pct(s.grandmasters, n) },\n        { value = OfAll(s.vampWolf), label = \"Vampire + Werewolf\", note = \"both lines maxed\", pct = Pct(s.vampWolf, n) },\n        { value = OfAll(s.scribing), label = \"Scribing complete\", note = \"every grimoire and script\", pct = Pct(s.scribing, n) },\n        { value = OfAll(s.companions), label = \"All companions\", note = \"every one unlocked\", pct = Pct(s.companions, n) },\n        { value = OfAll(s.riding), label = \"Riding maxed\", note = \"speed, stamina, carry\", pct = Pct(s.riding, n) },\n        { value = U.Comma(s.bestRecipes), label = \"Most recipes known\", note = s.bestRecipesName, pct = Pct(s.bestRecipes, s.recipesTotal) },\n        { value = U.Comma(s.bestPlans), label = \"Most furnishing plans\", note = s.bestPlansName, pct = Pct(s.bestPlans, s.plansTotal) },\n        { value = U.Comma(s.bestMotifs), label = \"Most motif styles\", note = s.bestMotifsName, pct = Pct(s.bestMotifs, s.motifsTotal) },\n        { value = U.Comma(account.setPieces), label = \"Set items collected\",\n          note = account.setPiecesTotal and (\"of \" .. U.Comma(account.setPiecesTotal) .. \" (sticker book)\") or \"log in to read\",\n          pct = Pct(account.setPieces, account.setPiecesTotal) },\n        { value = U.Comma(account.outfitStyles), label = \"Outfit styles\",\n          note = account.outfitStylesTotal and (\"of \" .. U.Comma(account.outfitStylesTotal)) or \"log in to read\",\n          pct = Pct(account.outfitStyles, account.outfitStylesTotal) },\n    }\n    for _, tile in ipairs(tiles) do\n        if tile.pct then\n            -- Whole percent, but never round up to 100% before it is really done.\n            local shown = (tile.pct >= 1) and 100 or math.min(99, math.floor(tile.pct * 100 + 0.5))\n            tile.pctText = U.Whole(shown) .. \"%\"\n        end\n    end\n\n    -- Class x role coverage: a lit role = you have a character playing it.\n    local classes, everything = {}, #s.classOrder >= CLASS_COUNT\n    for index = 1, CLASS_COUNT do\n        local class = s.classOrder[index]\n        if class then\n            local roles = {}\n            for i, key in ipairs(ROLE_KEYS) do\n                roles[i] = { key = key, on = s.classes[class][key] == true }\n                if not roles[i].on then everything = false end\n            end\n            classes[index] = { name = class, roles = roles }\n        end\n    end\n\n    local onAccount = #CT.Roster:AccountRoster()\n    local count = (n < onAccount) and string.format(\"%d of %d characters read%s\", n, onAccount, CT.live and \" (/fct unread)\" or \"\")\n                                  or U.Count(n, \"character\")\n    return {\n        title = CT.view and CT.view.account or \"\",\n        subtitle = string.format(\"%s  ·  %d of %d classes  ·  %s\", count, #s.classOrder, CLASS_COUNT, CT.view and CT.view.world or \"\"),\n        tiles = tiles, classes = classes, classCount = CLASS_COUNT,\n        coverageTitle = everything and \"Every class. Every role.\" or \"Classes & roles\",\n        date = os.date(\"%B %d, %Y\", GetTimeStamp()), credit = \"Fury's Character Tracker v\" .. CT.version,\n    }\nend\n\n-- Copy for Discord -----------------------------------------------------------------------------\n\nlocal DISCORD_LIMIT = 2000\n\nlocal function Pad(text, width, right)\n    local gap = string.rep(\" \", math.max(0, width - #text))\n    return right and (gap .. text) or (text .. gap)\nend\n\n-- A tab as a text table for Discord (in a code block, so the columns line up).\n-- Returns the text and a note for under it.\nfunction Pages.DiscordTable(viewId)\n    local snap = CT.Board.Snapshot(viewId)\n    local widths = {}\n    for i, column in ipairs(snap.columns) do\n        widths[i] = #column.title\n        for _, row in ipairs(snap.rows) do widths[i] = math.max(widths[i], #row.cells[i].text) end\n    end\n    local function Line(texts)\n        local parts = {}\n        for i, column in ipairs(snap.columns) do parts[i] = Pad(texts[i], widths[i], column.align ~= \"left\") end\n        return (table.concat(parts, \"  \"):gsub(\"%s+$\", \"\"))\n    end\n    local titles = {}\n    for i, column in ipairs(snap.columns) do titles[i] = column.title end\n    local lines = { string.format(\"**%s**  ·  %s  ·  Fury's Character Tracker\", snap.title, CT.view and CT.ViewLabel() or \"\"), \"```\", Line(titles) }\n    for _, row in ipairs(snap.rows) do\n        local texts = {}\n        for i, cell in ipairs(row.cells) do texts[i] = cell.text end\n        lines[#lines + 1] = Line(texts)\n    end\n    lines[#lines + 1] = \"```\"\n    local text = table.concat(lines, \"\\n\")\n    local note = string.format(\"%s characters. Press Ctrl+C to copy, then paste into Discord.\", U.Comma(#text))\n    if #text > DISCORD_LIMIT then\n        note = string.format(\"%s characters: more than the %s one Discord message takes without Nitro. Paste it in two parts, or copy a narrower tab.\",\n                             U.Comma(#text), U.Comma(DISCORD_LIMIT))\n    end\n    return text, note\nend\n\n-- One character as a few lines for Discord.\nfunction Pages.DiscordCharacter(e)\n    local c, Column, Cell = e.c, CT.Trackers.Column, CT.Board.Cell\n    local function Text(key) return Cell(Column(key), e).text end\n    local lines = { string.format(\"**%s**  ·  Level %s %s %s  ·  %s\", e.name, c.level or \"?\", c.race or \"\", c.class or \"\", c.alliance or \"\") }\n    local first = {}\n    if e.m.role then first[#first + 1] = \"Role: \" .. e.m.role end\n    first[#first + 1] = string.format(\"%s / %s skill points\", U.Comma(c.skillPoints), U.Comma(CT.SKILL_POINTS_MAX))\n    first[#first + 1] = U.Comma(c.achievementPoints) .. \" achievement points\"\n    first[#first + 1] = U.Comma(c.playedHours) .. \" hours\"\n    lines[#lines + 1] = table.concat(first, \"  ·  \")\n    local maxed = {}\n    for _, group in ipairs(CT.GROUPS) do maxed[#maxed + 1] = group.title .. \" \" .. Text(\"group.\" .. group.id) end\n    lines[#lines + 1] = \"Lines maxed: \" .. table.concat(maxed, \"  ·  \")\n    lines[#lines + 1] = string.format(\"Research %s / %s  ·  Riding %s / %s  ·  Companions %s\", U.Whole(c.research or 0), U.Whole(c.researchTotal or CT.RESEARCH_TOTAL),\n                                      U.Whole(c.riding or 0), U.Whole(c.ridingMax or CT.RIDING_MAX), Text(\"companions\"))\n    local sets = CT.GearSets(c, \"  ·  \")\n    if sets ~= \"\" then lines[#lines + 1] = \"Wearing: \" .. sets end\n    if e.m.note then lines[#lines + 1] = \"Note: \" .. e.m.note end\n    return table.concat(lines, \"\\n\"), \"Press Ctrl+C to copy, then paste into Discord.\"\nend\n"}, {"name": "viewer.lua", "text": "-- The offline viewer's Lua side. The page asks for what to draw with FCT_Api(\"board\", \"overview\")\n-- and gets JSON back. Everything it hands out comes from the addon's own files (Core/Board.lua,\n-- Core/Pages.lua and the files in Trackers/), so the page shows what the game shows.\nlocal CT = FurysCharacterTracker\nlocal accounts = {}\nlocal api = {}\n\n-- Details and Start here pages mix lists with named fields; the page wants plain objects.\nlocal function Page(title, subtitle, sections)\n    local out = { title = title, subtitle = subtitle, sections = {} }\n    for s, section in ipairs(sections) do\n        local items, lines = {}, {}\n        for i, item in ipairs(section.items or {}) do\n            items[i] = { key = item[1], value = tostring(item[2] or \"\"), done = item.done == true, dim = item.dim == true }\n        end\n        for i, line in ipairs(section.lines or {}) do\n            if type(line) ~= \"table\" then line = { line } end\n            lines[i] = { text = line[1], bold = line.bold == true, gold = line.gold == true, url = line.url and CT.toolsUrl or nil }\n        end\n        out.sections[s] = { title = section.title, items = items, lines = lines }\n    end\n    return out\nend\n\n-- Called once, after the saved files are in.\nfunction api.boot()\n    CT.UpgradeAll()\n    accounts = CT.Accounts()\n    CT.view = accounts[1]\n    local labels, views = {}, {}\n    for i, account in ipairs(accounts) do labels[i] = CT.ViewLabel(account) end\n    for i, view in ipairs(CT.VIEWS) do views[i] = { id = view.id, title = view.title, tip = view.tip or \"\" } end\n    local X = CT.TEXT\n    return { version = CT.version, accounts = labels, views = views, legend = X.LEGEND, unread = X.UNREAD, footer = X.FOOTER,\n             startTip = X.START_TIP, accountTip = X.ACCOUNT_TIP, toolsUrl = CT.toolsUrl }\nend\n\nfunction api.account(index)\n    CT.SetView(accounts[tonumber(index)])\n    return true\nend\n\nfunction api.board(viewId)\n    local snap = CT.Board.Snapshot(viewId, true)\n    CT.Prefs().lastView = snap.id\n    snap.label = CT.ViewLabel()\n    return snap\nend\n\nfunction api.sort(viewId, key)\n    CT.Board.ClickSort(CT.Board.View(viewId), CT.Trackers.Column(key))\n    return true\nend\n\nfunction api.details(id)\n    local e = CT.Roster:Entry(id)\n    if not e then return false end\n    local title, subtitle = CT.Pages.DetailsHeader(e)\n    return Page(title, subtitle, CT.Pages.Details(e))\nend\n\nfunction api.start()\n    local title, subtitle = CT.Pages.StartHeader()\n    return Page(title, subtitle, CT.Pages.Start())\nend\n\nfunction api.brag()\n    return CT.Pages.Brag()\nend\n\nfunction api.timers()\n    local now = GetTimeStamp()\n    local rows, lines = CT.Research.Rows(CT.Data(), now), {}\n    for i, row in ipairs(rows) do lines[i] = CT.Pages.TimerRow(row, now) end\n    return { label = CT.ViewLabel(), summary = CT.Pages.TimersSummary(rows), rows = lines }\nend\n\nfunction api.discord(viewId)\n    local text, note = CT.Pages.DiscordTable(viewId)\n    return { text = text, note = note }\nend\n\nfunction api.discordCharacter(id)\n    local e = CT.Roster:Entry(id)\n    if not e then return false end\n    local text, note = CT.Pages.DiscordCharacter(e)\n    return { text = text, note = note }\nend\n\n-- The rows of the Excel file: the same columns the game's own export writes.\nfunction api.export()\n    return { label = CT.ViewLabel(), rows = CT.Roster:ExportRows() }\nend\n\nfunction FCT_Api(name, a, b)\n    return FCT_Json(api[name](a, b))\nend\n"}];

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// The game's color codes (|cRRGGBBtext|r) as colored text; its inline icons (|t...|t) are left out.
const rich = (s) => esc(s || "").replace(/\|t[^|]*\|t ?/g, "")
  .replace(/\|c([0-9a-fA-F]{6})(.*?)\|r/gs, '<span style="color:#$1">$2</span>').replace(/\|c[0-9a-fA-F]{6}|\|r/g, "");

let api, boot, viewId = "overview", liveTimer;

function problem(title, text) {
  $("app").innerHTML = '<div id="problem"><h2>' + esc(title) + "</h2><p>" + text + "</p></div>";
}

function start() {
  if (typeof FILES === "string") {
    return problem("Open this page with the Windows Tools", "This is the page template. Run <b>Open Offline Viewer.cmd</b> in the Windows Tools folder: it puts your saved data in and opens the result.");
  }
  const now = Number((location.hash.match(/now=(\d+)/) || [])[1]) || 0;   // tests pin the clock
  for (const file of LUA) fengari.load(file.text, "@" + file.name)();
  if (now) fengari.load("VIEWER_NOW = " + now)();
  // A Lua function called from JavaScript gets "this" first: the wrappers drop it.
  const add = fengari.load("local _, text = ...; return FCT_AddSaved(text)");
  let read = 0;
  for (const file of FILES) { if (add(file.text)) read++; }
  const call = fengari.load("local _, name, a, b = ...; return FCT_Api(name, a, b)");
  api = (name, a, b) => JSON.parse(call(name, a, b));
  boot = api("boot");
  if (!read || !boot.accounts.length) {
    return problem("No characters saved yet", "Log in on a character with Fury's Character Tracker turned on, then log out or type <b>/reloadui</b> (the game only saves then), and open the offline viewer again.");
  }
  $("version").textContent = "v" + boot.version + "  ·  offline viewer";
  const newest = Math.max(...FILES.map((f) => f.time || 0));
  if (newest) $("saved").textContent = "Saved by the game " + new Date(newest * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  tip($("saved"), "When the game last wrote its saved file. The game saves when you log out or reload the UI.\nOpen the offline viewer again after that to see what is new.");
  boot.accounts.forEach((label, i) => { const o = el("option", "", label); o.value = i + 1; $("account").append(o); });
  $("account").onchange = () => { api("account", Number($("account").value)); draw(); };
  tip($("account"), boot.accountTip);
  $("startButton").onclick = () => showPage(api("start"));
  tip($("startButton"), "New here? One page on how the board works: what the colors mean and what each tab is for.");
  boot.views.forEach((view) => {
    const tab = el("div", "", view.title);
    tab.dataset.id = view.id;
    tab.onclick = () => { viewId = view.id; draw(); };
    tip(tab, view.tip);
    $("tabs").append(tab);
  });
  const actions = { timers: showTimers, brag: showBrag, copy: () => showCopy(api("discord", viewId)), export: saveForExcel };
  for (const def of boot.footer) {
    if (!actions[def.id]) continue;
    const button = el("button", "", def.id === "export" ? "Save for Excel" : def.label);
    button.id = "footer-" + def.id;
    button.onclick = actions[def.id];
    tip(button, def.id === "export" ? "Saves this account's characters as a file Excel opens: ESO Characters.csv, in your Downloads folder." : def.tip.replace(/\n\(also \/fct [a-z]+\)/, ""));
    $("buttons").append(button);
  }
  $("legend").innerHTML = rich(boot.legend.replace("right-click for the menu", "right-click to copy for Discord"));
  draw();
}

// ---- The board ----------------------------------------------------------------------------------

function draw() {
  hideTip();
  const snap = api("board", viewId);
  viewId = snap.id;
  for (const tab of $("tabs").children) tab.classList.toggle("on", tab.dataset.id === viewId);
  $("summary").innerHTML = rich(snap.summary);
  tip($("summary"), snap.summaryTip || $("summary").textContent);

  const table = $("board");
  table.textContent = "";
  const cols = el("colgroup");
  let width = 6;
  for (const column of snap.columns) { const c = el("col"); c.style.width = (column.width + 6) + "px"; cols.append(c); width += column.width + 6; }
  table.style.width = width + "px";
  const head = el("tr");
  snap.columns.forEach((column) => {
    const arrow = snap.sortKey === column.key ? (snap.sortDesc ? " ▼" : " ▲") : "";
    const th = el("th", column.align === "left" ? "left" : "");
    th.append(el("div", "", column.title + arrow));
    th.onclick = () => { api("sort", viewId, column.key); draw(); };
    tip(th, column.head);
    head.append(th);
  });
  const thead = el("thead"); thead.append(head);
  const body = el("tbody");
  for (const row of snap.rows) {
    const tr = el("tr");
    row.cells.forEach((cell, i) => {
      const column = snap.columns[i];
      const td = el("td", column.align === "left" ? "left" : "");
      const box = el("div", cell.maxed ? "max" : cell.warn ? "warn" : cell.pick ? "pick" : cell.dim ? "dim" : "", cell.text);
      // How far along: a faint bar from the left edge of the cell, like in game.
      if (cell.pct != null) box.style.background = "linear-gradient(to right, rgba(160,140,255,.24) " + Math.max(2, Math.round(cell.pct * 100)) + "%, transparent 0)";
      td.append(box);
      tip(td, cell.pick ? (cell.tip ? cell.tip + "\n\n" : "") + "Your own pick. It is changed in game." : cell.tip);
      tr.append(td);
    });
    tr.onclick = () => showDetails(row.id);
    tr.oncontextmenu = (event) => { event.preventDefault(); rowMenu(event, row); };
    body.append(tr);
  }
  for (const info of snap.unread) {
    const tr = el("tr", "unread");
    const cells = [info.name, info.class, boot.unread].map((text) => { const td = el("td"); td.append(el("div", "", text)); return td; });
    cells[2].colSpan = Math.max(1, snap.columns.length - 2);
    tr.append(...cells);
    tip(tr, info.tip.replace("\nRight-click to take it off the board.", ""));
    body.append(tr);
  }
  const foot = el("tfoot"), totals = el("tr");
  snap.totals.forEach((text, i) => { const td = el("td", snap.columns[i].align === "left" ? "left" : ""); const div = el("div"); div.innerHTML = rich(text); td.append(div); totals.append(td); });
  foot.append(totals);
  table.append(cols, thead, body, foot);
