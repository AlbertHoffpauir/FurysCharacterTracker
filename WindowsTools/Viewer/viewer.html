<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fury's Character Tracker</title>
<style>
  /* The Fury Night look shared by all of Fury's addons (UI/Theme.lua in the addon). */
  :root { --void: #07060e; --bg: #0f0e1f; --edge: #4a3d99; --violet: #a08cff; --ink: #07060e; --text: #eceaf8;
          --sub: #b4b0d8; --dim: #8a86b0; --blue: #5cc2ff; --amber: #ffc857; --glow: #1e1a44; --stripe: #16142c; --hover: #211d46;
          --title-font: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;   /* fonts already on the PC: the page never goes online */
          --body-font: "Univers LT Std", "Roboto Condensed", "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--void); color: var(--text); font-family: var(--body-font); font-size: 16px; }
  #app { display: flex; flex-direction: column; height: 100%; min-width: 1100px; max-width: 1480px; margin: 0 auto;
         background: var(--bg); border-left: 2px solid var(--edge); border-right: 2px solid var(--edge); }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 2px solid var(--violet);
           background: linear-gradient(to bottom, var(--glow), var(--bg)); }
  .gem { width: 14px; height: 14px; flex: none; border: 2px solid var(--violet); transform: rotate(45deg); margin: 0 8px 0 6px;
         box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 7px var(--violet); }
  h1 { margin: 0; font-family: var(--title-font); font-size: 28px; font-weight: 400; white-space: nowrap; text-shadow: 2px 2px 3px #000; }
  header small { color: var(--sub); font-size: 14px; white-space: nowrap; }
  .grow { flex: 1; }
  button, select { font: inherit; font-weight: 700; color: var(--text); height: 30px; border: 0; padding: 0 16px; cursor: pointer; white-space: nowrap;
                   background: linear-gradient(to right, transparent, rgba(0,0,0,.6) 14%, rgba(0,0,0,.6) 86%, transparent);
                   border-bottom: 2px solid var(--edge); }
  button:hover, select:hover { color: #fff; border-bottom-color: var(--violet); }
  select { background: rgba(0,0,0,.6); border: 1px solid var(--edge); padding: 0 8px; }
  select option { background: var(--bg); color: var(--text); }
  nav { display: flex; gap: 2px; padding: 8px 18px 0; border-bottom: 1px solid var(--edge); user-select: none; }
  nav div { padding: 6px 11px 7px; color: var(--sub); font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav div:hover { color: var(--text); }
  nav div.on { color: var(--text); border-bottom-color: var(--violet); }
  #summary { padding: 8px 20px 6px; color: var(--sub); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardWrap { flex: 1; overflow: auto; margin: 0 18px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  table { border-collapse: collapse; table-layout: fixed; }
  th, td { height: 28px; padding: 2px 3px; text-align: center; white-space: nowrap; }
  th.left, td.left { text-align: left; }
  /* A cell's text sits in a box of its own, so the row stripe runs unbroken behind the tiles and bars. */
  td div, th div { height: 24px; line-height: 24px; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--bg); color: var(--blue); font-size: 13.5px; letter-spacing: -0.2px; cursor: pointer; user-select: none;
             box-shadow: 0 1px 0 var(--edge); }
  thead th div { overflow: visible; }
  thead th:hover { color: #fff; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { background: var(--hover); }
  tbody td { cursor: default; }
  td div.max { background: var(--violet); color: var(--ink); font-weight: 700; }
  td div.dim { color: var(--dim); }
  td div.pick { color: var(--blue); }
  td div.warn { color: var(--amber); }
  tr.unread td { color: var(--dim); text-align: left; }
  tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--bg); color: var(--violet); font-weight: 700; box-shadow: 0 -1px 0 var(--edge); }
  .list { border-collapse: collapse; } .list th { position: static; cursor: default; padding: 0 10px; box-shadow: none; font-size: 15px; }
  .list th { color: var(--blue); text-align: left; }
  .list td { padding: 0 10px; height: 26px; text-align: left; }
  .list td.amber { color: var(--amber); } .list td.dim { color: var(--dim); } .list tr.click td { cursor: pointer; }
  footer { padding: 10px 18px 12px; }
  #buttons { display: flex; gap: 8px; }
  #legend { margin-top: 10px; color: var(--sub); font-size: 14px; }
  /* Windows that open over the board. */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  .win { position: relative; display: flex; flex-direction: column; max-height: 92vh; background: var(--bg); border: 2px solid var(--edge); box-shadow: 0 10px 40px #000; }
  .win .bar { padding: 10px 52px 10px 18px; border-bottom: 2px solid var(--violet); background: linear-gradient(to bottom, var(--glow), var(--bg)); }
  .win .bar h2 { margin: 0; font-family: var(--title-font); font-size: 26px; font-weight: 400; text-shadow: 2px 2px 3px #000; }
  .win .bar div { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .win .close { position: absolute; right: 12px; top: 8px; width: 30px; height: 30px; color: var(--sub); font-size: 26px; line-height: 28px; text-align: center; cursor: pointer; }
  .win .close:hover { color: #fff; }
  .win .body { padding: 14px 20px 18px; overflow: auto; }
  .win .note { color: var(--sub); font-size: 14px; margin-bottom: 8px; }
  .sec { color: var(--blue); font-weight: 700; margin: 14px 0 4px; } .sec:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 300px); column-gap: 20px; }
  .item { display: flex; justify-content: space-between; gap: 8px; line-height: 22px; white-space: nowrap; }
  .item .k { color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
  .item .v.done { color: var(--violet); font-weight: 700; } .item .v.dim { color: var(--dim); }
  .line { line-height: 22px; color: var(--sub); max-width: 940px; white-space: pre-wrap; } .line.bold { color: var(--text); font-weight: 700; } .line.gold { color: var(--violet); }
  /* Brag card: the same card as in game, sized for a screenshot. */
  .tiles { display: grid; grid-template-columns: repeat(4, 219px); gap: 12px; }
  .tile { position: relative; height: 104px; background: var(--stripe); border-top: 2px solid var(--violet); text-align: center; }
  .tile .v { color: var(--violet); font-size: 34px; font-weight: 700; line-height: 44px; margin-top: 4px; }
  .tile .l { font-weight: 700; line-height: 22px; }
  .tile .n { color: var(--dim); font-size: 14px; line-height: 18px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.pct .n { text-align: left; padding-right: 62px; }
  .tile .p { position: absolute; right: 8px; bottom: 12px; color: var(--violet); font-weight: 700; font-size: 15px; }
  .tile .track { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 4px; background: var(--hover); }
  .tile .fill { height: 4px; background: var(--violet); }
  .cover { text-align: center; font-family: var(--title-font); font-size: 22px; margin: 18px 0 8px; }
  .classes { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; } .classes b { display: block; } .classes span { font-size: 14px; }
  .on { color: var(--violet); } .off { color: #4a4670; }
  .bragfoot { display: flex; justify-content: space-between; color: var(--dim); font-size: 14px; margin-top: 14px; }
  textarea { width: 780px; height: 380px; background: #0a0914; color: var(--text); border: 1px solid var(--edge); padding: 10px;
             font-family: Consolas, "Courier New", monospace; font-size: 13px; white-space: pre; resize: none; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  #tip { position: fixed; z-index: 100; display: none; max-width: 560px; padding: 8px 12px; background: rgba(7,6,14,.97); border: 1px solid var(--edge);
         font-size: 15px; white-space: pre-line; pointer-events: none; box-shadow: 0 4px 16px #000; }
  #menu { position: fixed; z-index: 101; display: none; min-width: 240px; padding: 4px 0; background: rgba(7,6,14,.98); border: 1px solid var(--edge); }
  #menu div { padding: 5px 14px; cursor: pointer; white-space: nowrap; } #menu div:hover { background: var(--hover); }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 102; display: none; padding: 10px 18px; background: var(--glow);
           border: 1px solid var(--violet); }
  #problem { padding: 40px; max-width: 760px; margin: 0 auto; line-height: 1.6; } #problem h2 { font-family: var(--title-font); font-weight: 400; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="gem"></span><h1>Fury's Character Tracker</h1><small id="version"></small>
    <span class="grow"></span>
    <small id="saved"></small>
    <button id="startButton">Start here</button>
    <select id="account"></select>
  </header>
  <nav id="tabs"></nav>
  <div id="summary"></div>
  <div id="boardWrap"><table id="board"></table></div>
  <footer><div id="buttons"></div><div id="legend"></div></footer>
</div>
<div id="shade"></div>
<div id="tip"></div>
<div id="menu"></div>
<div id="toast"></div>

<script>
// The offline viewer. It draws; it decides nothing. What every cell says, the sort order, the
// totals and every page come from the addon's own Lua files, which run right here in the page
// (in Fengari, a Lua engine written in JavaScript). This page never goes online.

// Filled in by OfflineViewer.ps1 each time you open it: the saved files it found, as text.
const FILES = "__FCT_FILES__";
// The addon's shared Lua files, put here when the Windows Tools were built.
const LUA = [{"name": "shim.lua", "text": "-- The offline viewer's stand-in for the game: the few game functions the addon's shared files\n-- (the ones whose first line is \"-- shared\") use while drawing. Nothing here reads the game.\nVIEWER_NOW = nil   -- tests set a fixed time; the viewer uses the clock\nfunction GetTimeStamp() return VIEWER_NOW or os.time() end\nfunction zo_round(n) return math.floor(n + 0.5) end\nfunction zo_strformat(_, text) return (tostring(text or \"\"):gsub(\"%^.*$\", \"\")) end\nzo_strlower = string.lower\nfunction ZO_CommaDelimitNumber(n)\n    local digits = string.format(\"%d\", math.floor((n or 0) + 0.5))\n    local sign = \"\"\n    if digits:sub(1, 1) == \"-\" then sign, digits = \"-\", digits:sub(2) end\n    local out = digits:reverse():gsub(\"(%d%d%d)\", \"%1,\"):reverse()\n    return sign .. (out:gsub(\"^,\", \"\"))\nend\nCRAFTING_TYPE_BLACKSMITHING, CRAFTING_TYPE_CLOTHIER, CRAFTING_TYPE_ENCHANTING, CRAFTING_TYPE_ALCHEMY = 1, 2, 3, 4\nCRAFTING_TYPE_PROVISIONING, CRAFTING_TYPE_WOODWORKING, CRAFTING_TYPE_JEWELRYCRAFTING = 5, 6, 7\nCHAT_ROUTER = { AddSystemMessage = function() end }\nunpack = unpack or table.unpack\n\n-- Saved files ---------------------------------------------------------------------------------\n-- A saved file is Lua that sets FuryCT_SV. It is run with nothing in reach but an empty table, so\n-- whatever a file holds, all it can do is fill that table.\nlocal runChunk = loadstring or load\nfunction FCT_ReadSaved(text)\n    local box = {}\n    local chunk\n    if setfenv then\n        chunk = runChunk(text, \"saved\")\n        if chunk then setfenv(chunk, box) end\n    else\n        chunk = runChunk(text, \"saved\", \"t\", box)\n    end\n    if not chunk then return false end\n    chunk()\n    return type(box.FuryCT_SV) == \"table\" and box.FuryCT_SV or false\nend\n\nlocal function NewestRead(data)\n    local newest = (type(data.account) == \"table\" and data.account.lastScan) or 0\n    for _, c in pairs(type(data.characters) == \"table\" and data.characters or {}) do\n        if type(c) == \"table\" and (c.lastScan or 0) > newest then newest = c.lastScan end\n    end\n    return newest\nend\n\n-- Adds one saved file to what the viewer shows. The same account in two files (the live and\n-- liveeu folders): the copy that was read from the game last wins.\nfunction FCT_AddSaved(text)\n    local saved = FCT_ReadSaved(text)\n    if not saved then return false end\n    FuryCT_SV = FuryCT_SV or {}\n    for world, accounts in pairs(saved) do\n        if type(accounts) == \"table\" then\n            FuryCT_SV[world] = FuryCT_SV[world] or {}\n            for account, profile in pairs(accounts) do\n                local data = type(profile) == \"table\" and profile[\"$AccountWide\"]\n                local have = FuryCT_SV[world][account]\n                if type(data) == \"table\" and (not have or NewestRead(data) > NewestRead(have[\"$AccountWide\"])) then\n                    FuryCT_SV[world][account] = profile\n                end\n            end\n        end\n    end\n    return true\nend\n\n-- Text for the page -----------------------------------------------------------------------------\n-- Tables as JSON, the way the page's JavaScript reads them. A table with [1] is a list.\nlocal escapes = { ['\"'] = '\\\\\"', [\"\\\\\"] = \"\\\\\\\\\", [\"\\n\"] = \"\\\\n\", [\"\\r\"] = \"\\\\r\", [\"\\t\"] = \"\\\\t\" }\nlocal function Quote(text)\n    return '\"' .. text:gsub('[%c\"\\\\]', function(ch) return escapes[ch] or string.format(\"\\\\u%04x\", ch:byte()) end) .. '\"'\nend\nlocal function Json(value, out)\n    local kind = type(value)\n    if kind == \"string\" then\n        out[#out + 1] = Quote(value)\n    elseif kind == \"number\" then\n        if value ~= value or value == math.huge or value == -math.huge then\n            out[#out + 1] = \"null\"\n        elseif value == math.floor(value) then\n            out[#out + 1] = string.format(\"%d\", value)\n        else\n            out[#out + 1] = string.format(\"%.6f\", value)\n        end\n    elseif kind == \"boolean\" then\n        out[#out + 1] = value and \"true\" or \"false\"\n    elseif kind == \"table\" then\n        if value[1] ~= nil or next(value) == nil then\n            out[#out + 1] = \"[\"\n            for index = 1, #value do\n                if index > 1 then out[#out + 1] = \",\" end\n                Json(value[index], out)\n            end\n            out[#out + 1] = \"]\"\n        else\n            out[#out + 1] = \"{\"\n            local first = true\n            for key, item in pairs(value) do\n                if type(item) ~= \"function\" then\n                    if not first then out[#out + 1] = \",\" end\n                    first = false\n                    out[#out + 1] = Quote(tostring(key))\n                    out[#out + 1] = \":\"\n                    Json(item, out)\n                end\n            end\n            out[#out + 1] = \"}\"\n        end\n    else\n        out[#out + 1] = \"null\"\n    end\nend\nfunction FCT_Json(value)\n    local out = {}\n    Json(value, out)\n    return table.concat(out)\nend\n"}, {"name": "FurysCharacterTracker.lua", "text": "-- shared\n-- Fury's Character Tracker: the namespace, the saved data and its upgrade steps.\n--\n-- How the addon is laid out:\n--   Data/        text shown on screen, the skill lines, the tabs of the board\n--   Core/        helpers, the list of tracked things, the roster, history, the board's rules, the pages\n--   Trackers/    ONE FILE PER TRACKED THING: how to read it from the game, which game events make\n--                it stale, its board columns, its details lines, its export columns\n--   Game/        what only runs in game: reading (Scan), alerts, startup and slash commands\n--   UI/          the windows\n--\n-- A file whose first line is \"-- shared\" makes no game calls while it loads. The offline viewer\n-- (Windows Tools) runs those same files in the browser, so the viewer shows what the board shows\n-- without a second copy of the rules.\n\nFurysCharacterTracker = {}\nlocal CT = FurysCharacterTracker\n\nCT.name = \"FurysCharacterTracker\"\nCT.displayName = \"Fury's Character Tracker\"\nCT.version = \"1.8.4\"\n-- The Windows Tools (offline viewer, Excel export) can't ship in the ESOUI zip; this page has the download.\nCT.toolsUrl = \"https://github.com/AlbertHoffpauir/FurysCharacterTracker#downloads\"\n\n-- Saved per account, split per megaserver. Characters are saved under the game's own character ID\n-- (it never changes, a name can).\nCT.defaults = {\n    characters = {},   -- [character id] = everything read from that character (see Trackers/)\n    manual = {},       -- [character id] = what only you know: role, gear, planned race, note\n    order = {},        -- character ids in your board order\n    hidden = {},       -- [character id] = true: characters you took off the board\n    history = {},      -- [character id] = one short text per day played (see Core/History.lua)\n    exportRows = {},   -- \"FCT|...\" lines for the Windows Tools, written at logout and when you export\n    exportRequestedAt = 0,  -- set by the Export button; AutoExport.ps1 writes the CSV when it sees a new one\n    exportPending = false,\n    lastView = \"overview\",\n    sort = {},         -- [view id] = { col =, desc = } column the board is sorted by\n}\n\n-- True in game, false in the offline viewer.\nCT.live = false\n\n-- What a read of a character gathers. Raise it when a new version reads something more: the board\n-- then says which characters need one login to fill the new columns (each read stamps c.v).\nCT.READ_VERSION = 3\n\n-- Saved data version ------------------------------------------------------------------------\n-- Each step runs once, in order, on data saved before it existed. A change to the shape of the\n-- saved data is a new step at the end of this list. Steps only look at the data they are given,\n-- so they can run on every account in the file, whoever is logged in.\nCT.UPGRADES = {\n    -- 1: picks renamed and starter rows dropped (pre-1.0 test builds); one alert switch became two (1.2.0 test builds).\n    function(data)\n        CT.Roster.UpgradeOldPicks(data)\n        if data.alertsOff then data.alertResearch, data.alertRiding, data.alertsOff = false, false, nil end\n    end,\n    -- 2 (1.5.0): characters saved under their character ID instead of their name.\n    function(data)\n        CT.Roster.UpgradeToIds(data)\n    end,\n}\n\nfunction CT.UpgradeProfile(data, isNewInstall)\n    for key, value in pairs(CT.defaults) do\n        if data[key] == nil and type(value) == \"table\" then data[key] = {} end\n    end\n    local from = isNewInstall and #CT.UPGRADES or (data.dataVersion or 0)\n    for step = from + 1, #CT.UPGRADES do CT.UPGRADES[step](data) end\n    data.dataVersion = #CT.UPGRADES\nend\n\n-- Every account and megaserver in the file: the board can show any of them, so all of them have\n-- to be in today's shape.\nfunction CT.UpgradeAll()\n    for _, accounts in pairs(FuryCT_SV or {}) do\n        if type(accounts) == \"table\" then\n            for _, profile in pairs(accounts) do\n                local data = type(profile) == \"table\" and profile[\"$AccountWide\"]\n                if type(data) == \"table\" and (data.dataVersion or 0) < #CT.UPGRADES then CT.UpgradeProfile(data) end\n            end\n        end\n    end\nend\n\n-- Other accounts and megaservers -----------------------------------------------------------\n-- Every account that plays on this PC saves into the same file, so the board can show any of them.\n-- What you see for another account is what it saved the last time it logged out.\n-- CT.home = the account you are logged in on (in the viewer: nobody). CT.view = the one on the board.\n\nfunction CT.IsHome() return CT.live and CT.view == CT.home end\n\nlocal function Profile(entry)\n    local world = FuryCT_SV and FuryCT_SV[entry.world]\n    return world and world[entry.account] and world[entry.account][\"$AccountWide\"]\nend\n\n-- The saved data of the account being viewed (yours, unless you picked another one).\nfunction CT.Data()\n    if CT.IsHome() then return CT.sv end\n    local data = CT.view and Profile(CT.view)\n    if not data then\n        CT.view = CT.home or CT.Accounts()[1]\n        return CT.sv or (CT.view and Profile(CT.view)) or CT.defaults\n    end\n    return data\nend\n\n-- Every account and megaserver with characters in the file: yours first, then A to Z.\nfunction CT.Accounts()\n    local list = {}\n    for world, accounts in pairs(FuryCT_SV or {}) do\n        if type(accounts) == \"table\" then\n            for account, profile in pairs(accounts) do\n                local data = type(profile) == \"table\" and profile[\"$AccountWide\"]\n                if type(data) == \"table\" and type(data.characters) == \"table\" and next(data.characters) then\n                    local isHome = CT.home and world == CT.home.world and account == CT.home.account\n                    list[#list + 1] = isHome and CT.home or { world = world, account = account }\n                end\n            end\n        end\n    end\n    table.sort(list, function(a, b)\n        if (a == CT.home) ~= (b == CT.home) then return a == CT.home end\n        if a.account ~= b.account then return a.account < b.account end\n        return a.world < b.world\n    end)\n    return list\nend\n\n-- \"@Furyous · NA\"\nfunction CT.ViewLabel(entry)\n    entry = entry or CT.view\n    return string.format(\"%s  ·  %s\", entry.account, (entry.world:gsub(\" Megaserver\", \"\")))\nend\n\n-- Windows that want to redraw when the account on the board changes add themselves here.\nCT.viewListeners = {}\nfunction CT.SetView(entry)\n    CT.view = entry\n    for _, listener in ipairs(CT.viewListeners) do listener() end\nend\n"}, {"name": "Data/Text.lua", "text": "-- shared\n-- The words on the windows: buttons, legends, the Start here page, chat help. The words of one\n-- tracked thing (its column titles and hover texts) are in that thing's own file in Trackers/.\nlocal CT = FurysCharacterTracker\n\nlocal X = {}\nCT.TEXT = X\n\n-- Craft names for the offline viewer; in game the game's own names are used (see CT.CraftName).\nX.CRAFTS = { [1] = \"Blacksmithing\", [2] = \"Clothing\", [3] = \"Enchanting\", [4] = \"Alchemy\", [5] = \"Provisioning\",\n             [6] = \"Woodworking\", [7] = \"Jewelry Crafting\" }\n\nX.LEGEND = \"|cA08CFFViolet|r maxed  ·  bar = how far along  ·  |c8A86B0-|r none  ·  |c5CC2FFblue|r your pick  ·  |cFFC857amber|r waiting on you  ·  click a name for details  ·  right-click for the menu\"\nX.UNREAD = \"Not read yet. Log in on this character once and its row fills in.\"\nX.UNREAD_TIP = \"Not read yet. Log in on this character once, a few seconds is enough, and the addon reads everything about it.\\nRight-click to take it off the board.\"\nX.SORT_TIP = \"Click to sort by this column. Click again to reverse, a third time for your own order.\"\nX.ACCOUNT_TIP = \"The account and megaserver on the board. Every account that plays on this PC shows up here after it logs in once with the addon on.\\nOther accounts show what they saved at their last logout.\"\nX.SETTINGS_TIP = \"Settings\\n(also Settings > Addons > Fury's Character Tracker, or /fct settings)\"\nX.START_TIP = \"New here? One page on how the board works: getting your characters on it, what the colors mean, what each tab is for, and the alert switches.\\n(also /fct start)\"\n\n-- Buttons under the board, left to right. `id` is what the window does when one is clicked.\nX.FOOTER = {\n    { id = \"timers\", label = \"Research timers\",\n      tip = \"Every research slot on this account: what is researching, time left, and slots that are free.\\n(also /fct timers)\" },\n    { id = \"brag\", label = \"Brag card\",\n      tip = \"Your roster's best numbers on one card, sized for a screenshot to share on Discord.\\n(also /fct brag)\" },\n    { id = \"copy\", label = \"Copy for Discord\",\n      tip = \"The tab you are looking at as text, ready to paste into Discord.\\nIt opens selected: press Ctrl+C, then paste.\" },\n    { id = \"export\", label = \"Export to Excel\",\n      tip = \"Saves the board for the free Windows Tools, which write the Excel file. It reloads the UI, and asks you first.\\nNo reload needed: the offline viewer in the Windows Tools has its own Save for Excel button.\" },\n    { id = \"scan\", label = \"Read this character\",\n      tip = \"Reads the character you are on right now. It also happens by itself at login and after progress.\" },\n    { id = \"removed\", label = \"Show removed\",\n      tip = \"Puts back every character you took off the board with right-click > Remove.\" },\n}\n\nX.EXPORT_TITLE = \"Export to Excel\"\nX.EXPORT_BODY = \"This saves the board and reloads the UI (a few seconds, like /reloadui).\\n\\n\" ..\n    \"The file itself is written by the free Windows Tools. Get them with /fct tools, then either \" ..\n    \"open the offline viewer and click Save for Excel (no reload needed at all), or double-click \" ..\n    \"Turn On Auto Export.cmd in the Windows Tools folder once (it is a file there, not a setting in game) \" ..\n    \"and ESO Characters.csv appears in Documents\\\\Elder Scrolls Online after the reload.\\n\\nReload now?\"\nX.EXPORT_SAVED = \"Saved %s for export. If you have run Turn On Auto Export.cmd from the Windows Tools folder, ESO Characters.csv is in Documents\\\\Elder Scrolls Online in a few seconds. If not, open the offline viewer and click Save for Excel.\"\n\nX.HELP = {\n    \"/fct  open the board (also on a key: Controls > Keybindings > Fury's Character Tracker)\",\n    \"/fct start  the Start here page: how the board works, in one page\",\n    \"/fct overview, class, weapons, armor, guilds, world, crafting, traits, daily, weekly, collections, points, wallet, progress, sets  open a tab\",\n    \"/fct brag  the brag card: your best numbers on one screen, for a screenshot\",\n    \"/fct timers  research timers window: what each character is researching and time left\",\n    \"/fct research  research slots and timers in chat\",\n    \"/fct settings  open the settings page (or the gear on the board)\",\n    \"/fct alerts on | off  chat line when research or a riding lesson is ready on any character\",\n    \"/fct unread  characters never read, or not read in 7 days (/fct unread 30 for 30 days)\",\n    \"/fct scan  read this character again now\",\n    \"/fct export  export to Excel (asks first, then reloads the UI; the Windows Tools write the file)\",\n    \"/fct tools  get the Windows Tools (offline viewer, Excel export) from GitHub\",\n}\n\n-- The Start here page, in game and in the offline viewer. A line is a text, or a table:\n--   { \"text in game\", viewer = \"text in the offline viewer\" }   (viewer = false: not shown there)\n--   url = true: a click opens the Windows Tools download page\nX.START = {\n    { title = \"1. Get your characters on the board\", lines = {\n        \"Log in on each character once. A few seconds is enough: the addon reads it right after login.\",\n        { \"Characters not read yet are the dim rows at the bottom of the board. /fct unread lists them in chat.\",\n          viewer = \"Characters not read yet are the dim rows at the bottom of the board.\" },\n        { \"After that a character updates by itself whenever you play it. Nothing to click.\",\n          viewer = \"The game saves when you log out or reload the UI. Open the offline viewer again after that to see what is new.\" },\n    } },\n    { title = \"2. Read the board\", lines = {\n        \"Violet tile = maxed.   A bar behind a number = how far along.   Dim dash = not started.   Blue = your own pick.   Amber = waiting on you.\",\n        \"Hover any cell, or any column title, for what it means. Click a column title to sort by it.\",\n        { \"Click a character for everything saved about it. Right-click a row for its menu: details, move up or down, note, copy, remove.\",\n          viewer = \"Click a character for everything saved about it. Right-click a row to copy it for Discord. Picks, notes and your row order are changed in game.\" },\n        \"The bottom row counts how many characters have each column maxed.\",\n    } },\n    { title = \"3. The tabs\", lines = {\n        \"Overview: how many skill lines of each kind are maxed, with skill points, research and riding.\",\n        \"Class: level, race, alliance, the three class skill lines each character uses, and other class lines it has trained.\",\n        \"Weapons, Armor, Guilds & AvA, World, Crafting: the rank of every skill line.\",\n        \"Research: traits known in each craft, research slots in use, time until the next one finishes.\",\n        \"Daily: what each character can still do today. Crafting writs, the riding lesson, free research slots, and the first random dungeon, battleground and Tribute match of the day (reward and large XP bonus).\",\n        \"Weekly: the weekly leaderboards (the weekly trial and weekly arena, named in the column titles, Infinite Archive, battlegrounds). Each row shows who ran what; the bottom row is the account's best score and place. Amber = outside the top 500, where the rewards go.\",\n        \"Collections: recipes, furnishing plans, motifs, scribing, companions and hours played.\",\n        \"Skill points: where the points still to earn are: skyshards, public dungeon group events, Alliance War rank.\",\n        \"Wallet & CP: gold and other currencies, bag space, Champion Points. The bank is on the line above.\",\n        \"Progress: what each character gained in the last 7 and 30 days.\",\n        \"Roles & gear: your own role, gear and race picks, a note, and the sets each character is wearing.\",\n    } },\n    { title = \"4. Alerts: everything starts turned off. Click a line to switch it.\", switches = true },\n    { title = \"5. More\", lines = {\n        { \"Research timers, Brag card, Copy for Discord: buttons under the board. The gear at the top is Settings.\",\n          viewer = \"Research timers, Brag card, Copy for Discord and Save for Excel: buttons under the board.\" },\n        { \"Keys for the board and its windows: Controls > Keybindings > Fury's Character Tracker.\", viewer = false },\n        \"Other accounts on this PC: the button at the top right of the board switches between them.\",\n        { \"Offline viewer and Excel export: the free Windows Tools. Click here to get them (the game asks first).\", url = true, viewer = false },\n    } },\n}\nX.START_VIEWER = \"Alerts are switched in game: the Start here page there, or Settings > Addons > Fury's Character Tracker.\"\n\n-- The switches of the Start here page and the settings page: saved field, label, what it does.\n-- `on` tells how the field reads when it was never set (existing users from before 1.5.0).\nX.SWITCHES = {\n    { field = \"alertResearch\", label = \"Research finished\", about = \"a chat line when research finishes on any character.\", unsetIsOn = true, alerts = true },\n    { field = \"alertRiding\", label = \"Riding lesson ready\", about = \"a chat line when a character can take its next lesson.\", unsetIsOn = true, alerts = true },\n    { field = \"loginNotice\", label = \"Summary at login\", about = \"one chat line naming what finished while you were away.\", unsetIsOn = true },\n    { field = \"openAtLogin\", label = \"Open the board at login\", about = \"the board is on screen every time you log in.\", unsetIsOn = false },\n}\n"}, {"name": "Data/Lines.lua", "text": "-- shared\n-- The skill lines on the board, grouped.\n-- name: the line's name as the game shows it (English client). max: its top rank.\n-- (Scribing is not here: it has no skill line. It is learned like recipes, so the board counts it.)\n-- short: column title on the board. keepPeak: the game hides the line when you are cured,\n-- so the board keeps the highest rank it has ever seen instead of dropping to nothing.\nlocal CT = FurysCharacterTracker\n\nCT.GROUPS = {\n    { id = \"weapons\", title = \"Weapons\", lines = {\n        { name = \"Two Handed\",          short = \"2H\",      max = 50 },\n        { name = \"One Hand and Shield\", short = \"1H+S\",    max = 50 },\n        { name = \"Dual Wield\",          short = \"DW\",      max = 50 },\n        { name = \"Bow\",                 short = \"Bow\",     max = 50 },\n        { name = \"Destruction Staff\",   short = \"Destro\",  max = 50 },\n        { name = \"Restoration Staff\",   short = \"Resto\",   max = 50 },\n    } },\n    { id = \"armor\", title = \"Armor\", lines = {\n        { name = \"Light Armor\",  short = \"Light\",  max = 50 },\n        { name = \"Medium Armor\", short = \"Medium\", max = 50 },\n        { name = \"Heavy Armor\",  short = \"Heavy\",  max = 50 },\n    } },\n    { id = \"guilds\", title = \"Guilds & AvA\", short = \"Guilds\", lines = {\n        { name = \"Dark Brotherhood\", short = \"Dark Bro\",  max = 12 },\n        { name = \"Fighters Guild\",   short = \"Fighters\",  max = 10 },\n        { name = \"Mages Guild\",      short = \"Mages\",     max = 10 },\n        { name = \"Psijic Order\",     short = \"Psijic\",    max = 10 },\n        { name = \"Thieves Guild\",    short = \"Thieves\",   max = 12 },\n        { name = \"Undaunted\",        short = \"Undaunted\", max = 10 },\n        { name = \"Assault\",          short = \"Alliance War\", max = 10 },  -- Support ranks with it\n    } },\n    { id = \"world\", title = \"World\", lines = {\n        { name = \"Excavation\",  short = \"Antiquities\", max = 10 },  -- Scrying ranks with it\n        { name = \"Soul Magic\",  short = \"Soul Magic\",  max = 6 },\n        { name = \"Legerdemain\", short = \"Legerdemain\", max = 20 },\n        { name = \"Vampire\",     short = \"Vampire\",     max = 10, keepPeak = true },\n        { name = \"Werewolf\",    short = \"Werewolf\",    max = 10, keepPeak = true },\n    } },\n    { id = \"crafting\", title = \"Crafting\", lines = {\n        { name = \"Blacksmithing\",    short = \"Smith\",   max = 50 },\n        { name = \"Clothing\",         short = \"Cloth\",   max = 50 },\n        { name = \"Woodworking\",      short = \"Wood\",    max = 50 },\n        { name = \"Jewelry Crafting\", short = \"Jewelry\", max = 50 },\n        { name = \"Alchemy\",          short = \"Alchemy\", max = 50 },\n        { name = \"Enchanting\",       short = \"Enchant\", max = 50 },\n        { name = \"Provisioning\",     short = \"Provis\",  max = 50 },\n    } },\n}\n\nCT.RESEARCH_TOTAL = 324   -- 9 traits on each of 36 items (smithing, clothing, woodworking, jewelry)\nCT.CP_MAX = 3600         -- Champion Point cap; change it here if ZOS raises it\nCT.RIDING_MAX = 180       -- speed, stamina and capacity, 60 each\nCT.SKILL_POINTS_MAX = 586 -- most a character can earn as of Update 50 (Nov 2026); change it if ZOS adds more\nCT.COMPANION_TOTAL = 8    -- used until the game has told us how many companions exist\nCT.COMPANION_LEVEL_MAX = 20  -- top level of a companion\nCT.SCRIPTS_TOTAL = 79     -- scribing grimoires + scripts, until the game has told us how many exist\nCT.CLASS_LINE_MAX = 50    -- top rank of a class skill line\nCT.AVA_RANK_MAX = 50      -- Alliance War rank; each rank gives one skill point\n\n-- Language-neutral IDs, so the addon works on every client language. Taken with /fct ids on an\n-- English client: [skillLineId] = English line name, [questId] = companion short name.\n-- Anything missing here falls back to matching the English name.\nCT.SKILL_LINE_IDS = {\n    [24] = \"Light Armor\", [25] = \"Medium Armor\", [26] = \"Heavy Armor\",\n    [29] = \"One Hand and Shield\", [30] = \"Two Handed\", [31] = \"Dual Wield\", [32] = \"Bow\",\n    [33] = \"Destruction Staff\", [34] = \"Restoration Staff\",\n    [44] = \"Mages Guild\", [45] = \"Fighters Guild\", [48] = \"Assault\", [55] = \"Undaunted\",\n    [117] = \"Thieves Guild\", [118] = \"Dark Brotherhood\", [130] = \"Psijic Order\",\n    [50] = \"Werewolf\", [51] = \"Vampire\", [72] = \"Soul Magic\", [111] = \"Legerdemain\", [157] = \"Excavation\",\n    [76] = \"Provisioning\", [77] = \"Alchemy\", [78] = \"Enchanting\", [79] = \"Blacksmithing\",\n    [80] = \"Woodworking\", [81] = \"Clothing\", [141] = \"Jewelry Crafting\",\n}\nCT.INTRO_QUEST_IDS = {\n    [6626] = \"Bastian\", [6648] = \"Mirri\", [6760] = \"Isobel\", [6771] = \"Ember\",\n    [7017] = \"Sharp\", [7021] = \"Azandar\", [7186] = \"Tanlorin\", [7194] = \"Zerith\",\n}\n\n-- Lines by name, for the scanner and the board.\nCT.LINE_BY_NAME = {}\nfor _, group in ipairs(CT.GROUPS) do\n    for _, line in ipairs(group.lines) do\n        line.group = group.id\n        CT.LINE_BY_NAME[line.name] = line\n    end\nend\n"}, {"name": "Core/Util.lua", "text": "-- shared\n-- Small helpers used everywhere.\nlocal CT = FurysCharacterTracker\nlocal U = {}\nCT.Util = U\n\nfunction U.Print(fmt, ...)\n    local text = select(\"#\", ...) > 0 and string.format(fmt, ...) or fmt\n    CHAT_ROUTER:AddSystemMessage(\"|cA08CFF[Character Tracker]|r \" .. text)\nend\n\nfunction U.FormatDate(timestamp)\n    if not timestamp or timestamp == 0 then return \"\" end\n    return os.date(\"%Y-%m-%d\", timestamp)\nend\n\n-- \"Sat 03:15 PM\"\nfunction U.DayTime(timestamp)\n    return os.date(\"%a %I:%M %p\", timestamp)\nend\n\nfunction U.Plain(text)\n    -- Strip the game's grammar markers (\"Infuryate^Mx\" -> \"Infuryate\").\n    return zo_strformat(\"<<1>>\", text or \"\")\nend\n\n-- 1234567 -> \"1,234,567\". Whole numbers only.\nfunction U.Comma(n)\n    return ZO_CommaDelimitNumber(math.floor((n or 0) + 0.5))\nend\n\n-- A whole number as text: \"5\", never \"5.0\" (the offline viewer's Lua writes whole decimals that way).\nfunction U.Whole(n)\n    return string.format(\"%d\", math.floor((n or 0) + 0.5))\nend\n\n-- \"12/50\"\nfunction U.Of(value, max)\n    return U.Whole(value) .. \"/\" .. U.Whole(max)\nend\n\n-- A craft's name: the game's own in game, English in the offline viewer.\nfunction U.CraftName(craft)\n    if CT.live then return U.Plain(GetString(\"SI_TRADESKILLTYPE\", craft)) end\n    return CT.TEXT.CRAFTS[craft] or \"?\"\nend\n\n-- \"+1,234\", \"-56\", \"0\"\nfunction U.Signed(n)\n    n = math.floor((n or 0) + 0.5)\n    if n > 0 then return \"+\" .. ZO_CommaDelimitNumber(n) end\n    if n < 0 then return \"-\" .. ZO_CommaDelimitNumber(-n) end\n    return \"0\"\nend\n\n-- 1234567 -> \"1.2M\", 45200 -> \"45k\", 950 -> \"950\": for cells too narrow for the whole number.\nfunction U.Short(n)\n    n = math.floor((n or 0) + 0.5)\n    local sign = n < 0 and \"-\" or \"\"\n    if n < 0 then n = -n end\n    if n >= 1000000 then return string.format(\"%s%.1fM\", sign, math.floor(n / 100000) / 10) end\n    if n >= 10000 then return string.format(\"%s%dk\", sign, math.floor(n / 1000)) end\n    return sign .. ZO_CommaDelimitNumber(n)\nend\n\n-- \"1 character\", \"3 characters\"\nfunction U.Count(n, word, plural)\n    return string.format(\"%d %s\", n, n == 1 and word or (plural or (word .. \"s\")))\nend\n\n-- \"2d 4h\", \"5h 12m\", \"12m\"\nfunction U.Duration(seconds)\n    seconds = math.max(0, seconds)\n    local days, hours, minutes = math.floor(seconds / 86400), math.floor(seconds % 86400 / 3600), math.floor(seconds % 3600 / 60)\n    if days > 0 then return string.format(\"%dd %dh\", days, hours) end\n    if hours > 0 then return string.format(\"%dh %dm\", hours, minutes) end\n    return string.format(\"%dm\", math.max(minutes, 1))\nend\n\n-- Noon of the calendar day a moment falls on, in your own time zone.\nlocal function Noon(timestamp)\n    local d = os.date(\"*t\", timestamp)\n    return os.time({ year = d.year, month = d.month, day = d.day, hour = 12 })\nend\n\n-- Whole calendar days from one moment to another.\nfunction U.DaysBetween(from, to)\n    return math.floor((Noon(to) - Noon(from)) / 86400 + 0.5)\nend\n\n-- \"today\", \"yesterday\", \"3 days ago\", by calendar day in your own time zone.\nfunction U.Ago(timestamp)\n    if not timestamp or timestamp == 0 then return \"never\" end\n    local days = U.DaysBetween(timestamp, GetTimeStamp())\n    if days <= 0 then return \"today\" end\n    if days == 1 then return \"yesterday\" end\n    return days .. \" days ago\"\nend\n\n-- Splits \"a|b|c\" into { \"a\", \"b\", \"c\" } (empty parts kept).\nfunction U.Split(text, separator)\n    local parts, from = {}, 1\n    while true do\n        local at = string.find(text, separator, from, true)\n        if not at then\n            parts[#parts + 1] = string.sub(text, from)\n            return parts\n        end\n        parts[#parts + 1] = string.sub(text, from, at - 1)\n        from = at + #separator\n    end\nend\n\n-- Text safe to put between \"|\" and \";\" separators in saved lines.\nfunction U.Clean(text)\n    return (tostring(text or \"\"):gsub(\"[|;\\n]\", \" \"))\nend\n\n-- A game icon drawn inside text.\nfunction U.Icon(path, size)\n    if not path or path == \"\" then return \"\" end\n    return string.format(\"|t%d:%d:%s|t\", size or 20, size or 20, path)\nend\n"}, {"name": "Core/Trackers.lua", "text": "-- shared\n-- The list of tracked things. Each file in Trackers/ calls CT.Track once (or once per part) with:\n--\n--   id        short name of the part (\"riding\", \"wallet\")\n--   read      function(c, account): reads it from the game into the character's saved table `c`\n--             (or into `account` for numbers the whole account shares). Game calls go only in here.\n--   events    game events after which it is read again\n--   start     function(queue, current): for events that need more care than \"read it again\".\n--             queue() asks for a new read in a few seconds (queue(true): at once); current() is the\n--             saved table of the character you are on.\n--   columns   board columns (the fields of a column are listed in Core/Board.lua).\n--             A tab shows a column by naming its key in Data/Views.lua.\n--   summary   function(e): items for the \"Progress\" block of the details window\n--   sections  function(e): its own blocks in the details window\n--   export    { { \"Column title\", function(e) return value end }, ... } for the Excel export\n--\n-- `e` is a board entry: { id =, name =, c = saved character, m = your picks }.\n-- To track something new: add a file here, list it in the manifest, and name its column keys in\n-- a tab in Data/Views.lua. Nothing else needs to change, in game or in the offline viewer.\nlocal CT = FurysCharacterTracker\nlocal Trackers = { list = {}, byId = {}, columns = {} }\nCT.Trackers = Trackers\n\nfunction CT.Track(def)\n    Trackers.list[#Trackers.list + 1] = def\n    Trackers.byId[def.id] = def\n    for _, column in ipairs(def.columns or {}) do\n        column.tracker = def.id\n        Trackers.columns[column.key] = column\n    end\n    return def\nend\n\nfunction Trackers.Column(key)\n    return Trackers.columns[key]\nend\n\n-- Columns shared by every tab are made once; a tab names them by key.\nfunction Trackers.Columns(keys)\n    local list = {}\n    for _, key in ipairs(keys) do\n        local column = Trackers.columns[key]\n        if column then list[#list + 1] = column end\n    end\n    return list\nend\n\n-- \"x of y\" items for the details window.\n-- { key, value text, done = true when complete, dim = true when nothing yet }\nfunction Trackers.Progress(key, value, max)\n    value = value or 0\n    local U = CT.Util\n    local text = max and (U.Comma(value) .. \" / \" .. U.Comma(max)) or U.Comma(value)\n    return { key, text, done = (max ~= nil and value >= max), dim = value == 0 }\nend\n"}, {"name": "Core/Roster.lua", "text": "-- shared\n-- The stored roster. One entry per character, saved under the game's character ID:\n--   data.characters[id]  what was read from the game the last time you logged in on it\n--   data.manual[id]      what only you know: role, gear, planned race, note\n--   data.order           the ids in your board order\n-- A board entry `e` is { id =, name =, c = data.characters[id], m = data.manual[id] }.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal Roster = {}\nCT.Roster = Roster\n\n-- Dropdown choices. Gear is what you have farmed for that character, not what it is wearing.\nRoster.ROLES = { \"Tank\", \"Healer\", \"DPS\", \"Tank/DPS\", \"Tank/Healer\", \"DPS/Healer\", \"Tank/Healer/DPS\" }\nRoster.GEAR = { \"Trial set\", \"Crafted set\", \"Overland set\", \"Mixed\", \"None\" }\nRoster.RACES = { \"\", \"Altmer\", \"Argonian\", \"Bosmer\", \"Breton\", \"Dark Elf\", \"Imperial\", \"Khajiit\", \"Nord\", \"Orc\", \"Redguard\" }\n\nRoster.FIELDS = {\n    role         = { title = \"Role\", values = Roster.ROLES },\n    dpsGear      = { title = \"DPS gear\", values = Roster.GEAR },\n    roleGear     = { title = \"Tank/healer gear\", values = Roster.GEAR },\n    plannedRace  = { title = \"Planned race\", values = Roster.RACES },\n}\n\n-- Upgrade steps (see CT.UPGRADES in FurysCharacterTracker.lua) ------------------------------------\n\n-- Saved data from pre-1.0 test versions: renamed picks, and starter rows that were never read from the game.\nlocal OLD_ROLE = { Heal = \"Healer\", [\"DPS/Heal\"] = \"DPS/Healer\" }\nlocal OLD_DPS_SETS = { Trial = \"Trial set\", Crafted = \"Crafted set\", No = \"None\" }\nlocal OLD_ROLE_SETS = { Yes = \"Trial set\", No = \"None\" }\n\n-- Step 1.\nfunction Roster.UpgradeOldPicks(data)\n    -- Rows that were never read from the game: drop them. Picks for them stay in data.manual and\n    -- come back the first time you log in on that character.\n    if data.seeded ~= nil then\n        local keep = {}\n        for _, name in ipairs(data.order) do\n            local c = data.characters[name]\n            if c and c.source == \"live\" then\n                keep[#keep + 1] = name\n            else\n                data.characters[name] = nil\n            end\n        end\n        data.order = keep\n        data.seeded = nil\n    end\n    for _, m in pairs(data.manual) do\n        if m.role then m.role = OLD_ROLE[m.role] or m.role end\n        if m.dpsSets then m.dpsGear = m.dpsGear or OLD_DPS_SETS[m.dpsSets]; m.dpsSets = nil end\n        if m.roleSets then m.roleGear = m.roleGear or OLD_ROLE_SETS[m.roleSets]; m.roleSets = nil end\n        if m.proposedRace then m.plannedRace = m.plannedRace or m.proposedRace; m.proposedRace = nil end\n    end\nend\n\n-- Step 2 (1.5.0): everything that was saved under a character's name moves under its character ID.\n-- The ID was already saved inside each character. One without it (never seen in practice) stays\n-- under its name until you log in on it, and Roster:Store moves it then.\nfunction Roster.UpgradeToIds(data)\n    local idOf, characters = {}, {}\n    for name, c in pairs(data.characters) do\n        local id = c.id and tostring(c.id) or name\n        c.id, c.name = id, c.name or name\n        characters[id], idOf[name] = c, id\n    end\n    data.characters = characters\n    local function Rekey(list)\n        local out = {}\n        for name, value in pairs(list or {}) do out[idOf[name] or name] = value end\n        return out\n    end\n    data.manual, data.hidden = Rekey(data.manual), Rekey(data.hidden)\n    if data.companionSeen then data.companionSeen = Rekey(data.companionSeen) end\n    local order = {}\n    for _, name in ipairs(data.order) do\n        if idOf[name] then order[#order + 1] = idOf[name] end\n    end\n    data.order = order\n    data.exportRows = {}\n    -- Sort orders were saved by column number; columns have names now.\n    data.sort = {}\n    local alliances = { [\"Aldmeri Dominion\"] = 1, [\"Ebonheart Pact\"] = 2, [\"Daggerfall Covenant\"] = 3 }\n    data.history = data.history or {}\n    for id, c in pairs(characters) do\n        c.allianceId = c.allianceId or alliances[c.alliance or \"\"]\n        -- Progress over time starts from what was saved at the last read.\n        if c.lastScan and not data.history[id] then data.history[id] = { CT.History.Line(c, c.lastScan) } end\n    end\nend\n\n-- Storing what was read -----------------------------------------------------------------------\n\nlocal function InOrder(data, id)\n    for _, other in ipairs(data.order) do\n        if other == id then return true end\n    end\n    return false\nend\n\n-- Things saved under a character's name before its ID was known (old data, or picks made on a\n-- row that had not been read yet) move under the ID.\nlocal function Adopt(data, name, id)\n    if not name or name == id then return end\n    for _, list in ipairs({ data.manual, data.history, data.companionSeen or {} }) do\n        if list[name] ~= nil then\n            if list[id] == nil then list[id] = list[name] end\n            list[name] = nil\n        end\n    end\n    data.hidden[name] = nil\n    if data.characters[name] then\n        data.characters[name] = nil\n        for index, other in ipairs(data.order) do\n            if other == name then data.order[index] = id end\n        end\n    end\nend\n\n-- Game only: called by the reader with the character you are on.\nfunction Roster:Store(id, c)\n    local sv = CT.sv\n    sv.characters[id] = c\n    sv.hidden[id] = nil\n    Adopt(sv, c.name, id)\n    if not InOrder(sv, id) then sv.order[#sv.order + 1] = id end\n    if not sv.manual[id] then\n        -- The role the group finder is set to, for a character you have not given a role yet.\n        local lfgRoles = { [LFG_ROLE_TANK] = \"Tank\", [LFG_ROLE_DPS] = \"DPS\", [LFG_ROLE_HEAL] = \"Healer\" }\n        sv.manual[id] = { role = lfgRoles[GetSelectedLFGRole()] or \"DPS\" }\n    end\n    CT.History.Record(sv, id, c)\nend\n\nfunction Roster:UpdatePlayed(id, seconds)\n    local c = CT.sv.characters[id]\n    if c then\n        c.playedHours = zo_round(seconds / 3600)\n    end\nend\n\n-- Reading the roster --------------------------------------------------------------------------\n\nfunction Roster:Get(id, data)\n    data = data or CT.Data()\n    return data.characters[id], data.manual[id] or {}\nend\n\nfunction Roster:Entry(id, data)\n    data = data or CT.Data()\n    local c = data.characters[id]\n    if not c then return nil end\n    return { id = id, name = c.name or id, c = c, m = data.manual[id] or {} }\nend\n\nfunction Roster:IdByName(name, data)\n    data = data or CT.Data()\n    for id, c in pairs(data.characters) do\n        if c.name == name then return id end\n    end\nend\n\nfunction Roster:SetManual(id, field, value)\n    local data = CT.Data()\n    data.manual[id] = data.manual[id] or {}\n    data.manual[id][field] = (value ~= \"\") and value or nil\nend\n\nfunction Roster:Hide(key)\n    CT.Data().hidden[key] = true\nend\n\nfunction Roster:ShowAll()\n    local hidden = CT.Data().hidden\n    for key in pairs(hidden) do hidden[key] = nil end\nend\n\n-- True when \"Show removed\" has something to bring back.\nfunction Roster:AnyHidden()\n    return next(CT.Data().hidden) ~= nil\nend\n\n-- Your own row order: move a character up or down one row, or to the top or bottom.\n-- `where`: \"up\", \"down\", \"top\", \"bottom\". Hidden characters keep their place and are skipped over.\nfunction Roster:Move(id, where)\n    local data = CT.Data()\n    local order, at = data.order, nil\n    for index, other in ipairs(order) do\n        if other == id then at = index end\n    end\n    if not at then return false end\n    local function Shown(index)\n        local other = order[index]\n        return other and data.characters[other] and not data.hidden[other]\n    end\n    local to = at\n    if where == \"up\" or where == \"down\" then\n        local step = where == \"up\" and -1 or 1\n        to = at + step\n        while order[to] and not Shown(to) do to = to + step end\n        if not order[to] then return false end\n    elseif where == \"top\" then\n        to = 1\n    elseif where == \"bottom\" then\n        to = #order\n    end\n    if to == at then return false end\n    table.remove(order, at)\n    table.insert(order, to, id)\n    return true\nend\n\n-- Characters on the board, in board order (or sorted by a column value).\n-- `data` defaults to the account being viewed. `sortValue` is function(entry) -> number or text.\nfunction Roster:List(sortValue, descending, data)\n    data = data or CT.Data()\n    local list = {}\n    for index, id in ipairs(data.order) do\n        local c = data.characters[id]\n        if c and not data.hidden[id] then\n            list[#list + 1] = { id = id, name = c.name or id, c = c, m = data.manual[id] or {}, index = index }\n        end\n    end\n    if sortValue then\n        local keys = {}\n        for _, entry in ipairs(list) do keys[entry] = sortValue(entry) end\n        table.sort(list, function(a, b)\n            local va, vb = keys[a], keys[b]\n            if va == vb then return a.index < b.index end\n            if descending then return va > vb end\n            return va < vb\n        end)\n    end\n    return list\nend\n\n-- Lines of a group at their top rank, for one character.\nfunction Roster:MaxedInGroup(c, group)\n    local maxed = 0\n    for _, line in ipairs(group.lines) do\n        if (c.lines and c.lines[line.name] or 0) >= line.max then maxed = maxed + 1 end\n    end\n    return maxed\nend\n\n-- Game only. What the game knows about every character on your account without logging in on it,\n-- in the game's own order.\nfunction Roster:GameCharacters()\n    local list = {}\n    for index = 1, GetNumCharacters() do\n        local name, gender, level, classId, raceId, alliance, id = GetCharacterInfo(index)\n        list[#list + 1] = { id = id, name = U.Plain(name), classId = classId, class = U.Plain(GetClassName(gender, classId)),\n                            raceId = raceId, race = U.Plain(GetRaceName(gender, raceId)), level = level,\n                            allianceId = alliance, alliance = U.Plain(GetAllianceName(alliance)) }\n    end\n    return list\nend\n\n-- One saved line per character on the account, for the rows of characters not read yet.\nfunction Roster.RosterLine(info)\n    return table.concat({ info.id, U.Clean(info.name), info.classId, U.Clean(info.class), info.raceId, U.Clean(info.race), info.level,\n                          info.allianceId, U.Clean(info.alliance) }, \"|\")\nend\n\n-- Every character on the account being viewed. Your own account, in game: asked from the game.\n-- Otherwise: what the account saved the last time it was played (\"id|name|classId|class|raceId|\n-- race|level|allianceId|alliance\"; \"name|class|race|level|alliance\" or only names before 1.5.0).\nfunction Roster:AccountRoster()\n    if CT.IsHome() then return self:GameCharacters() end\n    local account = CT.Data().account or {}\n    local list = {}\n    if account.roster then\n        for _, text in ipairs(account.roster) do\n            local p = U.Split(text, \"|\")\n            if #p >= 9 then\n                list[#list + 1] = { id = p[1], name = p[2], classId = tonumber(p[3]), class = p[4], raceId = tonumber(p[5]), race = p[6],\n                                    level = tonumber(p[7]), allianceId = tonumber(p[8]), alliance = p[9] }\n            elseif #p >= 5 then\n                list[#list + 1] = { name = p[1], class = p[2], race = p[3], level = tonumber(p[4]), alliance = p[5] }\n            end\n        end\n    else\n        for _, name in ipairs(account.characterNames or {}) do list[#list + 1] = { name = name } end\n    end\n    return list\nend\n\n-- Characters on the account the addon has never read, A to Z, with what the game says about them.\n-- Ones you removed from the board don't count. `key` is what the row is hidden under.\nfunction Roster:Unread()\n    local data, list = CT.Data(), {}\n    local names = {}\n    for _, c in pairs(data.characters) do\n        if c.name then names[c.name] = true end\n    end\n    for _, info in ipairs(self:AccountRoster()) do\n        local known = (info.id and data.characters[info.id]) or names[info.name]\n        info.key = info.id or info.name\n        if not known and not data.hidden[info.key] and not data.hidden[info.name] then list[#list + 1] = info end\n    end\n    table.sort(list, function(a, b) return a.name < b.name end)\n    return list\nend\n\n-- Characters to log in on: never read, then the ones not read in the last `days` days, oldest first.\n-- Names of the characters whose last read was by a version that gathered less than this one.\nfunction Roster:ReadByOlderVersion()\n    local names = {}\n    for _, entry in ipairs(self:List()) do\n        if (entry.c.v or 1) < CT.READ_VERSION then names[#names + 1] = entry.name end\n    end\n    return names\nend\n\nfunction Roster:PrintToDo(days)\n    local never = {}\n    for _, info in ipairs(self:Unread()) do never[#never + 1] = info.name end\n    local cutoff = GetTimeStamp() - days * 86400\n    local due = {}\n    for _, entry in ipairs(self:List()) do\n        local last = entry.c.lastScan or 0\n        if last < cutoff then due[#due + 1] = { name = entry.name, last = last } end\n    end\n    table.sort(due, function(a, b) return a.last < b.last end)\n    local old = self:ReadByOlderVersion()\n    if #old > 0 then\n        U.Print(\"%d last read by an older version, so the new columns show a dash (log in on each once): %s\", #old, table.concat(old, \", \"))\n    end\n    if #never == 0 and #due == 0 then\n        if #old > 0 then return end\n        U.Print(\"All %s on this account were read in the last %d days. Nothing to do.\", U.Count(#self:AccountRoster(), \"character\"), days)\n        return\n    end\n    if #never > 0 then\n        U.Print(\"%d never read (log in on each for a few seconds): %s\", #never, table.concat(never, \", \"))\n    end\n    if #due > 0 then\n        local names = {}\n        for _, d in ipairs(due) do names[#names + 1] = string.format(\"%s (%s)\", d.name, U.Ago(d.last)) end\n        U.Print(\"%d not read in %d days, oldest first: %s\", #due, days, table.concat(names, \", \"))\n    end\nend\n\n-- Export ------------------------------------------------------------------------------\n-- One row per character. The columns are the `export` lists of the trackers, in tracker order.\n\nfunction Roster:ExportColumns()\n    local columns = {}\n    for _, tracker in ipairs(CT.Trackers.list) do\n        for _, column in ipairs(tracker.export or {}) do columns[#columns + 1] = column end\n    end\n    return columns\nend\n\n-- { header row, one row per character }, each a list of texts, for the account on the board\n-- (or `data`, saved by the account `view`). The first two cells say whose characters they are.\nfunction Roster:ExportRows(data, view)\n    data, view = data or CT.Data(), view or CT.view\n    local columns = self:ExportColumns()\n    local header = { \"Account\", \"Server\" }\n    for _, column in ipairs(columns) do header[#header + 1] = column[1] end\n    local rows = { header }\n    local account, server = view and view.account or \"\", view and (view.world:gsub(\" Megaserver\", \"\")) or \"\"\n    for _, entry in ipairs(self:List(nil, nil, data)) do\n        local row = { account, server }\n        for _, column in ipairs(columns) do\n            local value = column[2](entry)\n            -- One cell, one line: a tab or a line break inside a value would split the row in Excel.\n            row[#row + 1] = value == nil and \"\" or (string.gsub(tostring(value), \"[\\t\\r\\n]\", \" \"))\n        end\n        rows[#rows + 1] = row\n    end\n    return rows\nend\n\n-- Game only: \"FCT|\" lines, tab separated, saved for ExportToExcel.ps1 and AutoExport.ps1 (Windows\n-- Tools). Your own account's rows, written on the way out (logout, /reloadui) and when you export.\nfunction Roster:BuildExportRows()\n    local rows = {}\n    for i, row in ipairs(self:ExportRows(CT.sv, CT.home)) do\n        rows[i] = \"FCT|\" .. table.concat(row, \"\\t\")\n    end\n    CT.sv.exportRows = rows\n    return #rows - 1\nend\n"}, {"name": "Core/History.lua", "text": "-- shared\n-- Progress over time. One short text per character per day it was played, oldest first:\n--   data.history[id] = { \"20261125;gold;skill points;hours played;achievement points;traits researched\", ... }\n-- The Progress tab compares today with the line from 7 and 30 days ago.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal History = {}\nCT.History = History\n\nHistory.MAX_DAYS = 400   -- lines kept per character: over a year of playing it every day\n-- Where each number sits in a line (the day is first).\nHistory.FIELDS = { gold = 2, skillPoints = 3, playedHours = 4, achievementPoints = 5, research = 6 }\n\nfunction History.Day(timestamp)\n    return os.date(\"%Y%m%d\", timestamp)\nend\n\nfunction History.Line(c, timestamp)\n    return table.concat({ History.Day(timestamp), c.gold or 0, c.skillPoints or 0, c.playedHours or 0,\n                          c.achievementPoints or 0, c.research or 0 }, \";\")\nend\n\n-- Called after every read of a character: today's line is added, or replaced if there is one.\nfunction History.Record(data, id, c, now)\n    now = now or GetTimeStamp()\n    local list = data.history[id] or {}\n    data.history[id] = list\n    local line = History.Line(c, now)\n    local last = list[#list]\n    if last and string.sub(last, 1, 8) == string.sub(line, 1, 8) then\n        list[#list] = line\n    else\n        list[#list + 1] = line\n        if #list > History.MAX_DAYS then table.remove(list, 1) end\n    end\nend\n\n-- The line to compare with: the newest one from `days` ago or before. A character tracked for\n-- less time than that is compared with its first line.\n-- Returns the line's numbers as a list and its day (\"YYYYMMDD\"), or nil when nothing is saved.\nfunction History.Baseline(list, days, now)\n    if not list or #list == 0 then return nil end\n    local target = History.Day(now - days * 86400)\n    local found = list[1]\n    for index = #list, 1, -1 do\n        if string.sub(list[index], 1, 8) <= target then\n            found = list[index]\n            break\n        end\n    end\n    local parts = U.Split(found, \";\")\n    for index = 2, #parts do parts[index] = tonumber(parts[index]) or 0 end\n    return parts, parts[1]\nend\n\n-- How much `field` grew over the last `days` days, and the day it is counted from.\nfunction History.Delta(data, id, c, field, days, now)\n    local base, day = History.Baseline(data.history[id], days, now or GetTimeStamp())\n    if not base then return nil end\n    return (c[field] or 0) - (base[History.FIELDS[field]] or 0), day\nend\n\n-- \"20261125\" -> \"2026-11-25\"\nfunction History.DayText(day)\n    return string.sub(day, 1, 4) .. \"-\" .. string.sub(day, 5, 6) .. \"-\" .. string.sub(day, 7, 8)\nend\n\n-- The first day a character has a line for, or nil.\nfunction History.Since(data, id)\n    local list = data.history[id]\n    return list and list[1] and string.sub(list[1], 1, 8) or nil\nend\n"}, {"name": "Trackers/Basics.lua", "text": "-- shared\n-- Who the character is: name, class, race, alliance, level, time played, achievement points.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\n-- The game's alliance badges (EsoUI/Common/Globals/AllianceToIcon.lua), by alliance ID.\nlocal ALLIANCE_ICONS = {\n    [1] = \"EsoUI/Art/CharacterWindow/allianceBadge_aldmeri.dds\",\n    [2] = \"EsoUI/Art/CharacterWindow/allianceBadge_ebonheart.dds\",\n    [3] = \"EsoUI/Art/CharacterWindow/allianceBadge_daggerfall.dds\",\n}\n\n-- Game only: the class's own icon.\nlocal classIcons = {}\nlocal function ClassIcon(e)\n    local classId = e.c.classId\n    if not classId or not CT.live then return nil end\n    if classIcons[classId] == nil then\n        local index = GetClassIndexById(classId)\n        classIcons[classId] = index and select(7, GetClassInfo(index)) or false\n    end\n    return classIcons[classId] or nil\nend\n\nCT.Track({\n    id = \"basics\",\n    read = function(c)\n        local gender = GetUnitGender(\"player\")\n        c.id = GetCurrentCharacterId()\n        c.name = U.Plain(GetUnitName(\"player\"))\n        c.classId, c.class = GetUnitClassId(\"player\"), U.Plain(GetUnitClass(\"player\"))\n        c.raceId, c.race = GetUnitRaceId(\"player\"), U.Plain(GetUnitRace(\"player\"))\n        c.allianceId = GetUnitAlliance(\"player\")\n        c.alliance = U.Plain(GetAllianceName(c.allianceId))\n        c.level = GetUnitLevel(\"player\")\n        c.gender = gender\n        c.playedHours = zo_round(GetSecondsPlayed() / 3600)\n        c.achievementPoints = GetEarnedAchievementPoints()\n    end,\n    events = { EVENT_ACHIEVEMENT_AWARDED },\n    start = function(queue)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"Level\", EVENT_LEVEL_UPDATE, queue)\n        EVENT_MANAGER:AddFilterForEvent(CT.name .. \"Level\", EVENT_LEVEL_UPDATE, REGISTER_FILTER_UNIT_TAG, \"player\")\n    end,\n    columns = {\n        { key = \"name\", title = \"Character\", width = 184, align = \"left\", value = function(e) return e.name end,\n          head = \"Your characters. Click one for everything saved about it. Right-click for the menu.\",\n          tip = function(e)\n              local c = e.c\n              local text = string.format(\"%s\\nLevel %s %s %s\\nRead from the game %s (%s)\", e.name, c.level or \"?\", c.race or \"\", c.class or \"\",\n                                         U.Ago(c.lastScan), U.FormatDate(c.lastScan))\n              if e.m.note then text = text .. \"\\n\\nNote: \" .. e.m.note end\n              return text .. \"\\n\\nClick for details. Right-click for the menu.\"\n          end },\n        { key = \"class\", title = \"Class\", width = 120, align = \"left\", value = function(e) return e.c.class or \"\" end, icon = ClassIcon,\n          head = \"The character's class.\" },\n        { key = \"race\", title = \"Race\", width = 96, align = \"left\", value = function(e) return e.c.race or \"\" end, head = \"The character's race.\" },\n        { key = \"alliance\", title = \"Alliance\", width = 120, align = \"left\", value = function(e) return e.c.alliance or \"\" end,\n          -- The badge says the rest: \"Daggerfall Covenant\" is shown as \"Daggerfall\".\n          display = function(v) return (v:gsub(\" Covenant$\", \"\"):gsub(\" Pact$\", \"\"):gsub(\" Dominion$\", \"\")) end,\n          icon = function(e) return ALLIANCE_ICONS[e.c.allianceId] end, head = \"The character's alliance.\",\n          tip = function(e) return e.c.alliance or \"\" end },\n        { key = \"level\", title = \"Level\", width = 60, max = 50, value = function(e) return e.c.level or 0 end,\n          head = \"Character level. 50 is the top; after that it is Champion Points, which the whole account shares.\" },\n        { key = \"achievements\", title = \"Ach. points\", width = 84, value = function(e) return e.c.achievementPoints or 0 end,\n          head = \"Achievement points earned on this character.\",\n          display = function(v) return U.Comma(v) end,\n          tip = function(e) return \"Achievement points: \" .. U.Comma(e.c.achievementPoints) end },\n        { key = \"hours\", title = \"Hours\", width = 76, sum = true, value = function(e) return e.c.playedHours or 0 end,\n          display = function(v) return U.Comma(v) end, tip = \"Hours played (/played)\", head = \"Hours played on this character.\" },\n        { key = \"updated\", title = \"Updated\", width = 96, value = function(e) return U.FormatDate(e.c.lastScan) end,\n          head = \"Updated: the last day this character was read from the game.\",\n          tip = function(e) return \"Read from the game \" .. U.Ago(e.c.lastScan) .. \".\\n/fct unread lists the characters that are out of date.\" end },\n    },\n    summary = function(e)\n        return { { \"Achievement points\", U.Comma(e.c.achievementPoints) }, { \"Hours played\", U.Comma(e.c.playedHours) } }\n    end,\n    export = {\n        { \"Character\", function(e) return e.name end }, { \"Class\", function(e) return e.c.class end },\n        { \"Race\", function(e) return e.c.race end }, { \"Alliance\", function(e) return e.c.alliance end },\n        { \"Level\", function(e) return e.c.level end },\n        { \"Achievement points\", function(e) return e.c.achievementPoints end }, { \"Hours played\", function(e) return e.c.playedHours end },\n        { \"Updated\", function(e) return U.FormatDate(e.c.lastScan) end },\n    },\n})\n"}, {"name": "Trackers/Picks.lua", "text": "-- shared\n-- What only you know about a character: role, the gear you have farmed, a planned race, a note.\n-- Nothing is read from the game here; the cells are yours to fill (click a blue one).\nlocal CT = FurysCharacterTracker\nlocal F = CT.Roster.FIELDS\n\nlocal function Pick(key, width, field, tip)\n    return { key = key, title = F[field].title, width = width, value = function(e) return e.m[field] or \"\" end,\n             pick = { field = field, values = F[field].values }, tip = tip,\n             head = F[field].title .. \": your own pick. Click a cell to choose.\\n\" .. tip }\nend\n\nCT.Track({\n    id = \"picks\",\n    columns = {\n        -- The role as plain text, for the tabs where it is not the point.\n        { key = \"role\", title = \"Role\", width = 88, value = function(e) return e.m.role or \"\" end,\n          head = \"Role: your own pick. Change it on the Roles & gear tab.\", tip = function(e) return e.m.role end },\n        Pick(\"rolePick\", 124, \"role\", \"The role(s) you play this character in.\"),\n        Pick(\"dpsGear\", 108, \"dpsGear\", \"The DPS gear you have farmed for this character.\"),\n        Pick(\"roleGear\", 124, \"roleGear\", \"The tank or healer gear you have farmed for this character.\\nFor a DPS/Healer: DPS gear = DPS role, this = healer role.\"),\n        Pick(\"plannedRace\", 100, \"plannedRace\", \"A race change you plan (blank = none).\"),\n        { key = \"note\", title = \"Note\", width = 180, align = \"left\", note = true, value = function(e) return e.m.note or \"\" end,\n          head = \"Note: anything you want to remember about this character. Click a cell to write one.\",\n          tip = function(e) return (e.m.note or \"No note yet.\") .. \"\\n\\nClick to edit.\" end },\n    },\n    sections = function(e)\n        local m = e.m\n        local section = { title = \"Your picks\", items = {\n            { \"Role\", m.role or \"-\" }, { \"DPS gear\", m.dpsGear or \"-\" },\n            { \"Tank/healer gear\", m.roleGear or \"-\" }, { \"Planned race\", m.plannedRace or \"-\" } } }\n        if m.note then section.lines = { \"Note: \" .. m.note } end\n        return { section }\n    end,\n    export = {\n        { \"Role\", function(e) return e.m.role end }, { \"DPS gear\", function(e) return e.m.dpsGear end },\n        { \"Tank/healer gear\", function(e) return e.m.roleGear end }, { \"Planned race\", function(e) return e.m.plannedRace end },\n        { \"Note\", function(e) return e.m.note end },\n    },\n})\n"}, {"name": "Trackers/Skills.lua", "text": "-- shared\n-- Skill lines (weapons, armor, guilds, world, crafting), and skill points spent and waiting.\n-- The lines and their top ranks are listed in Data/Lines.lua. Ranks are saved as\n--   c.lines = { [\"Two Handed\"] = 50, ... }   (0 = not started)\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nlocal function Rank(c, line)\n    return math.min((c.lines or {})[line.name] or 0, line.max)\nend\n\n-- Columns: one per skill line, and one per group that counts its maxed lines.\nlocal columns = {}\nfor _, group in ipairs(CT.GROUPS) do\n    for _, line in ipairs(group.lines) do\n        local what = line.name\n        if line.name == \"Assault\" then what = \"Alliance War: Assault (Support ranks with it)\" end\n        if line.name == \"Excavation\" then what = \"Antiquities: Excavation (Scrying ranks with it)\" end\n        if line.keepPeak then what = line.name .. \"\\nThe game hides this line when you are cured; this shows the best rank ever seen.\" end\n        columns[#columns + 1] = { key = \"line.\" .. line.name, title = line.short, width = 84, max = line.max,\n                                  value = function(e) return (e.c.lines or {})[line.name] or 0 end,\n                                  tip = what, head = string.format(\"%s\\nSkill line rank. The top rank is %d.\", what, line.max) }\n    end\n    local count = #group.lines\n    columns[#columns + 1] = {\n        key = \"group.\" .. group.id, title = group.short or group.title, width = 80, max = count,\n        head = string.format(\"%s: how many of the %d %s skill lines are at their top rank.\\nHover a cell for each line, or open the %s tab.\",\n                             group.title, count, group.title, group.title),\n        value = function(e) return CT.Roster:MaxedInGroup(e.c, group) end,\n        display = function(v) return U.Of(v, count) end,\n        tip = function(e)\n            local lines = {}\n            for _, line in ipairs(group.lines) do\n                lines[#lines + 1] = string.format(\"%s  %d / %d\", line.name, Rank(e.c, line), line.max)\n            end\n            if group.id == \"crafting\" and CT.Roster:MaxedInGroup(e.c, group) >= count\n               and (e.c.research or 0) >= (e.c.researchTotal or CT.RESEARCH_TOTAL) then\n                lines[#lines + 1] = \"Grandmaster Crafter: all 7 lines maxed and every trait researched\"\n            end\n            return table.concat(lines, \"\\n\")\n        end }\nend\ncolumns[#columns + 1] = {\n    key = \"skillPoints\", title = \"Skill pts\", width = 76, max = CT.SKILL_POINTS_MAX, value = function(e) return e.c.skillPoints or 0 end,\n    head = \"Skill points earned: the ones spent plus the ones not assigned yet.\\nThe most a character can earn is \" .. CT.SKILL_POINTS_MAX .. \".\",\n    tip = function(e)\n        return string.format(\"Skill points earned: %d of %d\\nNot assigned yet: %s\", e.c.skillPoints or 0, CT.SKILL_POINTS_MAX, e.c.unspent or \"?\")\n    end }\ncolumns[#columns + 1] = {\n    key = \"unspent\", title = \"Unassigned\", width = 92, value = function(e) return e.c.unspent or 0 end,\n    dim = function(v) return v == 0 end, display = function(v) return v == 0 and \"-\" or U.Whole(v) end,\n    head = \"Unassigned: skill points this character has earned and not spent yet.\",\n    tip = function(e) return (e.c.unspent or 0) == 0 and \"Every skill point is spent.\" or U.Count(e.c.unspent, \"skill point\") .. \" waiting to be spent.\" end }\n\n-- Game only ---------------------------------------------------------------------------------\n\n-- Skill lines on the board: current rank, 0 if not discovered. Vampire and Werewolf vanish from\n-- the skill list when cured, so those keep the best rank ever seen.\nlocal function ReadLines(c)\n    local previous, lines = c.lines or {}, {}\n    for _, skillType in ipairs({ SKILL_TYPE_WEAPON, SKILL_TYPE_ARMOR, SKILL_TYPE_WORLD, SKILL_TYPE_GUILD, SKILL_TYPE_AVA, SKILL_TYPE_TRADESKILL }) do\n        for lineIndex = 1, GetNumSkillLines(skillType) do\n            local lineId = GetSkillLineId(skillType, lineIndex)\n            -- By ID on every game language; by its English name for a line this version has no ID for.\n            local name = CT.SKILL_LINE_IDS[lineId] or U.Plain(GetSkillLineNameById(lineId))\n            if CT.LINE_BY_NAME[name] then\n                local rank, _, _, isDiscovered = GetSkillLineDynamicInfo(skillType, lineIndex)\n                lines[name] = isDiscovered and rank or 0\n            end\n        end\n    end\n    for lineName, def in pairs(CT.LINE_BY_NAME) do\n        if def.keepPeak and previous[lineName] then\n            lines[lineName] = math.max(lines[lineName] or 0, previous[lineName])\n        end\n    end\n    c.lines = lines\nend\n\n-- Points spent on every skill plus the ones not spent yet. Asks the game's own skill data (what the\n-- Skills window uses for respec), so morphs, passive ranks, free auto-granted skills and subclass\n-- lines are all counted the way the game counts them.\nlocal function ReadSkillPoints(c)\n    local spent = 0\n    -- These loops hand back (index, data), like ipairs.\n    for _, skillTypeData in SKILLS_DATA_MANAGER:SkillTypeIterator() do\n        for _, skillLineData in skillTypeData:SkillLineIterator() do\n            for _, skillData in skillLineData:SkillIterator() do\n                spent = spent + skillData:GetPointAllocator():GetNumPointsAllocated()\n            end\n        end\n    end\n    c.unspent = GetAvailableSkillPoints()\n    -- Nothing spent means the skill data is not ready yet: keep the last good number.\n    if spent > 0 then c.skillPoints = spent + c.unspent end\nend\n\nCT.Track({\n    id = \"skills\",\n    read = function(c)\n        ReadLines(c)\n        ReadSkillPoints(c)\n    end,\n    events = { EVENT_SKILL_RANK_UPDATE, EVENT_SKILL_LINE_ADDED, EVENT_SKILL_POINTS_CHANGED },\n    columns = columns,\n    summary = function(e)\n        local P = CT.Trackers.Progress\n        local items = { P(\"Skill points\", e.c.skillPoints, CT.SKILL_POINTS_MAX), { \"Not assigned\", tostring(e.c.unspent or \"-\") } }\n        for _, group in ipairs(CT.GROUPS) do\n            if group.id == \"crafting\" then items[#items + 1] = P(\"Crafting lines at 50\", CT.Roster:MaxedInGroup(e.c, group), #group.lines) end\n        end\n        return items\n    end,\n    sections = function(e)\n        local sections = {}\n        for _, group in ipairs(CT.GROUPS) do\n            local items = {}\n            for _, line in ipairs(group.lines) do\n                items[#items + 1] = CT.Trackers.Progress(line.name, Rank(e.c, line), line.max)\n            end\n            sections[#sections + 1] = { title = string.format(\"%s (%d of %d maxed)\", group.title, CT.Roster:MaxedInGroup(e.c, group), #group.lines),\n                                        items = items }\n        end\n        return sections\n    end,\n    export = (function()\n        local list = { { \"Skill points\", function(e) return e.c.skillPoints end }, { \"Unassigned\", function(e) retur
