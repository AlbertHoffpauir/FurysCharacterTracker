  // Tabs with timers keep counting while the page is open.
  clearInterval(liveTimer);
  if (snap.live) liveTimer = setInterval(() => { if ($("shade").style.display !== "flex") draw(); }, 60000);
}

function rowMenu(event, row) {
  const menu = $("menu");
  menu.textContent = "";
  const add = (label, fn) => { const item = el("div", "", label); item.onclick = () => { menu.style.display = "none"; fn(); }; menu.append(item); };
  add("Details for " + row.name, () => showDetails(row.id));
  add("Copy " + row.name + " for Discord", () => showCopy(api("discordCharacter", row.id)));
  menu.style.display = "block";
  menu.style.left = Math.min(event.clientX, innerWidth - menu.offsetWidth - 8) + "px";
  menu.style.top = Math.min(event.clientY, innerHeight - menu.offsetHeight - 8) + "px";
}
document.addEventListener("click", () => { $("menu").style.display = "none"; });

// ---- Hover text ---------------------------------------------------------------------------------

function tip(node, text) { node.fctTip = text || ""; }
function hideTip() { $("tip").style.display = "none"; }
document.addEventListener("mousemove", (event) => {
  let node = event.target, text = "";
  while (node && node !== document) { if (node.fctTip) { text = node.fctTip; break; } node = node.parentNode; }
  const box = $("tip");
  if (!text) { box.style.display = "none"; return; }
  if (box.fctText !== text) { box.innerHTML = rich(text); box.fctText = text; }
  box.style.display = "block";
  box.style.left = Math.min(event.clientX + 18, innerWidth - box.offsetWidth - 8) + "px";
  box.style.top = Math.min(event.clientY + 18, innerHeight - box.offsetHeight - 8) + "px";
});

// ---- Windows over the board -------------------------------------------------------------------

function openWindow(title, subtitle, width) {
  const shade = $("shade");
  shade.textContent = "";
  const win = el("div", "win"), bar = el("div", "bar"), close = el("div", "close", "×"), body = el("div", "body");
  if (width) win.style.width = width + "px";
  bar.append(el("h2", "", title));
  if (subtitle) bar.append(el("div", "", subtitle));
  close.onclick = closeWindow;
  tip(close, "Close (Esc)");
  win.append(bar, close, body);
  shade.append(win);
  shade.style.display = "flex";
  hideTip();
  return body;
}
function closeWindow() { $("shade").style.display = "none"; $("shade").textContent = ""; }
$("shade").addEventListener("mousedown", (event) => { if (event.target === $("shade")) closeWindow(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") { closeWindow(); $("menu").style.display = "none"; } });

// A details page or the Start here page: blocks of "key  value" items and lines of text.
function showPage(page) {
  if (!page) return;
  const body = openWindow(page.title, page.subtitle, 1004);
  for (const section of page.sections) {
    body.append(el("div", "sec", section.title));
    if (section.items.length) {
      const grid = el("div", "grid");
      for (const item of section.items) {
        const row = el("div", "item");
        row.append(el("span", "k", item.key), el("span", "v" + (item.done ? " done" : item.dim ? " dim" : ""), item.value));
        grid.append(row);
      }
      body.append(grid);
    }
    for (const line of section.lines) body.append(el("div", "line" + (line.bold ? " bold" : "") + (line.gold ? " gold" : ""), line.text));
  }
}
function showDetails(id) { showPage(api("details", id)); }

function listWindow(title, subtitle, summary, heads, rows, width) {
  const body = openWindow(title, subtitle, width);
  body.append(el("div", "note", summary));
  const table = el("table", "list"), head = el("tr");
  for (const text of heads) head.append(el("th", "left", text));
  if (rows.length) table.append(head);
  for (const row of rows) table.append(row);
  body.append(table);
  return body;
}

function showTimers() {
  const data = api("timers");
  const rows = data.rows.map((row) => {
    const tr = el("tr"), amber = row.waiting ? "amber" : "";
    tr.append(el("td", "", row.name), el("td", "", row.craft), el("td", amber, row.item), el("td", amber, row.trait), el("td", amber, row.left),
              el("td", row.waiting ? "amber" : "dim", row.ends));
    return tr;
  });
  listWindow("Research timers", data.label, data.summary, ["Character", "Craft", "Item", "Trait", "Time left", "Finishes"], rows);
}

function showBrag() {
  const card = api("brag");
  const body = openWindow(card.title, card.subtitle, 960);
  const tiles = el("div", "tiles");
  for (const t of card.tiles) {
    const tile = el("div", "tile" + (t.pct != null ? " pct" : ""));
    tile.append(el("div", "v", t.value), el("div", "l", t.label), el("div", "n", t.note || ""));
    if (t.pct != null) {
      const track = el("div", "track"), fill = el("div", "fill");
      fill.style.width = Math.round(t.pct * 100) + "%";
      track.append(fill);
      tile.append(el("div", "p", t.pctText), track);
    }
    tiles.append(tile);
  }
  const classes = el("div", "classes");
  for (const c of card.classes) {
    const box = el("div");
    box.append(el("b", "", c.name));
    for (const role of c.roles) box.append(el("span", role.on ? "on" : "off", role.key + "  "));
    classes.append(box);
  }
  const foot = el("div", "bragfoot");
  foot.append(el("span", "", card.date), el("span", "", card.credit));
  body.append(tiles, el("div", "cover", card.coverageTitle), classes, foot);
}

function showCopy(data) {
  if (!data) return;
  const body = openWindow("Copy for Discord", "", 824);
  const note = el("div", "note", data.note.replace("Press Ctrl+C to copy, then paste into Discord.", "Click Copy, then paste into Discord."));
  const box = el("textarea");
  box.value = data.text; box.readOnly = true;
  const actions = el("div", "actions"), copy = el("button", "", "Copy");
  copy.onclick = () => {
    box.select();
    const done = () => toast("Copied. Paste it into Discord with Ctrl+V.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data.text).then(done, () => { document.execCommand("copy"); done(); });
    else { document.execCommand("copy"); done(); }
  };
  tip(copy, "Copies all of the text.");
  actions.append(copy);
  body.append(note, box, actions);
  box.select();
}

// The same columns the game's own Export to Excel writes, as a CSV file in the Downloads folder.
function saveForExcel() {
  const data = api("export");
  if (data.rows.length < 2) return toast("No characters to save yet.");
  const csv = data.rows.map((row) => row.map((cell) => '"' + String(cell).replace(/"/g, '""') + '"').join(",")).join("\r\n") + "\r\n";
  const link = el("a");
  link.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));   // the mark at the start tells Excel the text is UTF-8
  link.download = "ESO Characters " + data.label.replace(/\s*·\s*/g, " ").replace(/[^\w@ -]/g, "") + ".csv";
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  toast("Saved " + link.download + " to your Downloads folder (" + (data.rows.length - 1) + " characters).");
}

let toastTimer;
function toast(text) {
  const box = $("toast");
  box.textContent = text; box.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.display = "none"; }, 5000);
}

try { start(); }
catch (error) {
  problem("The viewer could not read the saved data", "Download the Windows Tools again so they match your addon version, then run Open Offline Viewer.cmd. If it still happens, report it on the addon's page with this line:<br><br><code>" + esc(error && error.message || error) + "</code>");
}
</script>
