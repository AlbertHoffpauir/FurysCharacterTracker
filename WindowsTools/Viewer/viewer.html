n e.c.unspent end } }\n        for _, group in ipairs(CT.GROUPS) do\n            for _, line in ipairs(group.lines) do\n                list[#list + 1] = { line.name, function(e) return Rank(e.c, line) end }\n            end\n        end\n        return list\n    end)(),\n})\n"}, {"name": "Trackers/ClassLines.lua", "text": "-- shared\n-- Class skill lines. A character uses three: its own class's, or (with subclassing) up to two\n-- swapped for another class's. Other lines it has trained are kept too. Saved one text per line:\n--   c.classLines = { \"skill line id|line name|rank|class id|class name|state\", ... }\n-- state: \"a\" one of the three in use, \"t\" being trained, \"\" trained earlier and not in use.\n-- Class mastery is not kept as a line: it is not earned or ranked, it simply comes with using all\n-- three of your own class's lines, so the board only says which build was picked (pure class or\n-- subclassing). 1.5.0 to 1.5.3 saved it with state \"m\"; those rows are skipped.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal MAX = CT.CLASS_LINE_MAX\n\n-- The saved lines of a character, split up: in use (game order) and the rest (highest rank first).\nlocal function Lines(c)\n    local active, other = {}, {}\n    for _, text in ipairs(c.classLines or {}) do\n        local p = U.Split(text, \"|\")\n        local line = { id = tonumber(p[1]), name = p[2], rank = tonumber(p[3]) or 0, classId = tonumber(p[4]), class = p[5], state = p[6] or \"\" }\n        if line.state == \"a\" then\n            active[#active + 1] = line\n        elseif line.state ~= \"m\" then\n            other[#other + 1] = line\n        end\n    end\n    table.sort(other, function(a, b)\n        if a.rank ~= b.rank then return a.rank > b.rank end\n        return a.name < b.name\n    end)\n    return active, other\nend\n\n-- How many of the three lines in use come from another class (0 = a pure class build).\nlocal function Borrowed(c)\n    local n = 0\n    for _, line in ipairs((Lines(c))) do\n        if line.classId ~= c.classId then n = n + 1 end\n    end\n    return n\nend\n\n-- The build that was picked, in words.\nlocal function BuildText(c)\n    local n = Borrowed(c)\n    if n == 0 then return \"Pure \" .. (c.class or \"class\") .. \": all three lines are its own, so it has class mastery.\" end\n    return string.format(\"Subclassing: %s from another class, so no class mastery.\", U.Count(n, \"line\"))\nend\nCT.ClassLines = Lines\n\nlocal STATE = { t = \"in training\" }\nlocal function Describe(line, ownClassId)\n    local text = string.format(\"%s  %d / %d\", line.name, math.min(line.rank, MAX), MAX)\n    if line.classId ~= ownClassId and line.class and line.class ~= \"\" then text = text .. \"  (\" .. line.class .. \")\" end\n    if STATE[line.state] then text = text .. \"  ·  \" .. STATE[line.state] end\n    return text\nend\n\nlocal NOT_READ = \"Not read yet: log in on this character once.\"\n\nlocal function LineColumn(index)\n    return { key = \"classLine\" .. index, title = \"Class line \" .. index, width = 156, max = MAX,\n             head = \"A class skill line this character is using, and its rank (the top rank is \" .. MAX .. \").\\nWith subclassing, up to two of the three can come from another class.\",\n             value = function(e) local line = Lines(e.c)[index]; return line and line.rank or 0 end,\n             display = function(v, e)\n                 local line = Lines(e.c)[index]\n                 if not line then return \"-\" end\n                 return line.name .. \"  \" .. U.Whole(math.min(v, MAX))\n             end,\n             dim = function(_, e) return Lines(e.c)[index] == nil end,\n             tip = function(e)\n                 local line = Lines(e.c)[index]\n                 if not e.c.classLines then return NOT_READ end\n                 return line and Describe(line, e.c.classId) or \"No class line here.\"\n             end }\nend\n\nCT.Track({\n    id = \"classLines\",\n    read = function(c)\n        local gender, list = GetUnitGender(\"player\"), {}\n        local skillType = SKILL_TYPE_CLASS\n        for lineIndex = 1, GetNumSkillLines(skillType) do\n            local rank, _, isActive, isDiscovered, _, isInTraining, isClassMastery = GetSkillLineDynamicInfo(skillType, lineIndex)\n            local classId = GetSkillLineClassId(skillType, lineIndex)\n            local lineId = GetSkillLineId(skillType, lineIndex)\n            local state = (isActive and \"a\") or (isInTraining and \"t\") or \"\"\n            -- A line that is neither in use nor trained is one of the other classes' untouched lines.\n            local keep = not isClassMastery and (isActive or isInTraining or (isDiscovered and rank > 1))\n            if keep then\n                list[#list + 1] = table.concat({ lineId, U.Clean(U.Plain(GetSkillLineNameById(lineId))), rank, classId,\n                                                 U.Clean(U.Plain(GetClassName(gender, classId))), state }, \"|\")\n            end\n        end\n        -- Nothing found means the skill data is not ready yet: keep what was saved.\n        if #list > 0 then c.classLines = list end\n    end,\n    events = { EVENT_SKILL_RANK_UPDATE, EVENT_SKILL_LINE_ADDED, EVENT_SKILLS_FULL_UPDATE },\n    columns = {\n        LineColumn(1), LineColumn(2), LineColumn(3),\n        { key = \"classBuild\", title = \"Build\", width = 82, align = \"left\",\n          head = \"Build: Pure when all three class lines in use are the character's own, Subclass when one or two come from another class.\\nA pure class build has class mastery; subclassing gives it up.\",\n          value = function(e) return e.c.classLines and Borrowed(e.c) or -1 end,\n          display = function(v) return v < 0 and \"-\" or (v == 0 and \"Pure\" or \"Subclass\") end,\n          dim = function(v) return v < 0 end,\n          tip = function(e)\n              if not e.c.classLines then return NOT_READ end\n              return BuildText(e.c)\n          end },\n        { key = \"classMaxed\", title = \"Maxed\", width = 62, max = 3,\n          head = \"Maxed: how many of the three class lines in use are at rank \" .. MAX .. \".\",\n          value = function(e)\n              local n = 0\n              for _, line in ipairs(Lines(e.c)) do if line.rank >= MAX then n = n + 1 end end\n              return n\n          end,\n          display = function(v, e) return e.c.classLines and U.Of(v, 3) or \"-\" end,\n          dim = function(_, e) return not e.c.classLines end,\n          tip = function(e)\n              if not e.c.classLines then return NOT_READ end\n              local lines = {}\n              for _, line in ipairs(Lines(e.c)) do lines[#lines + 1] = Describe(line, e.c.classId) end\n              return table.concat(lines, \"\\n\")\n          end },\n        { key = \"classOther\", title = \"Other class lines\", width = 110, align = \"left\",\n          head = \"Other class lines this character has: lines in training, and lines trained earlier that are not in use now.\\nHover a cell for the whole list.\",\n          value = function(e) local _, other = Lines(e.c); return #other end,\n          display = function(v, e)\n              if v == 0 then return \"-\" end\n              local _, other = Lines(e.c)\n              local names = {}\n              for i, line in ipairs(other) do\n                  names[i] = line.name .. \" \" .. U.Whole(math.min(line.rank, MAX))\n              end\n              return table.concat(names, \"  ·  \")\n          end,\n          dim = function(v) return v == 0 end,\n          tip = function(e)\n              if not e.c.classLines then return NOT_READ end\n              local _, other = Lines(e.c)\n              if #other == 0 then return \"No other class lines trained.\" end\n              local lines = {}\n              for _, line in ipairs(other) do lines[#lines + 1] = Describe(line, e.c.classId) end\n              return table.concat(lines, \"\\n\")\n          end },\n    },\n    sections = function(e)\n        if not e.c.classLines then return nil end\n        local active, other = Lines(e.c)\n        local items = {}\n        for _, line in ipairs(active) do items[#items + 1] = CT.Trackers.Progress(line.name, math.min(line.rank, MAX), MAX) end\n        for _, line in ipairs(other) do\n            items[#items + 1] = CT.Trackers.Progress(string.format(\"%s (%s)\", line.name, STATE[line.state] or \"not in use\"), math.min(line.rank, MAX), MAX)\n        end\n        return { { title = \"Class lines\", items = items, lines = { BuildText(e.c) } } }\n    end,\n    export = {\n        { \"Class line 1\", function(e) local l = Lines(e.c)[1]; return l and (l.name .. \" \" .. U.Whole(l.rank)) end },\n        { \"Class line 2\", function(e) local l = Lines(e.c)[2]; return l and (l.name .. \" \" .. U.Whole(l.rank)) end },\n        { \"Class line 3\", function(e) local l = Lines(e.c)[3]; return l and (l.name .. \" \" .. U.Whole(l.rank)) end },\n        { \"Build\", function(e) return e.c.classLines and (Borrowed(e.c) == 0 and \"Pure\" or \"Subclass\") end },\n    },\n})\n"}, {"name": "Trackers/SkillPoints.lua", "text": "-- shared\n-- Where the skill points still to earn are: skyshards (three make a point), public dungeons\n-- (each one's group event gives a point) and Alliance War rank (a point per rank).\n--   c.shards, c.shardsTotal          skyshards collected, and how many exist\n--   c.shardsMissing                  \"Glenumbra 13/16;Stormhaven 15/16\": zones with some left\n--   c.pubDungeons, c.pubDungeonsTotal, c.pubDungeonsMissing (\"Group event;Group event\")\n--   c.avaRank                        Alliance War rank, 0 to 50\n-- A public dungeon counts once its group event achievement is earned: that achievement is what\n-- gives the skill point. The zone guide is no use here, it goes by the dungeon's quests.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nlocal NOT_READ = \"Not read yet: log in on this character once.\"\nlocal LIST_MAX = 24   -- zones named in one hover text\n\n-- The group event achievement of every public dungeon, in the order the zones came out.\nlocal GROUP_EVENTS = { 468, 470, 445, 460, 469, 380, 714, 713, 707, 708, 379, 388, 372, 381, 371, 874,\n                       1855, 1846, 1238, 1235, 2096, 2095, 2444, 2445, 2714, 2715, 2994, 2995, 3281, 3283,\n                       3658, 3657, 4000, 4002, 4264, 4471 }\n\nlocal function ZoneList(text, title)\n    local zones = U.Split(text or \"\", \";\")\n    if #zones == 0 or zones[1] == \"\" then return nil end\n    local lines = { title }\n    for index, zone in ipairs(zones) do\n        if index > LIST_MAX then\n            lines[#lines + 1] = string.format(\"  and %d more\", #zones - LIST_MAX)\n            break\n        end\n        lines[#lines + 1] = \"  \" .. zone\n    end\n    return table.concat(lines, \"\\n\")\nend\n\nCT.Track({\n    id = \"skillPoints\",\n    read = function(c)\n        -- Every skyshard in the game, then zone by zone for the list of where the missing ones are.\n        local total, have = GetNumSkyshards(), 0\n        if total > 0 then\n            for index = 1, total do\n                if GetSkyshardDiscoveryStatus(GetSkyshardId(index)) == SKYSHARD_DISCOVERY_STATUS_ACQUIRED then have = have + 1 end\n            end\n            local missing = {}\n            local zoneId = GetNextZoneStoryZoneId()\n            while zoneId do\n                local zoneName = U.Clean(U.Plain(GetZoneNameById(zoneId)))\n                local inZone, got = GetNumSkyshardsInZone(zoneId), 0\n                for index = 1, inZone do\n                    if GetSkyshardDiscoveryStatus(GetZoneSkyshardId(zoneId, index)) == SKYSHARD_DISCOVERY_STATUS_ACQUIRED then got = got + 1 end\n                end\n                if got < inZone then missing[#missing + 1] = string.format(\"%s %d/%d\", zoneName, got, inZone) end\n                zoneId = GetNextZoneStoryZoneId(zoneId)\n            end\n            table.sort(missing)\n            c.shards, c.shardsTotal, c.shardsMissing = have, total, table.concat(missing, \";\")\n        end\n        local done, left = 0, {}\n        for _, achievementId in ipairs(GROUP_EVENTS) do\n            if IsAchievementComplete(achievementId) then\n                done = done + 1\n            else\n                left[#left + 1] = U.Clean(U.Plain((GetAchievementInfo(achievementId))))\n            end\n        end\n        c.pubDungeons, c.pubDungeonsTotal, c.pubDungeonsMissing = done, #GROUP_EVENTS, table.concat(left, \";\")\n        c.avaRank = GetUnitAvARank(\"player\")\n    end,\n    events = { EVENT_SKYSHARDS_UPDATED, EVENT_ACHIEVEMENT_AWARDED },\n    start = function(queue)\n        EVENT_MANAGER:RegisterForEvent(CT.name .. \"AvaRank\", EVENT_RANK_POINT_UPDATE, queue)\n        EVENT_MANAGER:AddFilterForEvent(CT.name .. \"AvaRank\", EVENT_RANK_POINT_UPDATE, REGISTER_FILTER_UNIT_TAG, \"player\")\n    end,\n    columns = {\n        { key = \"shards\", title = \"Skyshards\", width = 100, max = function(e) return e.c.shardsTotal end,\n          head = \"Skyshards collected, out of every skyshard in the game. Three skyshards make one skill point.\\nHover a cell for the zones that still have some.\",\n          value = function(e) return e.c.shards or 0 end,\n          display = function(v, e) return e.c.shardsTotal and U.Of(v, e.c.shardsTotal) or \"-\" end,\n          dim = function(_, e) return not e.c.shardsTotal end,\n          tip = function(e)\n              local c = e.c\n              if not c.shardsTotal then return NOT_READ end\n              local left = c.shardsTotal - c.shards\n              if left <= 0 then return \"Every skyshard collected.\" end\n              local text = string.format(\"Skyshards: %d of %d\\n%d left, worth %s.\", c.shards, c.shardsTotal, left,\n                                         U.Count(math.floor((c.shards % 3 + left) / 3), \"skill point\"))\n              local zones = ZoneList(c.shardsMissing, \"\\nZones with skyshards left\")\n              return zones and (text .. \"\\n\" .. zones) or text\n          end },\n        { key = \"shardPoints\", title = \"Shard pts left\", width = 108,\n          head = \"Skill points this character can still earn from skyshards.\",\n          value = function(e)\n              local c = e.c\n              if not c.shardsTotal then return -1 end\n              return math.floor((c.shards % 3 + (c.shardsTotal - c.shards)) / 3)\n          end,\n          display = function(v) return v < 0 and \"-\" or (v == 0 and \"Done\" or U.Whole(v)) end,\n          dim = function(v) return v < 0 end, gold = function(v) return v == 0 end,\n          tip = function(e)\n              if not e.c.shardsTotal then return NOT_READ end\n              return \"Skill points still to earn from skyshards. The Skyshards column lists the zones.\" end },\n        { key = \"pubDungeons\", title = \"Public dungeons\", width = 124, max = function(e) return e.c.pubDungeonsTotal end,\n          head = \"Public dungeons where this character has done the group event. Each group event gives one skill point.\\nHover a cell for the ones still to do.\",\n          value = function(e) return e.c.pubDungeons or 0 end,\n          display = function(v, e) return e.c.pubDungeonsTotal and U.Of(v, e.c.pubDungeonsTotal) or \"-\" end,\n          dim = function(_, e) return not e.c.pubDungeonsTotal end,\n          tip = function(e)\n              local c = e.c\n              if not c.pubDungeonsTotal then return NOT_READ end\n              if c.pubDungeons >= c.pubDungeonsTotal then return \"Every public dungeon group event done.\" end\n              local text = string.format(\"Public dungeon group events done: %d of %d\\n%s still to earn here.\", c.pubDungeons, c.pubDungeonsTotal,\n                                         U.Count(c.pubDungeonsTotal - c.pubDungeons, \"skill point\"))\n              local zones = ZoneList(c.pubDungeonsMissing, \"\\nStill to do\")\n              return zones and (text .. \"\\n\" .. zones) or text\n          end },\n        { key = \"avaRank\", title = \"AvA rank\", width = 88, max = CT.AVA_RANK_MAX,\n          head = \"Alliance War rank, out of \" .. CT.AVA_RANK_MAX .. \". Every rank gives one skill point.\",\n          value = function(e) return e.c.avaRank or 0 end,\n          dim = function(_, e) return not e.c.avaRank end,\n          tip = function(e)\n              if not e.c.avaRank then return NOT_READ end\n              return string.format(\"Alliance War rank %d of %d\\n%s still to earn here.\", e.c.avaRank, CT.AVA_RANK_MAX,\n                                   U.Count(CT.AVA_RANK_MAX - e.c.avaRank, \"skill point\"))\n          end },\n    },\n    sections = function(e)\n        local c = e.c\n        if not c.shardsTotal then return nil end\n        local P = CT.Trackers.Progress\n        local section = { title = \"Skill points still to earn\", items = {\n            P(\"Skyshards\", c.shards, c.shardsTotal), P(\"Public dungeons\", c.pubDungeons or 0, c.pubDungeonsTotal or #GROUP_EVENTS),\n            P(\"Alliance War rank\", c.avaRank, CT.AVA_RANK_MAX) }, lines = {} }\n        if c.shardsMissing and c.shardsMissing ~= \"\" then\n            section.lines[#section.lines + 1] = \"Skyshards left in: \" .. (c.shardsMissing:gsub(\";\", \", \"))\n        end\n        if c.pubDungeonsMissing and c.pubDungeonsMissing ~= \"\" then\n            section.lines[#section.lines + 1] = \"Group events left: \" .. (c.pubDungeonsMissing:gsub(\";\", \", \"))\n        end\n        return { section }\n    end,\n    export = {\n        { \"Skyshards\", function(e) return e.c.shards end }, { \"Skyshards total\", function(e) return e.c.shardsTotal end },\n        { \"Public dungeons\", function(e) return e.c.pubDungeons end }, { \"Alliance War rank\", function(e) return e.c.avaRank end },\n    },\n})\n"}, {"name": "Trackers/Research.lua", "text": "-- shared\n-- Research: traits known and missing per craft, research slots, and timers. Saved per character:\n--   c.research, c.researchTotal      traits known, and how many exist\n--   c.researchCrafts = { { craft =, known =, total =, slots =, need =, timers = { { item =, trait =, endsAt = } } }, ... }\n-- `need` is one short text per craft: a group of digits per item in the game's order, one digit per\n-- trait, 1 = known, 0 = missing (\"111111110 000000000 ...\"). The item and trait names are the same\n-- for every character, so they are saved once per account (data.researchNames).\n-- Timers are saved as the moment they finish, so they count down on whichever character you play.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal Research = {}\nCT.Research = Research\n\nResearch.CRAFTS = {\n    { craft = CRAFTING_TYPE_BLACKSMITHING, short = \"Smith\" },\n    { craft = CRAFTING_TYPE_CLOTHIER, short = \"Cloth\" },\n    { craft = CRAFTING_TYPE_WOODWORKING, short = \"Wood\" },\n    { craft = CRAFTING_TYPE_JEWELRYCRAFTING, short = \"Jewelry\" },\n}\n\nlocal MAX_TRAITS_LISTED = 4   -- an item missing more than this shows a count instead of names\n\nResearch.CraftName = U.CraftName\n\nfunction Research.Entry(c, craft)\n    for _, entry in ipairs(c.researchCrafts or {}) do\n        if entry.craft == craft then return entry end\n    end\nend\n\nlocal function Complete(entry) return entry.known >= entry.total end\n-- Characters read before 1.1.0 have only the total: they count as done when every trait is known.\nlocal function AllKnown(c) return (c.research or 0) >= (c.researchTotal or CT.RESEARCH_TOTAL) end\n\n-- Item and trait names of one craft, in the game's order: { { item =, traits = { ... } }, ... }.\n-- In game they are asked from the game once per session; otherwise they come from the saved file\n-- (\"Axe:Powered,Charged,Precise,...\", one text per item).\nlocal names = {}\nfunction Research.Names(craft)\n    if names[craft] then return names[craft] end\n    local lines = {}\n    if CT.live then\n        for lineIndex = 1, GetNumSmithingResearchLines(craft) do\n            local itemName, _, numTraits = GetSmithingResearchLineInfo(craft, lineIndex)\n            local traits = {}\n            for traitIndex = 1, numTraits do\n                traits[traitIndex] = U.Plain(GetString(\"SI_ITEMTRAITTYPE\", (GetSmithingResearchLineTraitInfo(craft, lineIndex, traitIndex))))\n            end\n            lines[lineIndex] = { item = U.Plain(itemName), traits = traits }\n        end\n        names[craft] = lines\n    else\n        local saved = (CT.Data().researchNames or {})[craft] or {}\n        for lineIndex, text in ipairs(saved) do\n            local at = string.find(text, \":\", 1, true)\n            lines[lineIndex] = { item = at and string.sub(text, 1, at - 1) or text, traits = U.Split(at and string.sub(text, at + 1) or \"\", \",\") }\n        end\n    end\n    return lines\nend\n\n-- Game only: the same names into the saved file. Written only when they differ from what is saved.\nfunction Research.SaveNames()\n    local saved = CT.sv.researchNames or {}\n    CT.sv.researchNames = saved\n    for _, def in ipairs(Research.CRAFTS) do\n        local list = saved[def.craft] or {}\n        saved[def.craft] = list\n        local lines = Research.Names(def.craft)\n        for lineIndex, line in ipairs(lines) do\n            local text = line.item .. \":\" .. table.concat(line.traits, \",\")\n            if list[lineIndex] ~= text then list[lineIndex] = text end\n        end\n        for lineIndex = #lines + 1, #list do list[lineIndex] = nil end\n    end\nend\n\n-- The traits one craft entry is still missing: { { item =, traits = { names }, of = }, ... }.\n-- Reads the short form (`need`) and the list form saved before 1.5.0.\nfunction Research.Missing(entry)\n    if not entry.need then return entry.missing or {} end\n    local lines, list, lineIndex = Research.Names(entry.craft), {}, 0\n    for digits in entry.need:gmatch(\"%S+\") do\n        lineIndex = lineIndex + 1\n        local line, traits = lines[lineIndex], {}\n        for traitIndex = 1, #digits do\n            if digits:sub(traitIndex, traitIndex) == \"0\" then\n                traits[#traits + 1] = line and line.traits[traitIndex] or (\"trait \" .. traitIndex)\n            end\n        end\n        if #traits > 0 then\n            list[#list + 1] = { item = line and line.item or (\"item \" .. lineIndex), traits = traits, of = #digits }\n        end\n    end\n    return list\nend\n\n-- Busy slots, usable slots, seconds until the next one finishes (nil if none), and how many have\n-- finished since the character was last read. Crafts with every trait known have no slots to fill.\nfunction Research.Summary(c, now)\n    now = now or GetTimeStamp()\n    local busy, slots, nextIn, finished = 0, 0, nil, 0\n    for _, entry in ipairs(c.researchCrafts or {}) do\n        if not Complete(entry) then\n            slots = slots + entry.slots\n            for _, timer in ipairs(entry.timers) do\n                if timer.endsAt > now then\n                    busy = busy + 1\n                    if not nextIn or timer.endsAt - now < nextIn then nextIn = timer.endsAt - now end\n                else\n                    finished = finished + 1\n                end\n            end\n        end\n    end\n    return busy, slots, nextIn, finished\nend\n\n-- Free slots per craft: { { def =, count = }, ... }, and how many research has finished.\nfunction Research.Idle(c, now)\n    local idle, finished = {}, 0\n    for _, def in ipairs(Research.CRAFTS) do\n        local entry = Research.Entry(c, def.craft)\n        if entry and not Complete(entry) then\n            local working = 0\n            for _, timer in ipairs(entry.timers) do\n                if timer.endsAt > now then working = working + 1 else finished = finished + 1 end\n            end\n            if working < entry.slots then idle[#idle + 1] = { def = def, count = entry.slots - working } end\n        end\n    end\n    return idle, finished\nend\n\n-- Hover text for one craft on one character.\nfunction Research.CraftTip(c, craft)\n    local entry = Research.Entry(c, craft)\n    if not entry then return Research.CraftName(craft) .. \"\\nNot read yet: log in on this character.\" end\n    local now = GetTimeStamp()\n    local lines = { string.format(\"%s: %d of %d traits\", Research.CraftName(craft), entry.known, entry.total) }\n    if Complete(entry) then\n        lines[#lines + 1] = \"Every trait researched.\"\n        return table.concat(lines, \"\\n\")\n    end\n    local busy = 0\n    for _, timer in ipairs(entry.timers) do\n        if timer.endsAt > now then busy = busy + 1 end\n    end\n    lines[#lines + 1] = string.format(\"\\nResearching %d of %d slots\", busy, entry.slots)\n    for _, timer in ipairs(entry.timers) do\n        local left = timer.endsAt > now and (U.Duration(timer.endsAt - now) .. \" left\") or \"done (log in to update)\"\n        lines[#lines + 1] = string.format(\"  %s: %s  %s\", timer.item, timer.trait, left)\n    end\n    lines[#lines + 1] = \"\\nMissing\"\n    for _, item in ipairs(Research.Missing(entry)) do\n        local traits = #item.traits > MAX_TRAITS_LISTED\n            and string.format(\"%d of %d traits\", #item.traits, item.of) or table.concat(item.traits, \", \")\n        lines[#lines + 1] = string.format(\"  %s: %s\", item.item, traits)\n    end\n    return table.concat(lines, \"\\n\")\nend\n\n-- Every research slot on an account, one row each: finished and idle first (they need you),\n-- then running research, soonest first. Characters with every trait known have no rows.\nfunction Research.Rows(data, now)\n    local needs, running = {}, {}\n    for _, entry in ipairs(CT.Roster:List(nil, nil, data)) do\n        for _, def in ipairs(Research.CRAFTS) do\n            local e = Research.Entry(entry.c, def.craft)\n            if e and not Complete(e) then\n                local craftName, working, done = Research.CraftName(def.craft), 0, 0\n                for _, timer in ipairs(e.timers) do\n                    local row = { name = entry.name, craftName = craftName, item = timer.item, trait = timer.trait, endsAt = timer.endsAt }\n                    if timer.endsAt > now then\n                        row.kind, working = \"timer\", working + 1\n                        running[#running + 1] = row\n                    else\n                        row.kind, done = \"done\", done + 1\n                        needs[#needs + 1] = row\n                    end\n                end\n                local idle = e.slots - working - done\n                if idle > 0 then needs[#needs + 1] = { kind = \"idle\", name = entry.name, craftName = craftName, count = idle } end\n            end\n        end\n    end\n    table.sort(running, function(a, b) return a.endsAt < b.endsAt end)\n    for _, row in ipairs(running) do needs[#needs + 1] = row end\n    return needs\nend\n\n-- Game only. /fct research: every character still researching, with idle slots and the next to finish.\nfunction Research:Print()\n    local now, any = GetTimeStamp(), false\n    for _, entry in ipairs(CT.Roster:List()) do\n        local c = entry.c\n        if c.researchCrafts and not AllKnown(c) then\n            any = true\n            local busy, slots, nextIn = Research.Summary(c, now)\n            local idle = {}\n            for _, item in ipairs((Research.Idle(c, now))) do idle[#idle + 1] = string.format(\"%s %d\", item.def.short, item.count) end\n            U.Print(\"%s: %d/%d slots busy%s%s\", entry.name, busy, slots,\n                    nextIn and (\", next done in \" .. U.Duration(nextIn)) or \"\",\n                    #idle > 0 and (\". Idle: \" .. table.concat(idle, \", \")) or \"\")\n        end\n    end\n    if not any then U.Print(\"Every character has every trait researched.\") end\nend\n\n-- Columns --------------------------------------------------------------------------------------\n\nlocal columns = {\n    { key = \"research\", title = \"Research\", width = 84, max = function(e) return e.c.researchTotal or CT.RESEARCH_TOTAL end,\n      value = function(e) return e.c.research or 0 end, tip = \"Traits researched (smithing, clothing, woodworking, jewelry)\",\n      head = \"Research: traits researched, out of \" .. CT.RESEARCH_TOTAL .. \".\\n9 traits on each of 36 items, in smithing, clothing, woodworking and jewelry.\" },\n}\nfor _, def in ipairs(Research.CRAFTS) do\n    columns[#columns + 1] = {\n        key = \"research.\" .. def.short, title = def.short, width = 96,\n        head = function() return Research.CraftName(def.craft) .. \": traits researched in this craft.\\nHover a cell for what is researching now and every trait still missing.\" end,\n        max = function(e) local entry = Research.Entry(e.c, def.craft); return entry and entry.total or 1 end,\n        value = function(e)\n            local entry = Research.Entry(e.c, def.craft)\n            if entry then return entry.known end\n            return AllKnown(e.c) and 1 or 0\n        end,\n        display = function(v, e)\n            local entry = Research.Entry(e.c, def.craft)\n            if entry then return U.Of(v, entry.total) end\n            return AllKnown(e.c) and \"all\" or \"-\"\n        end,\n        tip = function(e)\n            if not Research.Entry(e.c, def.craft) and AllKnown(e.c) then\n                return Research.CraftName(def.craft) .. \"\\nEvery trait researched.\"\n            end\n            return Research.CraftTip(e.c, def.craft)\n        end }\nend\ncolumns[#columns + 1] = {\n    key = \"researchSlots\", title = \"Slots\", width = 84,\n    head = \"Slots: research slots in use, out of the slots this character has.\",\n    max = function(e) local _, slots = Research.Summary(e.c); return slots > 0 and slots or nil end,\n    value = function(e) return (Research.Summary(e.c)) end,\n    display = function(v, e) local _, slots = Research.Summary(e.c); return slots > 0 and U.Of(v, slots) or \"-\" end,\n    dim = function(_, e) local _, slots = Research.Summary(e.c); return slots == 0 end,\n    tip = \"Research slots busy right now, across the crafts that still have traits to learn.\\nViolet = every slot working. Counts down live, even for characters you are not on.\" }\ncolumns[#columns + 1] = {\n    key = \"researchFree\", title = \"Free slots\", width = 84, bar = false,\n    head = \"Free slots: research slots with nothing in them, or with research that has finished.\\nAmber = a slot is waiting for you. A dash = every slot is working, or nothing is left to research.\",\n    value = function(e)\n        local free = 0\n        for _, item in ipairs((Research.Idle(e.c, GetTimeStamp()))) do free = free + item.count end\n        return free\n    end,\n    display = function(v) return v > 0 and U.Whole(v) or \"-\" end,\n    dim = function(v) return v == 0 end, warn = function(v) return v > 0 end,\n    tip = function(e)\n        local idle = Research.Idle(e.c, GetTimeStamp())\n        if #idle == 0 then return \"No free research slot.\" end\n        local lines = { \"Free research slots\" }\n        for _, item in ipairs(idle) do lines[#lines + 1] = string.format(\"  %s: %d\", Research.CraftName(item.def.craft), item.count) end\n        return table.concat(lines, \"\\n\")\n    end }\ncolumns[#columns + 1] = {\n    key = \"researchNext\", title = \"Next done\", width = 104, bar = false,\n    head = \"Next done: time until this character's next research finishes.\",\n    value = function(e) local _, _, nextIn = Research.Summary(e.c); return nextIn or math.huge end,\n    display = function(v) return v == math.huge and \"-\" or U.Duration(v) end,\n    dim = function(v) return v == math.huge end,\n    tip = function(e)\n        local _, _, nextIn, finished = Research.Summary(e.c)\n        local text = nextIn and (\"Next research finishes in \" .. U.Duration(nextIn)) or \"Nothing researching\"\n        if finished > 0 then text = text .. string.format(\"\\n%d finished since this character was last read\", finished) end\n        return text\n    end }\n\n-- Game only: reads research for the character you are on.\nlocal function Read(c)\n    local known, total, crafts = 0, 0, {}\n    local now = GetTimeStamp()\n    for _, def in ipairs(Research.CRAFTS) do\n        local craft = def.craft\n        local entry = { craft = craft, known = 0, total = 0, slots = GetMaxSimultaneousSmithingResearch(craft), timers = {} }\n        local need = {}\n        for lineIndex = 1, GetNumSmithingResearchLines(craft) do\n            local itemName, _, numTraits = GetSmithingResearchLineInfo(craft, lineIndex)\n            local digits = {}\n            for traitIndex = 1, numTraits do\n                local traitType, _, isKnown = GetSmithingResearchLineTraitInfo(craft, lineIndex, traitIndex)\n                entry.total = entry.total + 1\n                if isKnown then\n                    entry.known = entry.known + 1\n                    digits[traitIndex] = \"1\"\n                else\n                    digits[traitIndex] = \"0\"\n                    local _, remaining = GetSmithingResearchLineTraitTimes(craft, lineIndex, traitIndex)\n                    if remaining and remaining > 0 then\n                        entry.timers[#entry.timers + 1] = { item = U.Plain(itemName), trait = U.Plain(GetString(\"SI_ITEMTRAITTYPE\", traitType)),\n                                                            endsAt = now + remaining }\n                    end\n                end\n            end\n            need[lineIndex] = table.concat(digits)\n        end\n        entry.need = table.concat(need, \" \")\n        known, total = known + entry.known, total + entry.total\n        crafts[#crafts + 1] = entry\n    end\n    c.research, c.researchTotal, c.researchCrafts = known, total, crafts\n    Research.SaveNames()\nend\n\nCT.Track({\n    id = \"research\",\n    read = Read,\n    events = { EVENT_SMITHING_TRAIT_RESEARCH_COMPLETED, EVENT_SMITHING_TRAIT_RESEARCH_STARTED,\n               EVENT_SMITHING_TRAIT_RESEARCH_CANCELED, EVENT_SMITHING_TRAIT_RESEARCH_TIMES_UPDATED },\n    columns = columns,\n    summary = function(e)\n        return { CT.Trackers.Progress(\"Traits researched\", e.c.research, e.c.researchTotal or CT.RESEARCH_TOTAL) }\n    end,\n    sections = function(e)\n        local c = e.c\n        local section = { title = \"Research\", lines = {} }\n        local now = GetTimeStamp()\n        if not c.researchCrafts then\n            section.lines[1] = AllKnown(c) and \"Every trait researched.\" or \"Research details not read yet: log in on this character once.\"\n        end\n        for _, def in ipairs(Research.CRAFTS) do\n            local entry = Research.Entry(c, def.craft)\n            if entry then\n                section.lines[#section.lines + 1] = { string.format(\"%s: %d of %d traits%s\", Research.CraftName(def.craft), entry.known, entry.total,\n                                                      Complete(entry) and \"  ·  complete\" or string.format(\"  ·  %d research slots\", entry.slots)), bold = true }\n                for _, timer in ipairs(entry.timers) do\n                    local left = timer.endsAt > now and (U.Duration(timer.endsAt - now) .. \" left\") or \"done\"\n                    section.lines[#section.lines + 1] = { string.format(\"    Researching %s: %s  ·  %s\", timer.item, timer.trait, left), gold = true }\n                end\n                for _, item in ipairs(Research.Missing(entry)) do\n                    section.lines[#section.lines + 1] = string.format(\"    %s: %s\", item.item, table.concat(item.traits, \", \"))\n                end\n            end\n        end\n        return { section }\n    end,\n    export = { { \"Research\", function(e) return e.c.research end } },\n})\n"}, {"name": "Trackers/Knowledge.lua", "text": "-- shared\n-- What a character has learned: provisioning recipes, furnishing plans, motif styles, and scribing\n-- (grimoires and scripts). Each is a count out of a total the game reports.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nlocal function Known(what, value, total)\n    return string.format(\"%s: %s%s\", what, U.Comma(value), total and (\" of \" .. U.Comma(total)) or \"\")\nend\n\n-- Game only -------------------------------------------------------------------------------------\n\n-- Provisioning recipes and furnishing plans live in the same recipe lists;\n-- the crafting station each one needs tells them apart.\nlocal function ReadRecipes(c)\n    local recipes, recipesTotal, plans, plansTotal = 0, 0, 0, 0\n    for listIndex = 1, GetNumRecipeLists() do\n        local _, numRecipes = GetRecipeListInfo(listIndex)\n        for recipeIndex = 1, numRecipes do\n            local known, _, _, _, _, _, station = GetRecipeInfo(listIndex, recipeIndex)\n            if station == CRAFTING_TYPE_PROVISIONING then\n                recipesTotal = recipesTotal + 1\n                if known then recipes = recipes + 1 end\n            else\n                plansTotal = plansTotal + 1\n                if known then plans = plans + 1 end\n            end\n        end\n    end\n    c.recipes, c.recipesTotal, c.furnishings, c.furnishingsTotal = recipes, recipesTotal, plans, plansTotal\nend\n\n-- Motif styles known in full. The game's own count: it is known to get one or two styles wrong\n-- (Mercenary, for one), so it can differ slightly from crafting addons that track chapters by hand.\nlocal function ReadMotifs(c)\n    local known, total = 0, 0\n    for index = 1, GetNumValidItemStyles() do\n        local styleId = GetValidItemStyleId(index)\n        if styleId and styleId > 0 then\n            total = total + 1\n            if IsSmithingStyleKnown(styleId) then known = known + 1 end\n        end\n    end\n    c.motifs, c.motifsTotal = known, total\nend\n\n-- Scribing is learned like recipes: a set number of grimoires and scripts per character.\n-- Counted the way Character Knowledge counts it (79 when everything is known): grimoires\n-- plus scripts. Many scripts fit several grimoires, so each script is counted once.\nlocal function ReadScribing(c)\n    local seen = {}\n    local grimoires, grimoiresTotal, scripts, scriptsTotal = 0, 0, 0, 0\n    for index = 1, GetNumCraftedAbilities() do\n        local craftedAbilityId = GetCraftedAbilityIdAtIndex(index)\n        grimoiresTotal = grimoiresTotal + 1\n        if IsCraftedAbilityUnlocked(craftedAbilityId) then grimoires = grimoires + 1 end\n        for slot = 1, 3 do   -- primary (focus), secondary (signature), tertiary (affix)\n            for scriptIndex = 1, GetNumScriptsInSlotForCraftedAbility(craftedAbilityId, slot) do\n                local scriptId = GetScriptIdAtSlotIndexForCraftedAbility(craftedAbilityId, slot, scriptIndex)\n                if scriptId and scriptId ~= 0 and not seen[scriptId] then\n                    seen[scriptId] = true\n                    scriptsTotal = scriptsTotal + 1\n                    if IsCraftedAbilityScriptUnlocked(scriptId) then scripts = scripts + 1 end\n                end\n            end\n        end\n    end\n    c.grimoires, c.grimoiresTotal, c.scriptsOnly, c.scriptsOnlyTotal = grimoires, grimoiresTotal, scripts, scriptsTotal\n    c.scripts, c.scriptsTotal = grimoires + scripts, grimoiresTotal + scriptsTotal\nend\n\n-- Three parts, so learning a recipe does not count the motifs again.\nCT.Track({\n    id = \"recipes\",\n    read = ReadRecipes,\n    events = { EVENT_RECIPE_LEARNED, EVENT_MULTIPLE_RECIPES_LEARNED },\n    columns = {\n        { key = \"recipes\", title = \"Recipes\", width = 84, max = function(e) return e.c.recipesTotal end,\n          head = \"Recipes: provisioning recipes (food and drink) this character knows.\",\n          value = function(e) return e.c.recipes or 0 end,\n          tip = function(e) return Known(\"Provisioning recipes known\", e.c.recipes or 0, e.c.recipesTotal) end },\n        { key = \"plans\", title = \"Furnishing\", width = 92, max = function(e) return e.c.furnishingsTotal end,\n          head = \"Furnishing: furnishing plans this character knows (blueprints, patterns, designs and the rest).\",\n          value = function(e) return e.c.furnishings or 0 end,\n          tip = function(e) return Known(\"Furnishing plans known\", e.c.furnishings or 0, e.c.furnishingsTotal) end },\n    },\n    summary = function(e)\n        local P = CT.Trackers.Progress\n        return { P(\"Recipes\", e.c.recipes, e.c.recipesTotal), P(\"Furnishing plans\", e.c.furnishings, e.c.furnishingsTotal) }\n    end,\n    export = {\n        { \"Recipes\", function(e) return e.c.recipes end }, { \"Recipes total\", function(e) return e.c.recipesTotal end },\n        { \"Furnishing plans\", function(e) return e.c.furnishings end }, { \"Furnishing plans total\", function(e) return e.c.furnishingsTotal end },\n    },\n})\n\nCT.Track({\n    id = \"motifs\",\n    read = ReadMotifs,\n    events = { EVENT_STYLE_LEARNED },\n    columns = {\n        { key = \"motifs\", title = \"Motifs\", width = 72, max = function(e) return e.c.motifsTotal end,\n          head = \"Motifs: crafting styles this character knows in full.\",\n          value = function(e) return e.c.motifs or 0 end,\n          tip = function(e)\n              return Known(\"Motif styles known in full\", e.c.motifs or 0, e.c.motifsTotal) ..\n                     \"\\nThe game's own count; it can be off by one or two from crafting addons.\"\n          end },\n    },\n    summary = function(e) return { CT.Trackers.Progress(\"Motif styles\", e.c.motifs, e.c.motifsTotal) } end,\n    export = { { \"Motif styles\", function(e) return e.c.motifs end }, { \"Motif styles total\", function(e) return e.c.motifsTotal end } },\n})\n\nCT.Track({\n    id = \"scribing\",\n    read = ReadScribing,\n    events = { EVENT_CRAFTED_ABILITY_LOCK_STATE_CHANGED, EVENT_CRAFTED_ABILITY_SCRIPT_LOCK_STATE_CHANGED },\n    columns = {\n        { key = \"scribing\", title = \"Scribing\", width = 80, max = function(e) return e.c.scriptsTotal or CT.SCRIPTS_TOTAL end,\n          head = \"Scribing: grimoires and scripts this character has learned.\",\n          value = function(e) return e.c.scripts or 0 end,\n          tip = function(e)\n              local c = e.c\n              local text = string.format(\"Scribing learned: %d of %d (grimoires + scripts)\", c.scripts or 0, c.scriptsTotal or CT.SCRIPTS_TOTAL)\n              if c.grimoires then\n                  text = text .. string.format(\"\\nGrimoires %d / %d\\nScripts %d / %d\", c.grimoires, c.grimoiresTotal, c.scriptsOnly, c.scriptsOnlyTotal)\n              end\n              return text\n          end },\n    },\n    summary = function(e)\n        local P, c = CT.Trackers.Progress, e.c\n        return { P(\"Scribing\", c.scripts, c.scriptsTotal or CT.SCRIPTS_TOTAL), P(\"Grimoires\", c.grimoires, c.grimoiresTotal),\n                 P(\"Scripts\", c.scriptsOnly, c.scriptsOnlyTotal) }\n    end,\n    export = { { \"Scribing (grimoires + scripts)\", function(e) return e.c.scripts end } },\n})\n"}, {"name": "Trackers/Companions.lua", "text": "-- shared\n-- Companions. The collectible is account-wide, but each character has to finish a companion's\n-- intro quest before it can summon them. So a companion counts for a character when the intro\n-- quest is done on it, or when you have summoned that companion on it (which also covers characters\n-- that skip the quest after you have unlocked a companion on three others).\n--   c.companions, c.companionsTotal   short names this character can summon, and how many exist\n--   data.companionSeen[id][name]      companions summoned on that character\n--   account.companions[name]          \"level;rapport;top rapport;when\": read while that companion is out\n-- A companion's level and rapport are the same on every character, and the game only tells them\n-- for the companion that is out, so they fill in as you play with each one.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nlocal NOT_READ = \"Not read yet: log in on this character once.\"\n\n-- Level and rapport of one companion on the account being viewed, or nil.\nlocal function Level(name, data)\n    local text = (((data or CT.Data()).account or {}).companions or {})[name]\n    if not text then return nil end\n    local p = U.Split(text, \";\")\n    return { level = tonumber(p[1]) or 0, rapport = tonumber(p[2]) or 0, rapportMax = tonumber(p[3]) or 0 }\nend\n\nlocal function WithLevel(name)\n    local info = Level(name)\n    return info and string.format(\"%s (level %d)\", name, info.level) or name\nend\n\n-- Game only ---------------------------------------------------------------------------------\n\n-- \"Sharp-as-Night\" -> \"Sharp\", \"Azandar al-Cybiades\" -> \"Azandar\": short names for the board.\nlocal function ShortName(name)\n    return name:match(\"^[^%s%-]+\") or name\nend\n\nlocal INTRO_QUEST_BY_COMPANION = {}\nfor questId, companion in pairs(CT.INTRO_QUEST_IDS) do INTRO_QUEST_BY_COMPANION[companion] = questId end\n\n-- English quest names: what /fct ids matches, and a second way to spot an intro quest whose ID is\n-- not in Data/Lines.lua.\nlocal INTRO_QUESTS = {\n    [\"competition and contracts\"] = \"Bastian\", [\"shattered and scattered\"] = \"Mirri\",\n    [\"tower full of trouble\"] = \"Ember\", [\"tournament of the heart\"] = \"Isobel\",\n    [\"the double edge\"] = \"Sharp\", [\"the fateweaver key\"] = \"Azandar\",\n    [\"the garland ring\"] = \"Tanlorin\", [\"a moonlit shadow\"] = \"Zerith\", [\"a moonlight shadow\"] = \"Zerith\",\n}\nCT.INTRO_QUEST_NAMES = INTRO_QUESTS\n\n-- The intro quest of a companion, by its collectible: the IDs this version knows, else the game's\n-- own answer for a companion added since.\nlocal function IntroQuestId(collectibleId, name)\n    local known = INTRO_QUEST_BY_COMPANION[name]\n    if known then return known end\n    local companionId = GetCollectibleReferenceId(collectibleId)\n    if companionId and companionId ~= 0 and GetCompanionCollectibleId(companionId) == collectibleId then\n        local questId = GetCompanionIntroQuestId(companionId)\n        if questId and questId ~= 0 then return questId end\n    end\nend\n\n-- Intro quests found by name instead of by ID. Walking every finished quest is slow, so it is done\n-- at most once per login, and only when a companion you own is not accounted for by ID.\nlocal doneByName\nlocal function DoneByName(name)\n    if not doneByName then\n        doneByName = {}\n        local questId = GetNextCompletedQuestId()\n        while questId do\n            if not CT.INTRO_QUEST_IDS[questId] then\n                local companion = INTRO_QUESTS[zo_strlower(U.Plain(GetCompletedQuestInfo(questId)))]\n                if companion then doneByName[companion] = true end\n            end\n            questId = GetNextCompletedQuestId(questId)\n        end\n    end\n    return doneByName[name] == true\nend\n\nlocal function ActiveName()\n    if not HasActiveCompanion() then return nil end\n    local collectibleId = GetCompanionCollectibleId(GetActiveCompanionDefId())\n    if not collectibleId or collectibleId == 0 then return nil end\n    return ShortName(U.Plain(GetCollectibleName(collectibleId)))\nend\n\nlocal function Read(c, account)\n    local unlocked, total = {}, 0\n    local seen = (CT.sv.companionSeen or {})[GetCurrentCharacterId()] or {}\n    local categoryType = COLLECTIBLE_CATEGORY_TYPE_COMPANION\n    for index = 1, GetTotalCollectiblesByCategoryType(categoryType) do\n        local collectibleId = GetCollectibleIdFromType(categoryType, index)\n        local name = ShortName(U.Plain(GetCollectibleName(collectibleId)))\n        total = total + 1\n        if IsCollectibleUnlocked(collectibleId) then\n            local questId = IntroQuestId(collectibleId, name)\n            if seen[name] or (questId and HasCompletedQuest(questId)) or DoneByName(name) then\n                unlocked[#unlocked + 1] = name\n            end\n        end\n    end\n    table.sort(unlocked)\n    c.companions, c.companionsTotal = unlocked, total\n    -- The companion that is out right now: its level and rapport, for every character's board.\n    local active = ActiveName()\n    if active then\n        local level = GetActiveCompanionLevelInfo()\n        account.companions = account.companions or {}\n        account.companions[active] = table.concat({ level, GetActiveCompanionRapport(), GetMaximumRapport(), GetTimeStamp() }, \";\")\n    end\nend\n\nlocal function Start(queue)\n    local function Register(suffix, event, fn) EVENT_MANAGER:RegisterForEvent(CT.name .. \"Companion\" .. suffix, event, fn) end\n    -- Summoning a companion proves this character has it.\n    Register(\"State\", EVENT_ACTIVE_COMPANION_STATE_CHANGED, function()\n        local name = ActiveName()\n        if not name then return end\n        local sv, id = CT.sv, GetCurrentCharacterId()\n        sv.companionSeen = sv.companionSeen or {}\n        sv.companionSeen[id] = sv.companionSeen[id] or {}\n        sv.companionSeen[id][name] = true\n        queue()\n    end)\n    -- A finished quest matters only when it is a companion's intro quest.\n    Register(\"Quest\", EVENT_QUEST_REMOVED, function(_, isCompleted, _, questName, _, _, questId)\n        if not isCompleted then return end\n        local companion = CT.INTRO_QUEST_IDS[questId] or INTRO_QUESTS[zo_strlower(U.Plain(questName))]\n        if not companion then return end\n        if doneByName then doneByName[companion] = true end\n        queue()\n    end)\n    -- Collectibles change for many reasons (a pet summoned, a hat hidden): only companions matter here.\n    Register(\"Collectible\", EVENT_COLLECTIBLE_UPDATED, function(_, collectibleId)\n        if GetCollectibleCategoryType(collectibleId) == COLLECTIBLE_CATEGORY_TYPE_COMPANION then queue() end\n    end)\n    Register(\"Unlocks\", EVENT_COLLECTIBLES_UNLOCK_STATE_CHANGED, queue)\n    Register(\"Rapport\", EVENT_COMPANION_RAPPORT_UPDATE, queue)\n    Register(\"Level\", EVENT_COMPANION_EXPERIENCE_GAIN, function(_, _, level)\n        -- Experience comes in with every fight: only a new level is worth a read.\n        local name = ActiveName()\n        local saved = name and Level(name, CT.sv)\n        if not saved or saved.level ~= level then queue() end\n    end)\nend\n\nCT.Track({\n    id = \"companions\",\n    read = Read,\n    start = Start,\n    columns = {\n        { key = \"companions\", title = \"Companions\", width = 100, max = function(e) return e.c.companionsTotal or CT.COMPANION_TOTAL end,\n          head = \"Companions this character can summon.\\nEach character has to finish a companion's first quest before it can use them.\\nHover a cell for their names and levels.\",\n          value = function(e) return #(e.c.companions or {}) end,\n          display = function(v, e) return U.Of(v, e.c.companionsTotal or CT.COMPANION_TOTAL) end,\n          tip = function(e)\n              local list = e.c.companions or {}\n              if #list == 0 then return \"No companions unlocked\" end\n              local names = {}\n              for i, name in ipairs(list) do names[i] = WithLevel(name) end\n              return \"Unlocked: \" .. table.concat(names, \", \")\n          end },\n    },\n    summary = function(e)\n        return { CT.Trackers.Progress(\"Companions\", #(e.c.companions or {}), e.c.companionsTotal or CT.COMPANION_TOTAL) }\n    end,\n    sections = function(e)\n        local list = e.c.companions or {}\n        if #list == 0 then return nil end\n        local items, lines = {}, {}\n        for _, name in ipairs(list) do\n            local info = Level(name)\n            if info then\n                items[#items + 1] = { name, \"Level \" .. U.Whole(info.level), done = info.level >= CT.COMPANION_LEVEL_MAX }\n                lines[#lines + 1] = string.format(\"%s %s of %s\", name, U.Comma(info.rapport), U.Comma(info.rapportMax))\n            else\n                items[#items + 1] = { name, \"unlocked\", dim = true }\n            end\n        end\n        local section = { title = \"Companions\", items = items, lines = {} }\n        if #lines > 0 then section.lines[1] = \"Rapport: \" .. table.concat(lines, \"  ·  \") end\n        if #lines < #list then section.lines[#section.lines + 1] = \"A companion's level shows here after you have had them out once with this version.\" end\n        return { section }\n    end,\n    export = {\n        { \"Companions\", function(e) return #(e.c.companions or {}) end },\n        { \"Companion names\", function(e) return table.concat(e.c.companions or {}, \", \") end },\n    },\n})\n"}, {"name": "Trackers/Writs.lua", "text": "-- shared\n-- Daily crafting writs per character: started, ready to deliver, done today.\n--   c.writs[craft] = { state =, at = }   craft = the game's craft number; at = when it got that state\n--   c.writCrafts = \"1,2,6\"              the crafts this character is certified for (can take writs for)\n-- The daily reset is 10:00 UTC on NA and 03:00 UTC on EU (since Update 37).\n--\n-- Which craft a writ is for is found without reading its name, so it works on every game language:\n-- the quest's own \"craft this\" steps say which craft they need. The quest's ID is remembered with\n-- its craft (data.writQuestIds), because a writ that is ready to deliver has no such step left.\n-- On an English client the quest's name is a second way to tell.\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\nlocal Daily = {}\nCT.Daily = Daily\n\n-- Order on the board. `match` finds the craft in the writ's English quest name.\nDaily.CRAFTS = {\n    { craft = CRAFTING_TYPE_BLACKSMITHING, short = \"Smith\", match = \"blacksmith\" },\n    { craft = CRAFTING_TYPE_CLOTHIER, short = \"Cloth\", match = \"clothier\" },\n    { craft = CRAFTING_TYPE_WOODWORKING, short = \"Wood\", match = \"woodworker\" },\n    { craft = CRAFTING_TYPE_JEWELRYCRAFTING, short = \"Jewelry\", match = \"jewelry\" },\n    { craft = CRAFTING_TYPE_ALCHEMY, short = \"Alchemy\", match = \"alchemist\" },\n    { craft = CRAFTING_TYPE_ENCHANTING, short = \"Enchant\", match = \"enchanter\" },\n    { craft = CRAFTING_TYPE_PROVISIONING, short = \"Provis\", match = \"provisioner\" },\n}\nlocal IS_WRIT_CRAFT = {}\nfor _, def in ipairs(Daily.CRAFTS) do IS_WRIT_CRAFT[def.craft] = true end\n\nDaily.NONE, Daily.STARTED, Daily.DELIVER, Daily.DONE = 0, 1, 2, 3\nDaily.LABEL = { [0] = \"-\", [1] = \"Started\", [2] = \"Deliver\", [3] = \"Done\" }\n\n-- When today's reset happened on a megaserver.\nfunction Daily.LastReset(world, now)\n    now = now or GetTimeStamp()\n    local hour = string.find(world or \"\", \"EU\", 1, true) and 3 or 10\n    local reset = now - now % 86400 + hour * 3600\n    if reset > now then reset = reset - 86400 end\n    return reset\nend\n\n-- What the board shows for one craft: started and deliver as they are, done only if it was today.\nfunction Daily.State(c, craft, world, now)\n    local entry = (c.writs or {})[craft]\n    if not entry then return Daily.NONE end\n    if entry.state == Daily.DONE then\n        return entry.at >= Daily.LastReset(world, now) and Daily.DONE or Daily.NONE\n    end\n    return entry.state\nend\n\n-- Writs done today, in hand (started or ready to deliver) and ready to deliver, for one character.\nfunction Daily.Count(c, world, now)\n    local done, inHand, deliver = 0, 0, 0\n    for _, def in ipairs(Daily.CRAFTS) do\n        local state = Daily.State(c, def.craft, world, now)\n        if state == Daily.DONE then done = done + 1 elseif state ~= Daily.NONE then inHand = inHand + 1 end\n        if state == Daily.DELIVER then deliver = deliver + 1 end\n    end\n    return done, inHand, deliver\nend\n\n-- The crafts a character is certified for, as a set, or nil if 1.5.2 has not read it yet.\nfunction Daily.Certified(c)\n    if not c.writCrafts then return nil end\n    local set = {}\n    for craft in string.gmatch(c.writCrafts, \"%d+\") do set[tonumber(craft)] = true end\n    return set\nend\n\n-- Game only ---------------------------------------------------------------------------------\n\nlocal function CraftFromName(questName, word)\n    local name = zo_strlower(U.Plain(questName))\n    if not string.find(name, word or \"writ\", 1, true) then return nil end\n    for _, def in ipairs(Daily.CRAFTS) do\n        if string.find(name, def.match, 1, true) then return def.craft end\n    end\nend\n\nlocal function IsDailyWrit(journalIndex)\n    return GetJournalQuestType(journalIndex) == QUEST_TYPE_CRAFTING and GetJournalQuestRepeatType(journalIndex) == QUEST_REPEAT_DAILY\nend\n\n-- The craft named by the quest's own \"craft this\" steps, or nil when it has none (ready to deliver).\nlocal function CraftFromSteps(journalIndex)\n    for condition = 1, GetJournalQuestNumConditions(journalIndex, QUEST_MAIN_STEP_INDEX) do\n        local _, _, craft = GetQuestConditionItemInfo(journalIndex, QUEST_MAIN_STEP_INDEX, condition)\n        if IS_WRIT_CRAFT[craft] then return craft end\n    end\nend\n\nlocal function SaysDeliver(journalIndex)\n    for condition = 1, GetJournalQuestNumConditions(journalIndex, QUEST_MAIN_STEP_INDEX) do\n        local text = GetJournalQuestConditionInfo(journalIndex, QUEST_MAIN_STEP_INDEX, condition)\n        if string.find(zo_strlower(U.Plain(text)), \"deliver\", 1, true) then return true end\n    end\n    return false\nend\n\n-- The craft and state of the daily writ at one journal slot, or nil if it cannot be told yet.\nlocal function ReadWrit(journalIndex)\n    local sv = CT.sv\n    sv.writQuestIds = sv.writQuestIds or {}\n    local questId = GetJournalQuestId(journalIndex)\n    local fromSteps = CraftFromSteps(journalIndex)\n    if fromSteps then sv.writBySteps = true end\n    local craft = fromSteps or sv.writQuestIds[questId] or CraftFromName(GetJournalQuestName(journalIndex))\n    if not craft then return nil end\n    sv.writQuestIds[questId] = craft\n    local state = Daily.STARTED\n    if GetJournalQuestIsComplete(journalIndex) or SaysDeliver(journalIndex) then\n        state = Daily.DELIVER\n    elseif not fromSteps and sv.writBySteps then\n        -- The steps name the craft on this client, and this writ has none left: all that remains is the hand-in.\n        state = Daily.DELIVER\n    end\n    return craft, state\nend\n\n-- Which crafts this character is certified for. The game has no direct answer, so it is read from\n-- the quests the character has finished: a crafting quest that is a known daily writ (by quest\n-- ID, any language) or, on an English client, is named as a craft's certification or writ. Any\n-- writ seen in the journal counts too. Walking every finished quest is slow: once per login.\nlocal certifiedByQuests\nlocal function ReadCertified(c)\n    if not certifiedByQuests then\n        certifiedByQuests = {}\n        local known = CT.sv.writQuestIds or {}\n        local questId = GetNextCompletedQuestId()\n        while questId do\n            local name, questType = GetCompletedQuestInfo(questId)\n            if questType == QUEST_TYPE_CRAFTING then\n                local craft = known[questId] or CraftFromName(name, \"certification\") or CraftFromName(name)\n                if craft then certifiedByQuests[craft] = true end\n            end\n            questId = GetNextCompletedQuestId(questId)\n        end\n    end\n    local have = Daily.Certified(c) or {}\n    local list = {}\n    for _, def in ipairs(Daily.CRAFTS) do\n        if have[def.craft] or certifiedByQuests[def.craft] or (c.writs or {})[def.craft] then list[#list + 1] = def.craft end\n    end\n    c.writCrafts = table.concat(list, \",\")\nend\n\n-- Writ states for the character you are on: what is in the journal now, plus writs finished\n-- earlier (kept until they are from before today's reset).\nlocal function Read(c)\n    local previous, writs, inJournal = c.writs, {}, {}\n    for journalIndex = 1, MAX_JOURNAL_QUESTS do\n        if IsValidQuestIndex(journalIndex) and IsDailyWrit(journalIndex) then\n            local craft, state = ReadWrit(journalIndex)\n            if craft then\n                local old = previous and previous[craft]\n                writs[craft] = { state = state, at = (old and old.state == state and old.at) or GetTimeStamp() }\n                inJournal[craft] = true\n            end\n        end\n    end\n    for craft, entry in pairs(previous or {}) do\n        if not inJournal[craft] and entry.state == Daily.DONE then writs[craft] = entry end\n    end\n    c.writs = writs\n    ReadCertified(c)\nend\n\nlocal function Start(queue, current)\n    local function Register(suffix, event, fn) EVENT_MANAGER:RegisterForEvent(CT.name .. \"Writ\" .. suffix, event, fn) end\n    -- Fires for every quest, on every objective tick: only a daily crafting writ is worth a look.\n    local function OnQuestChanged(_, journalIndex)\n        if IsValidQuestIndex(journalIndex) and IsDailyWrit(journalIndex) then queue(true) end\n    end\n    Register(\"Added\", EVENT_QUEST_ADDED, OnQuestChanged)\n    Register(\"Advanced\", EVENT_QUEST_ADVANCED, OnQuestChanged)\n    Register(\"Counter\", EVENT_QUEST_CONDITION_COUNTER_CHANGED, OnQuestChanged)\n    -- Handed in (done today) or abandoned (gone).\n    Register(\"Removed\", EVENT_QUEST_REMOVED, function(_, isCompleted, _, questName, _, _, questId)\n        local craft = (CT.sv.writQuestIds or {})[questId] or CraftFromName(questName)\n        local c = current()\n        if not craft or not c then return end\n        c.writs = c.writs or {}\n        c.writs[craft] = isCompleted and { state = Daily.DONE, at = GetTimeStamp() } or nil\n        queue(true)\n    end)\nend\n\n-- Columns --------------------------------------------------------------------------------------\n\nlocal columns = {}\nfor _, def in ipairs(Daily.CRAFTS) do\n    columns[#columns + 1] = {\n        key = \"writ.\" .. def.short, title = def.short, width = 74, max = Daily.DONE, bar = false,\n        head = function() return U.CraftName(def.craft) .. \" writ today: - not taken, Started, Deliver (ready to hand in) or Done.\" end,\n        value = function(e) return Daily.State(e.c, def.craft, CT.view.world) end,\n        display = function(v) return Daily.LABEL[v] end,\n        tip = function(e)\n            local world = CT.view.world\n            local entry, state = (e.c.writs or {})[def.craft], Daily.State(e.c, def.craft, world)\n            local craft = U.CraftName(def.craft)\n            local text = state == Daily.NONE and (craft .. \" writ: not taken today\")\n                or string.format(\"%s writ: %s (%s)\", craft, ({ \"started\", \"ready to deliver\", \"done today\" })[state], U.DayTime(entry.at))\n            return text .. \"\\nWrits reset daily at \" .. os.date(\"%I:%M %p\", Daily.LastReset(world) + 86400) .. \" your time.\"\n        end }\nend\ncolumns[#columns + 1] = {\n    key = \"writsDone\", title = \"Done\", width = 64, max = #Daily.CRAFTS,\n    head = \"Done: crafting writs turned in since today's reset, out of 7.\",\n    value = function(e) return (Daily.Count(e.c, CT.view.world)) end,\n    display = function(v) return U.Of(v, #Daily.CRAFTS) end,\n    tip = \"Crafting writs turned in since today's reset\" }\n\nCT.Track({\n    id = \"writs\",\n    read = Read,\n    start = Start,\n    columns = columns,\n    sections = function(e)\n        local world, now = CT.view.world, GetTimeStamp()\n        local items = {}\n        for _, def in ipairs(Daily.CRAFTS) do\n            local state = Daily.State(e.c, def.craft, world, now)\n            items[#items + 1] = { U.CraftName(def.craft) .. \" writ\", Daily.LABEL[state], done = state == Daily.DONE, dim = state == Daily.NONE }\n        end\n        return { { title = \"Daily\", id = \"daily\", items = items } }\n    end,\n})\n"}, {"name": "Trackers/Riding.lua", "text": "-- shared\n-- Riding: speed + stamina + carry capacity, and when the next lesson can be bought.\n--   c.riding, c.ridingMax    the three skills added up, and their top (180)\n--   c.ridingReadyAt          the moment the next lesson can be taken (0 = now); nil once riding is maxed\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nCT.Track({\n    id = \"riding\",\n    read = function(c)\n        local carry, carryMax, stamina, staminaMax, speed, speedMax = GetRidingStats()\n        c.riding, c.ridingMax = carry + stamina + speed, carryMax + staminaMax + speedMax\n        if c.riding >= c.ridingMax then\n            c.ridingReadyAt = nil\n        else\n            local ms = GetTimeUntilCanBeTrained() or 0\n            c.ridingReadyAt = ms > 0 and (GetTimeStamp() + math.ceil(ms / 1000)) or 0\n        end\n    end,\n    events = { EVENT_RIDING_SKILL_IMPROVEMENT },\n    columns = {\n        { key = \"riding\", title = \"Riding\", width = 72, max = function(e) return e.c.ridingMax or CT.RIDING_MAX end,\n          value = function(e) return e.c.riding or 0 end, tip = \"Speed + stamina + carry capacity\",\n          head = \"Riding: speed + stamina + carry capacity, out of \" .. CT.RIDING_MAX .. \" (60 each).\" },\n        { key = \"ridingLesson\", title = \"Riding lesson\", width = 110,\n          head = \"Riding lesson: time until this character can buy its next lesson at a stable.\\nReady = it can buy one now. Maxed = nothing left to learn.\",\n          value = function(e)\n              if not e.c.ridingReadyAt then return -1 end\n              return math.max(0, e.c.ridingReadyAt - GetTimeStamp())\n          end,\n          display = function(v) return v < 0 and \"Maxed\" or (v == 0 and \"Ready\" or U.Duration(v)) end,\n          gold = function(v) return v < 0 end,\n          tip = function(e)\n              local c = e.c\n              if not c.ridingReadyAt then return \"Riding maxed (\" .. (c.riding or 0) .. \" / \" .. (c.ridingMax or CT.RIDING_MAX) .. \")\" end\n              if c.ridingReadyAt <= GetTimeStamp() then return \"A riding lesson is ready: visit a stablemaster.\" end\n              return \"Next riding lesson at \" .. U.DayTime(c.ridingReadyAt)\n          end },\n    },\n    summary = function(e) return { CT.Trackers.Progress(\"Riding\", e.c.riding, e.c.ridingMax or CT.RIDING_MAX) } end,\n    sections = function(e)\n        local readyAt = e.c.ridingReadyAt\n        if not readyAt then return {} end\n        local ready = readyAt <= GetTimeStamp()\n        return { { title = \"Daily\", id = \"daily\", items = { { \"Riding lesson\", ready and \"Ready\" or \"at \" .. U.DayTime(readyAt), done = not ready } } } }\n    end,\n    export = { { \"Riding\", function(e) return e.c.riding end } },\n})\n"}, {"name": "Trackers/Activities.lua", "text": "-- shared\n-- Daily and weekly things outside crafting: the once-a-day reward of the dungeon finder,\n-- battlegrounds and Tales of Tribute, trial quests handed in, and the account's Challenges.\n--   c.rewardAt = { dungeon =, battleground =, tribute = }   when each daily reward can be earned again\n--                                                           (0 = it is waiting now)\n--   c.trials = { \"when;quest name\", ... }                   trial quests handed in, newest last\n--   account.challenges = { daily = \"done;total;resets at\", weekly = \"...\" }\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\nlocal REWARDS = {\n    { id = \"dungeon\", title = \"Dungeon\", what = \"random dungeon\",\n      bonus = \"The first random dungeon of the day, normal or veteran, pays a large XP bonus on top of the reward.\" },\n    { id = \"battleground\", title = \"Battleground\", what = \"battleground\",\n      bonus = \"The first battleground of the day pays a large XP bonus on top of the reward.\" },\n    { id = \"tribute\", title = \"Tribute\", what = \"Tales of Tribute match\" },\n}\nlocal TRIAL_DAYS = 7\nlocal TRIALS_KEPT = 20\n\n-- Seconds until a daily reward can be earned again: 0 = waiting now, nil = never read.\nlocal function RewardIn(c, id, now)\n    local at = (c.rewardAt or {})[id]\n    if not at then return nil end\n    return math.max(0, at - (now or GetTimeStamp()))\nend\n\n-- Trial quests handed in during the last week: { { at =, name = }, ... }, newest first.\nlocal function RecentTrials(c, now)\n    local list, cutoff = {}, (now or GetTimeStamp()) - TRIAL_DAYS * 86400\n    for index = #(c.trials or {}), 1, -1 do\n        local text = c.trials[index]\n        local at = string.find(text, \";\", 1, true)\n        local when = tonumber(string.sub(text, 1, (at or 1) - 1)) or 0\n        if when >= cutoff then list[#list + 1] = { at = when, name = string.sub(text, (at or 0) + 1) } end\n    end\n    return list\nend\n\n-- The account's Challenges as text for the Daily tab's top line, or nil when never read.\nlocal function ChallengeText(data, now)\n    local saved = (data.account or {}).challenges\n    if not saved then return nil end\n    local parts = {}\n    for _, kind in ipairs({ \"daily\", \"weekly\" }) do\n        local p = U.Split(saved[kind] or \"\", \";\")\n        local done, total, resetAt = tonumber(p[1]), tonumber(p[2]), tonumber(p[3]) or 0\n        if total and total > 0 then\n            if resetAt > 0 and resetAt <= now then\n                parts[#parts + 1] = kind .. \" challenges have reset since the last read\"\n            else\n                parts[#parts + 1] = string.format(\"%s challenges %d of %d done\", kind, done, total)\n            end\n        end\n    end\n    return #parts > 0 and table.concat(parts, \"  ·  \") or nil\nend\nCT.ChallengeText = ChallengeText\n\nlocal function RewardColumn(def)\n    return { key = \"reward.\" .. def.id, title = def.title, width = 96,\n             head = string.format(\"Today's reward for a %s from the group finder.%s\\nDone = earned, with the time until it can be earned again. Ready = waiting to be earned.\",\n                                  def.what, def.bonus and (\"\\n\" .. def.bonus) or \"\"),\n             value = function(e) return RewardIn(e.c, def.id) or -1 end,\n             display = function(v) return v < 0 and \"-\" or (v == 0 and \"Ready\" or \"Done\") end,\n             dim = function(v) return v < 0 end, gold = function(v) return v > 0 end,\n             tip = function(e)\n                 local left = RewardIn(e.c, def.id)\n                 if not left then return \"Not read yet: log in on this character once.\" end\n                 if left == 0 then\n                     return string.format(\"The daily %s reward is waiting%s.\", def.what, def.bonus and \", with its large XP bonus\" or \"\")\n                 end\n                 return string.format(\"Daily %s reward earned. The next one is ready in %s.\", def.what, U.Duration(left))\n             end }\nend\n\n-- Game only ---------------------------------------------------------------------------------\n\nlocal function Read(c, account)\n    local now = GetTimeStamp()\n    c.rewardAt = c.rewardAt or {}\n    local cooldowns = { dungeon = LFG_COOLDOWN_DUNGEON_REWARD_GRANTED, battleground = LFG_COOLDOWN_BATTLEGROUND_REWARD_GRANTED,\n                        tribute = LFG_COOLDOWN_TRIBUTE_REWARD_GRANTED }\n    for id, cooldown in pairs(cooldowns) do\n        local left = GetLFGCooldownTimeRemainingSeconds(cooldown)\n        c.rewardAt[id] = left > 0 and (now + left) or 0\n    end\n    if IsTimedActivitySystemAvailable() then\n        local count = { [TIMED_ACTIVITY_TYPE_DAILY] = { 0, 0 }, [TIMED_ACTIVITY_TYPE_WEEKLY] = { 0, 0 } }\n        for index = 1, GetNumTimedActivities() do\n            local tally = count[GetTimedActivityType(index)]\n            if tally then\n                tally[2] = tally[2] + 1\n                if GetTimedActivityProgress(index) >= GetTimedActivityMaxProgress(index) then tally[1] = tally[1] + 1 end\n            end\n        end\n        local daily, weekly = count[TIMED_ACTIVITY_TYPE_DAILY], count[TIMED_ACTIVITY_TYPE_WEEKLY]\n        account.challenges = {\n            daily = table.concat({ daily[1], daily[2], GetTimedActivityTypeResetTimeS(TIMED_ACTIVITY_TYPE_DAILY) }, \";\"),\n            weekly = table.concat({ weekly[1], weekly[2], GetTimedActivityTypeResetTimeS(TIMED_ACTIVITY_TYPE_WEEKLY) }, \";\"),\n        }\n    end\nend\n\nlocal function Start(queue, current)\n    EVENT_MANAGER:RegisterForEvent(CT.name .. \"Trial\", EVENT_QUEST_COMPLETE, function(_, questName, _, _, _, _, questType)\n        local c = current()\n        if questType ~= QUEST_TYPE_RAID or not c then return end\n        c.trials = c.trials or {}\n        c.trials[#c.trials + 1] = GetTimeStamp() .. \";\" .. U.Clean(U.Plain(questName))\n        if #c.trials > TRIALS_KEPT then table.remove(c.trials, 1) end\n        queue()\n    end)\nend\n\nlocal columns = {}\nfor _, def in ipairs(REWARDS) do columns[#columns + 1] = RewardColumn(def) end\ncolumns[#columns + 1] = {\n    key = \"trials\", title = \"Trials\", width = 96,\n    head = \"Trials: trial quests this character handed in during the last 7 days.\\nCounted from the day you started using this version.\",\n    value = function(e) return #RecentTrials(e.c) end,\n    display = function(v) return v == 0 and \"-\" or U.Whole(v) end, dim = function(v) return v == 0 end,\n    tip = function(e)\n        local list = RecentTrials(e.c)\n        if #list == 0 then return \"No trial quest handed in during the last 7 days.\" end\n        local lines = { \"Trial quests handed in, last 7 days\" }\n        for _, trial in ipairs(list) do lines[#lines + 1] = string.format(\"  %s  (%s)\", trial.name, U.DayTime(trial.at)) end\n        return table.concat(lines, \"\\n\")\n    end }\n\nCT.Track({\n    id = \"activities\",\n    read = Read,\n    start = Start,\n    events = { EVENT_ACTIVITY_FINDER_COOLDOWNS_UPDATE, EVENT_TIMED_ACTIVITIES_UPDATED, EVENT_TIMED_ACTIVITY_PROGRESS_UPDATED },\n    columns = columns,\n    sections = function(e)\n        local items, now = {}, GetTimeStamp()\n        for _, def in ipairs(REWARDS) do\n            local left = RewardIn(e.c, def.id, now)\n            if left then\n                items[#items + 1] = { \"Daily \" .. def.what .. (def.bonus and \" reward and XP bonus\" or \" reward\"),\n                                      left == 0 and \"Ready\" or \"Done\", done = left > 0 }\n            end\n        end\n        local trials = #RecentTrials(e.c, now)\n        if trials > 0 then items[#items + 1] = { \"Trial quests, last 7 days\", U.Whole(trials) } end\n        if #items == 0 then return nil end\n        return { { id = \"daily\", title = \"Daily\", items = items } }\n    end,\n})\n"}, {"name": "Trackers/Weekly.lua", "text": "-- shared\n-- The weekly leaderboards: the weekly trial, the weekly arena challenge, Infinite\n-- Archive (solo and duo), the battleground leaderboard, and the Cyrodiil campaign reward tier.\n-- Since Update 48 a leaderboard holds one entry per ACCOUNT (its best score) and 500 places, so the\n-- score and place are saved for the account, and each character only keeps whether it ran it.\n-- Everything is saved with the moment its week ends, so it empties by itself at the turnover:\n--   account.weekly = { trial = \"ends at;score;place;state;credited;name\", arena =,\n--                      archiveSolo =, archiveDuo =, battleground = }       place 0 = not on the leaderboard\n--   c.weekly = { the same texts as read on this character: only state is used (0 = not started,\n--                1 = started, 2 = completed), and cyrodiil = \"ends at;tier;progress;needed;0;campaign\" }\nlocal CT = FurysCharacterTracker\nlocal U = CT.Util\n\n-- `named`: the game picks a different one each week, and the column title is its name.\nlocal BOARDS = {\n    { id = \"trial\", title = \"Weekly trial\", width = 190, what = \"the weekly trial (a trial, or some weeks a group arena)\", named = true },\n    { id = \"arena\", title = \"Weekly arena\", width = 190, what = \"the weekly arena challenge\", named = true },\n    { id = \"archiveSolo\", title = \"Archive solo\", width = 150, what = \"Infinite Archive, solo\" },\n    { id = \"archiveDuo\", title = \"Archive duo\", width = 150, what = \"Infinite Archive, duo\" },\n    { id = \"battleground\", title = \"Battlegrounds\", width = 150, what = \"the battleground leaderboard\", noRun = true },\n}\nlocal STARTED, COMPLETED = 1, 2\n-- The leaderboard rewards are mailed to the accounts on the final standings, and a leaderboard\n-- holds this many places (Update 48). A place past it, or no place, needs a better run.\nlocal REWARD_PLACES = 500\nlocal AMBER = \"|cFFC857\"\n\n-- One saved board: nil when never read, { over = true } when its week has ended since the read,\n-- else { endsAt =, score =, place =, state =, credited =, name = }.\nlocal function Parse(text, now)\n    if not text then return nil end\n    local p = U.Split(text, \";\")\n    local endsAt = tonumber(p[1]) or 0\n    if endsAt <= (now or GetTimeStamp()) then return { over = true } end\n    return { endsAt = endsAt, score = tonumber(p[2]) or 0, place = tonumber(p[3]) or 0, state = tonumber(p[4]) or 0,\n             credited = p[5] == \"1\", name = p[6] or \"\" }\nend\nlocal function Board(c, id, now) return Parse((c.weekly or {})[id], now) end\nlocal function AccountBoard(id, now) return Parse(((CT.Data().account or {}).weekly or {})[id], now) end\n\n-- What a board is called: this week's name for the two the game rotates, once it has been read.\nlocal function Title(def)\n    if def.named then\n        local board = AccountBoard(def.id)\n        if board and not board.over and board.name ~= \"\" then return board.name end\n    end\n    return def.title\nend\n\n-- A score that earns no leaderboard reward as it stands.\nlocal function NeedsBetterRun(board)\n    return board ~= nil and not board.over and board.score > 0 and (board.place == 0 or board.place > REWARD_PLACES)\nend\n\n-- \"187,654  #42\" for the account, or \"-\".\nlocal function ScoreText(board)\n    if not board or board.over or board.score == 0 then return \"-\" end\n    return U.Comma(board.score) .. (board.place > 0 and (\"  #\" .. board.place) or \"  no place\")\nend\n\nlocal function StateText(board, def)\n    if not board or board.over or def.noRun then return \"-\" end\n    if board.state == COMPLETED then return \"Done\" end\n    if board.state == STARTED then return \"Started\" end\n    return \"-\"\nend\n\nlocal function BoardTip(c, def)\n    local mine, account = Board(c, def.id), AccountBoard(def.id)\n    local live = (account and not account.over) and account or nil\n    local name = (def.named and live and live.name ~= \"\") and live.name or nil\n    local lines = { name and string.format(\"%s: %s\", def.title, name) or (string.gsub(def.what, \"^%l\", string.upper)) }\n    if not def.noRun then\n        if not mine then\n            lines[#lines + 1] = \"This character: not read yet. Log in on it once.\"\n        elseif mine.over then\n            lines[#lines + 1] = \"This character: not read since the new week started.\"\n        else\n            lines[#lines + 1] = \"This character: \" .. (mine.state == COMPLETED and \"completed it this week.\" or (mine.state == STARTED and \"started it this week, not completed.\" or \"not run this week.\"))\n        end\n    end\n    if not live or live.score == 0 then\n        lines[#lines + 1] = \"This account: no score this week.\"\n    else\n        lines[#lines + 1] = string.format(\"This account: best score %s, %s.\", U.Comma(live.score), live.place > 0 and (\"place \" .. live.place) or \"no place on the leaderboard\")\n        if NeedsBetterRun(live) then\n            lines[#lines + 1] = string.format(\"The leaderboard rewards go to the top %d accounts, so this needs a better run.\", REWARD_PLACES)\n        else\n            lines[#lines + 1] = string.format(\"Inside the top %d, where the leaderboard rewards go. The place can move while others play.\", REWARD_PLACES)\n        end\n    end\n    if live then lines[#lines + 1] = \"The week ends in \" .. U.Duration(live.endsAt - GetTimeStamp()) .. \".\" end\n    lines[#lines + 1] = \"A leaderboard keeps one entry per account: its best score. It is on the bottom row
